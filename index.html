<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>زبان شیرین</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  background:#050d1a;
  color:white;
}

button,input,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   صفحه ورود
========================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:500px;
  background:#09182b;
  border:1px solid #24537f;
  border-radius:22px;
  padding:30px;
  box-shadow:0 15px 50px #0008;
}

.logo{
  text-align:center;
  color:#ffd21c;
  font-size:32px;
  font-weight:bold;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#9fb3c9;
  margin-bottom:30px;
}

input,textarea{
  width:100%;
  padding:15px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #28577f;
  background:#061321;
  color:white;
  outline:none;
}

input:focus,textarea:focus{
  border-color:#ffd21c;
}

.btn{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  margin:5px;
  background:#126ac3;
  color:white;
  font-weight:bold;
}

.yellow{
  background:#ffd21c;
  color:#111;
}

.red{
  background:#d53d47;
}

.green{
  background:#159653;
}

.gray{
  background:#263d58;
}

/* =========================
   صفحه اصلی
========================= */

#mainPage{
  min-height:100vh;
}

.topbar{
  height:70px;
  background:#071425;
  border-bottom:1px solid #214b73;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 4%;
}

.top-logo{
  color:#ffd21c;
  font-weight:bold;
  font-size:22px;
}

.page{
  width:min(1000px,94%);
  margin:auto;
  padding:20px 0;
}

.card{
  background:#09182b;
  border:1px solid #24537f;
  border-radius:18px;
  padding:20px;
  margin:15px 0;
}

.class-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

.class-card{
  background:#071426;
  border:1px solid #24547e;
  border-radius:15px;
  padding:18px;
}

.class-title{
  color:#ffd21c;
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

/* =========================
   فضای جداگانه کلاس
========================= */

#classroomPage{
  position:fixed;
  inset:0;
  z-index:999999;
  background:#020812;
  display:none;
  flex-direction:column;
  min-height:100vh;
}

#classroomPage.open{
  display:flex;
}

/* هدر کلاس */

.room-header{
  height:65px;
  flex-shrink:0;
  background:#071425;
  border-bottom:1px solid #214b73;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 15px;
}

.room-title{
  color:#ffd21c;
  font-size:19px;
  font-weight:bold;
}

.room-body{
  flex:1;
  overflow:auto;
  padding:15px;
}

/* ویدیوها */

.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.video-box{
  position:relative;
  min-height:180px;
  background:#000;
  border:1px solid #244b70;
  border-radius:14px;
  overflow:hidden;
}

.video-box video{
  width:100%;
  height:100%;
  min-height:180px;
  object-fit:cover;
  background:#000;
}

.video-name{
  position:absolute;
  right:8px;
  bottom:8px;
  background:#000b;
  padding:7px 10px;
  border-radius:8px;
}

/* چت */

.chat{
  background:#040d18;
  border:1px solid #20486c;
  border-radius:14px;
  padding:12px;
  margin-top:15px;
}

.chat-messages{
  height:180px;
  overflow:auto;
  margin-bottom:8px;
}

.message{
  padding:8px;
  border-bottom:1px solid #1b344d;
}

/* تخته */

#board{
  width:100%;
  height:420px;
  background:white;
  border-radius:14px;
  margin-top:15px;
  touch-action:none;
}

/* کنترل‌ها */

.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:5px;
  padding:8px;
  background:#071425;
  border-top:1px solid #214b73;
}

.controls .btn{
  margin:2px;
}

/* موبایل */

@media(max-width:600px){
  .video-grid{
    grid-template-columns:1fr;
  }

  .video-box{
    min-height:210px;
  }

  #board{
    height:330px;
  }

  .room-title{
    font-size:16px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginPage">

  <div class="login-box">

    <div class="logo">🍯 زبان شیرین</div>

    <div class="subtitle">
      سامانه کلاس آنلاین زبان
    </div>

    <h2>ورود به زبان شیرین 🎓</h2>

    <input
      id="username"
      placeholder="نام کاربری">

    <input
      id="password"
      type="password"
      placeholder="رمز عبور">

    <button
      class="btn yellow"
      style="width:100%"
      onclick="login()">
      ورود
    </button>

    <div id="loginMessage"></div>

  </div>

</section>


<!-- =====================================================
     MAIN PAGE
===================================================== -->

<section id="mainPage" class="hidden">

  <header class="topbar">

    <div class="top-logo">
      🍯 زبان شیرین
    </div>

    <button
      class="btn red"
      onclick="logout()">
      خروج
    </button>

  </header>

  <main class="page">

    <div class="card">

      <h2 id="welcome"></h2>

      <p>
        کلاس موردنظر خود را انتخاب کنید.
      </p>

    </div>


    <!-- ایجاد کلاس -->

    <div class="card">

      <h2>👨‍🏫 ایجاد کلاس</h2>

      <input
        id="className"
        placeholder="نام کلاس">

      <input
        id="classPassword"
        placeholder="رمز کلاس"
        type="password">

      <button
        class="btn green"
        onclick="createClass()">
        ➕ ایجاد کلاس
      </button>

    </div>


    <!-- کلاس‌ها -->

    <div class="card">

      <h2>🏫 کلاس‌ها</h2>

      <div id="classList" class="class-grid">

        <div class="class-card">

          <div class="class-title">
            کلاس نمونه زبان انگلیسی
          </div>

          <p>
            کلاس آنلاین
          </p>

          <button
            class="btn yellow"
            onclick="enterClass('کلاس نمونه زبان انگلیسی')">
            🚪 ورود به کلاس
          </button>

        </div>

      </div>

    </div>

  </main>

</section>


<!-- =====================================================
     CLASSROOM
     این قسمت کاملاً جدا از صفحه اصلی است
===================================================== -->

<section id="classroomPage">

  <header class="room-header">

    <div class="room-title">
      🍯 زبان شیرین | <span id="roomName">کلاس</span>
    </div>

    <button
      class="btn red"
      onclick="leaveClass()">
      🚪 خروج از کلاس
    </button>

  </header>


  <div class="room-body">

    <!-- ویدیو -->

    <div class="card">

      <h3>🎥 شرکت‌کنندگان</h3>

      <div class="video-grid">

        <div class="video-box">

          <video
            id="localVideo"
            autoplay
            muted
            playsinline>
          </video>

          <div class="video-name">
            شما
          </div>

        </div>


        <div class="video-box">

          <video
            id="remoteVideo"
            autoplay
            playsinline>
          </video>

          <div class="video-name">
            شرکت‌کننده
          </div>

        </div>

      </div>

    </div>


    <!-- تخته -->

    <div class="card">

      <h3>📝 تخته کلاس</h3>

      <canvas id="board"></canvas>

    </div>


    <!-- چت -->

    <div class="chat">

      <h3>💬 چت کلاس</h3>

      <div
        id="messages"
        class="chat-messages">
      </div>

      <input
        id="messageInput"
        placeholder="پیام خود را بنویسید...">

      <button
        class="btn"
        onclick="sendMessage()">
        ارسال
      </button>

    </div>

  </div>


  <!-- کنترل‌های کلاس -->

  <div class="controls">

    <button
      class="btn gray"
      onclick="toggleMic()">
      🎤 میکروفون
    </button>

    <button
      class="btn gray"
      onclick="toggleCamera()">
      📷 دوربین
    </button>

    <button
      class="btn gray"
      onclick="flipCamera()">
      🔄 چرخش دوربین
    </button>

    <button
      class="btn gray"
      onclick="shareScreen()">
      🖥 اشتراک صفحه
    </button>

    <button
      class="btn gray"
      onclick="clearBoard()">
      🗑 پاک کردن تخته
    </button>

  </div>

</section>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://uqqumhmzndgyoigcqnti.supabase.co";

const SUPABASE_KEY =
"sb_publishable_R3LAX7EYbdYUwjQRgkmesA_QJ2ZmPtD";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let localStream = null;

let cameraMode = "user";

let micOn = true;

let cameraOn = true;


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  if(!username || !password){

    document.getElementById("loginMessage").innerHTML =
      "<p style='color:#ff9da5'>نام کاربری و رمز عبور را وارد کنید.</p>";

    return;
  }

  document.getElementById("loginMessage").innerHTML =
    "<p>در حال ورود...</p>";

  try{

    const {data,error} =
      await db.rpc(
        "login_username",
        {
          p_username:username,
          p_password:password
        }
      );

    if(error)
      throw error;

    let result =
      Array.isArray(data) ? data[0] : data;

    if(typeof result === "string"){
      result = JSON.parse(result);
    }

    if(result?.error){

      document.getElementById("loginMessage").innerHTML =
        "<p style='color:#ff9da5'>"+
        result.error+
        "</p>";

      return;
    }

    if(!result?.user_id){

      throw new Error("ورود ناموفق بود.");
    }

    currentUser = {
      id:result.user_id,
      name:result.name,
      username:result.username,
      role:result.role
    };

    localStorage.setItem(
      "lesson_user",
      JSON.stringify(currentUser)
    );

    showMain();

  }catch(error){

    document.getElementById("loginMessage").innerHTML =
      "<p style='color:#ff9da5'>"+
      error.message+
      "</p>";

  }
}


/* =====================================================
   MAIN
===================================================== */

function showMain(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("mainPage")
    .classList.remove("hidden");

  document
    .getElementById("welcome")
    .textContent =
      "سلام "+
      (currentUser?.name || "")+
      " 👋";
}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

  leaveClass(true);

  localStorage.removeItem("lesson_user");

  currentUser = null;

  document
    .getElementById("mainPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");
}


/* =====================================================
   CREATE CLASS
===================================================== */

function createClass(){

  const name =
    document.getElementById("className").value.trim();

  if(!name){

    alert("نام کلاس را وارد کنید.");

    return;
  }

  const box =
    document.createElement("div");

  box.className = "class-card";

  box.innerHTML = `
    <div class="class-title">${escapeHTML(name)}</div>

    <p>کلاس آنلاین</p>

    <button
      class="btn yellow"
      onclick="enterClass('${escapeJS(name)}')">
      🚪 ورود به کلاس
    </button>
  `;

  document
    .getElementById("classList")
    .prepend(box);

  document.getElementById("className").value = "";
}


/* =====================================================
   ورود به کلاس
   صفحه اصلی کاملاً مخفی می‌شود
===================================================== */

async function enterClass(name){

  document
    .getElementById("mainPage")
    .classList.add("hidden");

  document
    .getElementById("classroomPage")
    .classList.add("open");

  document
    .getElementById("roomName")
    .textContent = name;

  document.body.style.overflow = "hidden";

  await startCamera();
}


/* =====================================================
   خروج از کلاس
===================================================== */

function leaveClass(silent=false){

  const room =
    document.getElementById("classroomPage");

  room.classList.remove("open");

  document.body.style.overflow = "";

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>track.stop());

    localStream = null;
  }

  if(!silent){

    document
      .getElementById("mainPage")
      .classList.remove("hidden");

  }
}


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

  try{

    localStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:cameraMode
        },
        audio:true
      });

    document
      .getElementById("localVideo")
      .srcObject = localStream;

  }catch(error){

    alert(
      "دسترسی دوربین و میکروفون داده نشد."
    );

  }
}


/* =====================================================
   MIC
===================================================== */

function toggleMic(){

  if(!localStream)return;

  const tracks =
    localStream.getAudioTracks();

  if(!tracks.length)return;

  micOn = !micOn;

  tracks.forEach(
    track=>track.enabled=micOn
  );
}


/* =====================================================
   CAMERA
===================================================== */

function toggleCamera(){

  if(!localStream)return;

  const tracks =
    localStream.getVideoTracks();

  if(!tracks.length)return;

  cameraOn = !cameraOn;

  tracks.forEach(
    track=>track.enabled=cameraOn
  );
}


/* =====================================================
   FLIP CAMERA
===================================================== */

async function flipCamera(){

  if(!localStream)return;

  cameraMode =
    cameraMode === "user"
      ? "environment"
      : "user";

  try{

    const newStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:cameraMode
        },
        audio:false
      });

    const newTrack =
      newStream.getVideoTracks()[0];

    const oldTrack =
      localStream.getVideoTracks()[0];

    if(oldTrack){

      localStream.removeTrack(oldTrack);

      oldTrack.stop();
    }

    localStream.addTrack(newTrack);

    document
      .getElementById("localVideo")
      .srcObject = localStream;

  }catch(error){

    alert(
      "چرخش دوربین در این دستگاه پشتیبانی نشد."
    );

  }
}


/* =====================================================
   SCREEN SHARE
===================================================== */

async function shareScreen(){

  if(!navigator.mediaDevices?.getDisplayMedia){

    alert(
      "اشتراک صفحه در این مرورگر پشتیبانی نمی‌شود."
    );

    return;
  }

  try{

    const screen =
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:false
      });

    const video =
      document.getElementById("localVideo");

    video.srcObject = screen;

    const track =
      screen.getVideoTracks()[0];

    track.onended = ()=>{

      if(localStream){

        video.srcObject =
          localStream;
      }

    };

  }catch(error){}

}


/* =====================================================
   CHAT
===================================================== */

function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text)return;

  const box =
    document.createElement("div");

  box.className = "message";

  box.innerHTML =
    "<b>"+
    escapeHTML(currentUser?.name || "شما")+
    ":</b> "+
    escapeHTML(text);

  document
    .getElementById("messages")
    .appendChild(box);

  input.value = "";

  document
    .getElementById("messages")
    .scrollTop =
      document
      .getElementById("messages")
      .scrollHeight;
}


/* =====================================================
   WHITEBOARD
===================================================== */

const board =
  document.getElementById("board");

const ctx =
  board.getContext("2d");

let drawing = false;

function resizeBoard(){

  board.width =
    board.clientWidth;

  board.height =
    board.clientHeight;

  ctx.lineWidth = 3;

  ctx.strokeStyle = "#111";

}

resizeBoard();

window.addEventListener(
  "resize",
  resizeBoard
);


function boardPoint(e){

  const rect =
    board.getBoundingClientRect();

  return {
    x:e.clientX-rect.left,
    y:e.clientY-rect.top
  };

}


board.addEventListener(
  "pointerdown",
  e=>{

    drawing = true;

    const p =
      boardPoint(e);

    ctx.beginPath();

    ctx.moveTo(
      p.x,
      p.y
    );

  }
);


board.addEventListener(
  "pointermove",
  e=>{

    if(!drawing)return;

    const p =
      boardPoint(e);

    ctx.lineTo(
      p.x,
      p.y
    );

    ctx.stroke();

  }
);


board.addEventListener(
  "pointerup",
  ()=>{

    drawing = false;

    ctx.closePath();

  }
);


function clearBoard(){

  ctx.clearRect(
    0,
    0,
    board.width,
    board.height
  );

}


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeJS(text){

  return String(text)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}


/* =====================================================
   RESTORE LOGIN
===================================================== */

try{

  const saved =
    localStorage.getItem("lesson_user");

  if(saved){

    currentUser =
      JSON.parse(saved);

    showMain();

  }

}catch(error){

  localStorage.removeItem("lesson_user");

}

</script>

</body>
</html>
