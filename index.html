<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d18">

<title>English Class Online</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070b13;
    color:#fff;
    font-family:Tahoma,Arial,sans-serif;
}

button,
input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   LOGIN
========================= */

#loginPage{
    position:fixed;
    inset:0;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(
            circle at 50% 0%,
            #334b91 0,
            #10182c 42%,
            #070b13 80%
        );
}

.loginBox{
    width:100%;
    max-width:430px;
    padding:28px;
    border:1px solid #34415f;
    border-radius:24px;
    background:#141b2d;
    box-shadow:0 25px 80px #000b;
}

.logo{
    text-align:center;
    font-size:29px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aeb9d0;
    margin-bottom:25px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#bdc7db;
}

.field input{
    width:100%;
    height:48px;
    padding:0 14px;
    border-radius:12px;
    border:1px solid #394664;
    outline:0;
    color:#fff;
    background:#0b111e;
}

.field input:focus{
    border-color:#647cff;
}

.primary{
    width:100%;
    height:48px;
    border-radius:12px;
    background:#536dff;
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

.secondary{
    width:100%;
    height:45px;
    margin-top:10px;
    border-radius:12px;
    background:#29344d;
    color:#fff;
}

.message{
    min-height:22px;
    margin-top:12px;
    text-align:center;
    color:#ffb5b5;
}

/* =========================
   APP
========================= */

#app{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:64px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    background:#10172a;
    border-bottom:1px solid #29344e;
}

.brand{
    font-weight:bold;
    font-size:18px;
}

.userInfo{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:36px;
    height:36px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:#536dff;
    font-weight:bold;
}

.logout{
    padding:9px 12px;
    border-radius:9px;
    color:#fff;
    background:#29344e;
}

.dashboard{
    flex:1;
    overflow:auto;
    padding:18px;
}

.dashboardGrid{
    width:100%;
    max-width:1150px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(
        auto-fit,
        minmax(280px,1fr)
    );
    gap:15px;
}

.card{
    padding:18px;
    border-radius:18px;
    border:1px solid #2c3855;
    background:#151d30;
}

.card h2{
    margin:0 0 13px;
}

.cardTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.smallBtn{
    min-height:38px;
    padding:8px 12px;
    border-radius:9px;
    background:#293550;
    color:#fff;
}

.blue{
    background:#536dff;
}

.green{
    background:#168a67;
}

.red{
    background:#c83d51;
}

.item{
    margin-top:10px;
    padding:13px;
    border-radius:13px;
    border:1px solid #2a3652;
    background:#0d1321;
}

.itemTitle{
    font-weight:bold;
    margin-bottom:7px;
}

.itemButtons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
}

/* =========================
   MEETING
========================= */

#meeting{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    background:#060a12;
}

.meetingHeader{
    height:62px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 12px;
    background:#10172a;
    border-bottom:1px solid #29344f;
}

.meetingTitle{
    font-weight:bold;
}

.meetingPeople{
    margin-top:3px;
    font-size:11px;
    color:#a8b3c9;
}

.meetingMain{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
}

.videoArea{
    flex:1;
    min-width:0;
    min-height:0;
    overflow:auto;
    padding:10px;
}

.videoGrid{
    width:100%;
    min-height:100%;
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px,1fr)
        );
    gap:10px;
    align-content:center;
}

.videoBox{
    position:relative;
    min-height:160px;
    aspect-ratio:16/10;
    overflow:hidden;
    border-radius:15px;
    border:1px solid #2d3956;
    background:#0c121e;
}

.videoBox video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    background:#070b13;
}

.videoName{
    position:absolute;
    right:8px;
    bottom:8px;
    max-width:75%;
    padding:6px 9px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    border-radius:8px;
    background:#000b;
    font-size:12px;
}

.videoStatus{
    position:absolute;
    left:8px;
    bottom:8px;
    padding:6px 8px;
    border-radius:8px;
    background:#000b;
    font-size:11px;
}

.connectionBadge{
    position:absolute;
    left:8px;
    top:8px;
    padding:5px 7px;
    border-radius:7px;
    background:#000b;
    font-size:10px;
}

/* =========================
   CHAT
========================= */

.meetingChat{
    width:330px;
    flex:none;
    display:flex;
    flex-direction:column;
    background:#10172a;
    border-right:1px solid #29344f;
}

.chatHeader{
    height:52px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 11px;
    border-bottom:1px solid #29344f;
}

.chatMessages{
    flex:1;
    overflow:auto;
    padding:11px;
}

.chatMsg{
    margin-bottom:8px;
    padding:9px;
    border-radius:11px;
    background:#202a43;
}

.chatMsgName{
    margin-bottom:4px;
    color:#aab7ff;
    font-size:11px;
}

.chatMsgText{
    word-break:break-word;
    line-height:1.6;
}

.chatInput{
    display:flex;
    gap:7px;
    padding:9px;
    border-top:1px solid #29344f;
}

.chatInput input{
    flex:1;
    min-width:0;
    height:42px;
    padding:0 10px;
    border-radius:9px;
    border:1px solid #34415d;
    outline:0;
    color:#fff;
    background:#090f1b;
}

.chatInput button{
    padding:0 13px;
    border-radius:9px;
    background:#536dff;
    color:#fff;
}

/* =========================
   CONTROLS
========================= */

.controls{
    min-height:78px;
    flex:none;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:9px;
    padding:9px;
    background:#10172a;
    border-top:1px solid #29344f;
}

.control{
    width:48px;
    height:48px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:#293550;
    color:#fff;
    font-size:19px;
}

.control.active{
    background:#536dff;
}

.control.recording{
    background:#c72f47;
    animation:recordPulse 1s infinite;
}

.control.danger{
    width:auto;
    padding:0 18px;
    border-radius:25px;
    background:#d54155;
}

@keyframes recordPulse{
    50%{
        opacity:.5;
    }
}

/* =========================
   RECORDING
========================= */

.recordInfo{
    position:absolute;
    z-index:50;
    left:12px;
    top:72px;
    padding:7px 11px;
    border-radius:9px;
    background:#ba263f;
    font-size:12px;
}

/* =========================
   AUDIO BUTTON
========================= */

.audioUnlock{
    position:absolute;
    z-index:100;
    top:72px;
    right:12px;
    padding:9px 12px;
    border-radius:10px;
    background:#536dff;
    color:#fff;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:5000;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:18px;
    background:#000c;
}

.modalBox{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    padding:20px;
    border-radius:18px;
    border:1px solid #34415d;
    background:#171f32;
}

.modalBox h3{
    margin-top:0;
}

.modalBox video{
    width:100%;
    border-radius:12px;
    background:#000;
}

.modalText{
    line-height:1.8;
    color:#c0c9da;
}

.downloadBtn{
    display:block;
    width:100%;
    margin-top:10px;
    padding:13px;
    text-align:center;
    text-decoration:none;
    border-radius:10px;
    background:#536dff;
    color:#fff;
}

.modalClose{
    width:100%;
    margin-top:10px;
    padding:12px;
    border-radius:10px;
    background:#293550;
    color:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .topbar{
        height:58px;
    }

    .brand{
        font-size:14px;
    }

    .userInfo{
        font-size:11px;
    }

    .dashboard{
        padding:11px;
    }

    .meetingChat{
        position:absolute;
        inset:0;
        z-index:300;
        width:100%;
    }

    .meetingChat.closed{
        display:none;
    }

    .videoGrid{
        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
        align-content:start;
    }

    .videoBox{
        min-height:125px;
    }

    .controls{
        min-height:70px;
    }

    .control{
        width:44px;
        height:44px;
    }

    .control.danger{
        padding:0 13px;
    }
}

@media(max-width:390px){

    .videoGrid{
        grid-template-columns:1fr;
    }

    .videoBox{
        min-height:180px;
    }

}
</style>
</head>

<body>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://uqqumhmzndgyoigcqnti.supabase.co";

const SUPABASE_KEY =
"sb_publishable_R3LAX7EYbdYUwjQRgkmesA_QJ2ZmPtD";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentUser = null;

let currentMeeting = null;

let currentGroup = null;

let localStream = null;

let screenStream = null;

let originalCameraTrack = null;

let peers = {};

let remoteStreams = {};

let pendingCandidates = {};

let reconnectTimers = {};

let presenceChannel = null;

let signalChannel = null;

let meetingChatChannel = null;

let isRecording = false;

let recorder = null;

let recordedChunks = [];

let recordingTimer = null;

let recordingStartedAt = 0;

let recordCanvas = null;

let recordCanvasCtx = null;

let recordAnimation = null;

let recordAudioContext = null;

let recordAudioDestination = null;

let recordAudioSources = [];

let isScreenSharing = false;


/* =====================================================
   WEBRTC CONFIG
===================================================== */

const rtcConfig = {

    iceServers:[
        {
            urls:[
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
            ]
        }
    ]

};


/* =====================================================
   UTILITY
===================================================== */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function setMessage(text){

    document
        .getElementById("loginMessage")
        .textContent = text;

}


/* =====================================================
   LOGIN / REGISTER UI
===================================================== */

function showRegister(){

    document
        .getElementById("loginForm")
        .classList
        .add("hidden");

    document
        .getElementById("registerForm")
        .classList
        .remove("hidden");

    setMessage("");

}


function showLogin(){

    document
        .getElementById("registerForm")
        .classList
        .add("hidden");

    document
        .getElementById("loginForm")
        .classList
        .remove("hidden");

    setMessage("");

}


/* =====================================================
   REGISTER
===================================================== */

async function registerUser(){

    const name =
        document
            .getElementById("registerName")
            .value
            .trim();

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;


    if(!name || !username || !password){

        setMessage(
            "همه قسمت‌ها را پر کن."
        );

        return;

    }


    const {data:exists,error:existsError} =
        await supabaseClient
            .from("users")
            .select("id")
            .eq("username",username)
            .maybeSingle();


    if(existsError){

        setMessage(
            existsError.message
        );

        return;

    }


    if(exists){

        setMessage(
            "این نام کاربری قبلاً ثبت شده."
        );

        return;

    }


    const {data,error} =
        await supabaseClient
            .from("users")
            .insert({
                name:name,
                username:username,
                password:password
            })
            .select()
            .single();


    if(error){

        setMessage(
            error.message
        );

        return;

    }


    currentUser = data;


    localStorage.setItem(
        "englishClassUser",
        JSON.stringify(currentUser)
    );


    openApp();

}


/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    if(!username || !password){

        setMessage(
            "نام کاربری و رمز عبور را وارد کن."
        );

        return;

    }


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled = true;

    button.textContent =
        "در حال ورود...";


    const {data,error} =
        await supabaseClient
            .from("users")
            .select("*")
            .eq("username",username)
            .eq("password",password)
            .maybeSingle();


    button.disabled = false;

    button.textContent =
        "ورود";


    if(error){

        setMessage(
            error.message
        );

        return;

    }


    if(!data){

        setMessage(
            "نام کاربری یا رمز عبور اشتباه است."
        );

        return;

    }


    currentUser = data;


    localStorage.setItem(
        "englishClassUser",
        JSON.stringify(currentUser)
    );


    openApp();

}


/* =====================================================
   OPEN APP
===================================================== */

async function openApp(){

    document
        .getElementById("loginPage")
        .classList
        .add("hidden");


    document
        .getElementById("app")
        .classList
        .remove("hidden");


    document
        .getElementById("topUserName")
        .textContent =
            currentUser.name;


    document
        .getElementById("topAvatar")
        .textContent =
            currentUser.name
                .charAt(0)
                .toUpperCase();


    await loadGroups();

    await loadMeetings();

    await loadRecordings();

}


/* =====================================================
   AUTO LOGIN
===================================================== */

window.addEventListener(
    "load",
    async function(){

        const saved =
            localStorage.getItem(
                "englishClassUser"
            );


        if(!saved)
            return;


        try{

            currentUser =
                JSON.parse(saved);

            await openApp();

        }catch(error){

            localStorage.removeItem(
                "englishClassUser"
            );

        }

    }
);


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    if(currentMeeting){

        await leaveMeeting();

    }


    currentUser = null;


    localStorage.removeItem(
        "englishClassUser"
    );


    document

            await navigator.mediaDevices
                .getUserMedia({

                    video:{
                        width:{
                            ideal:1280
                        },
                        height:{
                            ideal:720
                        },
                        frameRate:{
                            ideal:30,
                            max:30
                        },
                        facingMode:"user"
                    },

                    audio:{
                        echoCancellation:true,
                        noiseSuppression:true,
                        autoGainControl:true,
                        channelCount:1
                    }

                });


        return true;

    }catch(error){

        console.error(
            "GET USER MEDIA:",
            error
        );

        */

        try{

            localStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        audio:true
                    });


            return true;

        }catch(error2){

            console.error(error2);


            alert(
                "دسترسی دوربین و میکروفون داده نشد.\n"+

/* =====================================================
   REALTIME
===================================================== */

async function setupRealtime(){

    const room =
        "english-class-"+currentMeeting.id;


    /*
     SIGNAL
    */

    signalChannel =
        supabaseClient
            .channel(
                room+"-signal"
            );


    signalChannel

        .on(
            "broadcast",
            {
                event:"offer"
            },
            async ({payload})=>{

                if(
                    String(payload.to)
                    !==
                    String(currentUser.id)
                ){

                    return;

                }


                await receiveOffer(
                    payload
                );

            }
        )

        .on(
            "broadcast",
            {
                event:"answer"
            },
            async ({payload})=>{

                if(
                    String(payload.to)
                    !==
                    String(currentUser.id)
                ){

                    return;

                }


                await receiveAnswer(
                    payload
                );

            }
        )

        .on(
            "broadcast",
            {
                event:"ice"
            },
            async ({payload})=>{

                if(
                    String(payload.to)
                    !==
                    String(currentUser.id)
                ){

                    return;

                }


                await receiveIce(
                    payload
                );

            }
        );


    await waitForSubscription(
        signalChannel
    );


    /*
     PRESENCE
    */

    presenceChannel =
        supabaseClient
            .channel(
                room+"-presence",
                {
                    config:{
                        presence:{
                            key:String(
                                currentUser.id
                            )
                        }
                    }
                }
            );


    presenceChannel

        .on(
            "presence",
            {
                event:"sync"
            },
            async()=>{

                updatePeopleCount();


                const state =
                    presenceChannel
                        .presenceState();


                const ids =
                    Object.keys(state)
                        .filter(
                            id=>
                                String(id)
                                !==
                                String(
                                    currentUser.id
                                )
                        );


                for(
                    const id of ids
                ){

                    /*
                     ID بزرگ‌تر Offer می‌دهد.
                    */

                    if(
                        Number(
                            currentUser.id
                        )
                        >
                        Number(id)
                    ){

                        await connectToPeer(
                            String(id)
                        );

                    }

                }

            }
        )

        .on(
            "presence",
            {
                event:"join"
            },
            async({key})=>{

                if(
                    String(key)
                    ===
                    String(
                        currentUser.id
                    )
                ){

                    return;

                }


                updatePeopleCount();


                if(
                    Number(
                        currentUser.id
                    )
                    >
                    Number(key)
                ){

                    setTimeout(
                        ()=>{
                            connectToPeer(
                                String(key)
                            );
                        },
                        400
                    );

                }

            }
        )

        .on(
            "presence",
            {
                event:"leave"
            },
            ({key})=>{

                removePeer(
                    String(key)
                );

                updatePeopleCount();

            }
        );


    await waitForSubscription(
        presenceChannel
    );


    await presenceChannel.track({

        user_id:
            currentUser.id,

        name:
            currentUser.name

    });


    /*
     CHAT
    */

    meetingChatChannel =
        supabaseClient
            .channel(
                room+"-chat"
            );


    meetingChatChannel
        .on(
            "broadcast",
            {
                event:"chat"
            },
            ({payload})=>{

                if(
                    String(payload.user_id)
                    ===
                    String(currentUser.id)
                ){

                    return;

                }


                appendMeetingMessage(
                    payload.user_name,
                    payload.text
                );

            }
        );


    await waitForSubscription(
        meetingChatChannel
    );


    updatePeopleCount();

}


/* =====================================================
   WAIT SUBSCRIBED
===================================================== */

function waitForSubscription(
    channel
){

    return new Promise(
        (resolve,reject)=>{

            let finished = false;


            const timeout =
                setTimeout(
                    ()=>{

                        if(!finished){

                            finished = true;

                            reject(
                                new Error(
                                    "Realtime timeout"
                                )
                            );

                        }

                    },
                    15000
                );


            channel.subscribe(
                status=>{

                    if(status==="SUBSCRIBED"){

                        if(finished)
                            return;


                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        resolve();

                    }


                    if(status==="CHANNEL_ERROR"){

                        if(finished)
                            return;


                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        reject(
                            new Error(
                                "Realtime channel error"
                            )
                        );

                    }

                }
            );

        }
    );

}


/* =====================================================
   CONNECT TO PEER
===================================================== */

async function connectToPeer(
    userId
){

    if(
        String(userId)
        ===
        String(currentUser.id)
    ){

        return;

    }


    let pc =
        peers[userId];


    if(!pc){

        pc =
            createPeer(
                userId
            );

    }


    /*
     فقط کاربر با ID بزرگ‌تر Offer می‌دهد.
    */

    if(
        Number(currentUser.id)
        <=
        Number(userId)
    ){

        return;

    }


    /*
     جلوگیری از Offer تکراری
    */

    if(
        pc.signalingState
        !==
        "stable"
    ){

        return;

    }


    try{

        const offer =
            await pc.createOffer({

                offerToReceiveAudio:true,
                offerToReceiveVideo:true

            });


        await pc.setLocalDescription(
            offer
        );


        await sendSignal(
            "offer",
            {

                to:userId,

                from:
                    currentUser.id,

                description:
                    pc.localDescription

            }
        );

    }catch(error){

        console.error(
            "CREATE OFFER",
            error
        );

    }

}


/* =====================================================
   CREATE PEER
===================================================== */

function createPeer(
    userId
){

    if(peers[userId])
        return peers[userId];


    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peers[userId] =
        pc;


    pendingCandidates[userId] =
        [];


    /*
     Local Tracks
    */

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track=>{

                    try{

                        pc.addTrack(
                            track,
                            localStream
                        );

                    }catch(error){

                        console.error(
                            error
                        );

                    }

                }
            );

    }


    /*
     Remote Tracks
    */

    pc.ontrack =
        event=>{

            let stream =
                remoteStreams[userId];


            if(!stream){

                stream =
                    new MediaStream();


                remoteStreams[userId] =
                    stream;

            }


            /*
             Track تکراری اضافه نکن.
            */

            if(
                !stream
                    .getTracks()
                    .some(
                        track=>
                            track.id
                            ===
                            event.track.id
                    )
            ){

                stream.addTrack(
                    event.track
                );

            }


            showRemoteVideo(
                userId,
                stream
            );


            /*
             اگر Audio Track است،
             فعالش کن.
            */

            if(
                event.track.kind
                ===
                "audio"
            ){

                event.track.enabled =
                    true;


                showAudioUnlockButton();

            }

        };


    /*
     ICE
    */

    pc.onicecandidate =
        async event=>{

            if(
                !event.candidate
            ){

                return;

            }


            await sendSignal(
                "ice",
                {

                    to:userId,

                    from:
                        currentUser.id,

                    candidate:
                        event.candidate

                }
            );

        };


    /*
     Connection State
    */

    pc.onconnectionstatechange =
        ()=>{

            const state =
                pc.connectionState;


            console.log(
                "Peer",
                userId,
                state
            );


            setPeerStatus(
                userId,
                state
            );


            if(
                state === "failed"
            ){

                try{

                    pc.restartIce();

                }catch(e){}


                scheduleReconnect(
                    userId
                );

            }


            if(
                state === "disconnected"
            ){

                scheduleReconnect(
                    userId
                );

            }

        };


    /*
     ICE State
    */

    pc.oniceconnectionstatechange =
        ()=>{

            if(
                pc.iceConnectionState
                ===
                "failed"
            ){

                try{

                    pc.restartIce();

                }catch(e){}

            }

        };


    return pc;

}


/* =====================================================
   RECEIVE OFFER
===================================================== */

async function receiveOffer(
    data
){

    const userId =
        String(data.from);


    const pc =
        createPeer(
            userId
        );


    try{

        /*
         Offer را قبول کن.
        */

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                data.description
            )
        );


        await flushCandidates(
            userId
        );


        const answer =
            await pc.createAnswer({

                offerToReceiveAudio:true,
                offerToReceiveVideo:true

            });


        await pc.setLocalDescription(
            answer
        );


        await sendSignal(
            "answer",
            {

                to:userId,

                from:
                    currentUser.id,

                description:
                    pc.localDescription

            }
        );

    }catch(error){

        console.error(
            "RECEIVE OFFER",
            error
        );

    }

}


/* =====================================================
   RECEIVE ANSWER
===================================================== */

async function receiveAnswer(
    data
){

    const userId =
        String(data.from);


    const pc =
        peers[userId];


    if(!pc)
        return;


    try{

        if(
            pc.signalingState
            !==
            "have-local-offer"
        ){

            return;

        }


        await pc.setRemoteDescription(
            new RTCSessionDescription(
                data.description
            )
        );


        await flushCandidates(
            userId
        );

    }catch(error){

        console.error(
            "RECEIVE ANSWER",
            error
        );

    }

}


/* =====================================================
   RECEIVE ICE
===================================================== */

async function receiveIce(
    data
){

    const userId =
        String(data.from);


    let pc =
        peers[userId];


    /*
     اگر Peer هنوز ساخته نشده،
     بساز.
    */

    if(!pc){

        pc =
            createPeer(
                userId
            );

    }


    const candidate =
        new RTCIceCandidate(
            data.candidate
        );


    /*
     قبل از Remote Description
     نگهش دار.
    */

    if(
        !pc.remoteDescription ||
        !pc.remoteDescription.type
    ){

        pendingCandidates[userId]
            .push(candidate);

        return;

    }


    try{

        await pc.addIceCandidate(
            candidate
        );

    }catch(error){

        console.warn(
            "ICE ERROR",
            error
        );

    }

}


/* =====================================================
   FLUSH ICE
===================================================== */

async function flushCandidates(
    userId
){

    const pc =
        peers[userId];


    if(!pc)
        return;


    const list =
        pendingCandidates[userId]
        || [];


    for(
        const candidate of list
    ){

        try{

            await pc.addIceCandidate(
                candidate
            );

        }catch(error){

            console.warn(
                error
            );

        }

    }


    pendingCandidates[userId] = [];

}

}

/* =====================================================
   SCREEN SHARE
===================================================== */

async function toggleScreenShare(){

    if(isScreenSharing){

        await stopScreenShare();

        return;

    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getDisplayMedia
    ){

        alert(
            "این مرورگر اشتراک صفحه را پشتیبانی نمی‌کند."
        );

        return;

    }


    try{

        screenStream =
            await navigator
                .mediaDevices
                .getDisplayMedia({

                    video:{
                        frameRate:{
                            ideal:30,
                            max:30
                        }
                    },

                    audio:false

                });


        const screenTrack =
            screenStream
                .getVideoTracks()[0];


        if(!screenTrack){

            return;

        }


        originalCameraTrack =
            localStream
                .getVideoTracks()[0]
                || null;


        /*
         جایگزینی Track برای همه
        */

        for(
            const userId in peers
        ){

            const pc =
                peers[userId];


            const sender =
                pc
                    .getSenders()
                    .find(
                        sender=>
                            sender.track
                            &&
                            sender.track.kind
                            ===
                            "video"
                    );


            if(sender){

                try{

                    await sender.replaceTrack(
                        screenTrack
                    );

                }catch(error){

                    console.warn(
                        error
                    );

                }

            }

        }


        /*
         Preview
        */

        const preview =
            new MediaStream();


        preview.addTrack(
            screenTrack
        );


        const mic =
            localStream
                .getAudioTracks()[0];


        if(mic){

            preview.addTrack(
                mic
            );

        }


        const localVideo =
            document.getElementById(
                "localVideo"
            );


        if(localVideo){

            localVideo.srcObject =
                preview;

            localVideo.muted = true;

            localVideo.play()
                .catch(
                    ()=>{}
                );

        }


        isScreenSharing =
            true;


        const button =
            document.getElementById(
                "screenBtn"
            );


        button.classList.add(
            "active"
        );


        button.textContent =
            "⏹️";


        screenTrack.onended =
            ()=>{

                stopScreenShare();

            };


    }catch(error){

        console.error(
            "SCREEN SHARE:",
            error
        );

    }

}


/* =====================================================
   STOP SCREEN SHARE
===================================================== */

async function stopScreenShare(){

    if(!isScreenSharing)
        return;


    const cameraTrack =
        originalCameraTrack;


    for(
        const userId in peers
    ){

        const pc =
            peers[userId];


        const sender =
            pc
                .getSenders()
                .find(
                    sender=>
                        sender.track
                        &&
                        sender.track.kind
                        ===
                        "video"
                );


        if(
            sender &&
            cameraTrack
        ){

            try{

                await sender.replaceTrack(
                    cameraTrack
                );

            }catch(error){

                console.warn(
                    error
                );

            }

        }

    }


    if(screenStream){

        screenStream
            .getTracks()
            .forEach(
                track=>{
                    track.stop();
                }
            );

    }


    screenStream = null;

    isScreenSharing = false;


    const localVideo =
        document.getElementById(
            "localVideo"
        );


    if(
        localVideo &&
        localStream
    ){

        localVideo.srcObject =
            localStream;

        localVideo.muted = true;

        localVideo.play()
            .catch(
                ()=>{}
            );

    }


    const button =
        document.getElementById(
            "screenBtn"
        );


    button.classList.remove(
        "active"
    );


    button.textContent =
        "🖥️";

}

/* =====================================================
   START RECORDING
===================================================== */

async function startRecording(){

    if(!currentMeeting){

        alert(
            "ابتدا وارد کلاس شو."
        );

        return;

    }


    if(!localStream){

        alert(
            "دوربین و میکروفون آماده نیست."
        );

        return;

    }


    if(
        !window.MediaRecorder
    ){

        alert(
            "این مرورگر قابلیت ضبط ندارد."
        );

        return;

    }


    try{

        /*
         Audio Context
        */

        recordAudioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        await recordAudioContext.resume();


        recordAudioDestination =
            recordAudioContext
                .createMediaStreamDestination();


        recordAudioSources = [];


        /*
         صدای خودمان
        */

        addAudioToRecording(
            localStream
        );


        /*
         صدای تمام افراد حاضر
        */

        for(
            const userId in remoteStreams
        ){

            addAudioToRecording(
                remoteStreams[userId]
            );

        }


        /*
         Canvas
        */

        recordCanvas =
            document.createElement(
                "canvas"
            );


        recordCanvas.width =
            1280;


        recordCanvas.height =
            720;


        recordCanvasCtx =
            recordCanvas.getContext(
                "2d"
            );


        /*
         اولین فریم
        */

        drawRecordingFrame();


        /*
         Canvas Stream
        */

        const canvasStream =
            recordCanvas
                .captureStream(25);


        /*
         Stream نهایی
        */

        const finalStream =
            new MediaStream();


        canvasStream
            .getVideoTracks()
            .forEach(
                track=>{
                    finalStream.addTrack(
                        track
                    );
                }
            );


        recordAudioDestination
            .stream
            .getAudioTracks()
            .forEach(
                track=>{
                    finalStream.addTrack(
                        track
                    );
                }
            );


        /*
         فرمت
        */

        let mimeType =
            "video/webm";


        if(
            MediaRecorder
                .isTypeSupported(
                    "video/webm;codecs=vp9,opus"
                )
        ){

            mimeType =
                "video/webm;codecs=vp9,opus";

        }else if(
            MediaRecorder
                .isTypeSupported(
                    "video/webm;codecs=vp8,opus"
                )
        ){

            mimeType =
                "video/webm;codecs=vp8,opus";

        }


        /*
         Recorder
        */

        recorder =
            new MediaRecorder(
                finalStream,
                {
                    mimeType:mimeType,

                    videoBitsPerSecond:
                        3500000,

                    audioBitsPerSecond:
                        128000
                }
            );


        recordedChunks = [];


        recorder.ondataavailable =
            event=>{

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    recordedChunks.push(
                        event.data
                    );

                }

            };


        recorder.onerror =
            event=>{

                console.error(
                    "RECORDER ERROR",
                    event
                );

            };


        recorder.onstop =
            finishRecording;


        recorder.start(1000);


        isRecording = true;

        recordingStartedAt =
            Date.now();


        document
            .getElementById(
                "recordInfo"
            )
            .classList
            .remove("hidden");


        document
            .getElementById(
                "recordBtn"
            )
            .classList
            .add("recording");


        document
            .getElementById(
                "recordBtn"
            )
            .textContent =
                "⏹️";


        recordingTimer =
            setInterval(
                updateRecordTimer,
                1000
            );

    }catch(error){

        console.error(
            "RECORDING START:",
            error
        );


        alert(
            "ضبط شروع نشد:\n"+
            error.message
        );


        cleanupRecording();

    }

}


/* =====================================================
   ADD AUDIO TO RECORDING
===================================================== */

function addAudioToRecording(
    stream
){

    if(
        !stream ||
        !recordAudioContext ||
        !recordAudioDestination
    ){

        return;

    }


    const tracks =
        stream.getAudioTracks();


    if(!tracks.length)
        return;


    const audioStream =
        new MediaStream();


    tracks.forEach(
        track=>{

            if(
                track.readyState
                ===
                "live"
            ){

                audioStream.addTrack(
                    track
                );

            }

        }
    );


    if(
        !audioStream
            .getAudioTracks()
            .length
    ){

        return;

    }


    try{

        const source =
            recordAudioContext
                .createMediaStreamSource(
                    audioStream
                );


        source.connect(
            recordAudioDestination
        );


        recordAudioSources.push(
            source
        );

    }catch(error){

        console.warn(
            "AUDIO MIX ERROR",
            error
        );

    }

}


/* =====================================================
   DRAW RECORDING FRAME
===================================================== */

function drawRecordingFrame(){

    if(
        !recordCanvasCtx ||
        !recordCanvas
    ){

        return;

    }


    const ctx =
        recordCanvasCtx;


    const width =
        recordCanvas.width;


    const height =
        recordCanvas.height;


    /*
     Background
    */

    ctx.fillStyle =
        "#080c16";


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
     Find videos
    */

    const boxes =
        Array.from(
            document.querySelectorAll(
                "#videoGrid .videoBox"
            )
        );


    const videos = [];


    boxes.forEach(
        box=>{

            const video =
                box.querySelector(
                    "video"
                );


            if(
                video &&
                video.readyState >= 2 &&
                video.videoWidth > 0 &&
                video.videoHeight > 0
            ){

                videos.push({

                    video:video,

                    box:box

                });

            }

        }
    );


    /*
     حداکثر 6 تصویر
    */

    const list =
        videos.slice(
            0,
            6
        );


    if(!list.length){

        continueRecordingCanvas();

        return;

    }


    let columns = 2;


    if(list.length >= 5){

        columns = 3;

    }


    const rows =
        Math.ceil(
            list.length /
            columns
        );


    const cellWidth =
        width /
        columns;


    const cellHeight =
        height /
        rows;


    list.forEach(
        (item,index)=>{

            const x =
                (index % columns) *
                cellWidth;


            const y =
                Math.floor(
                    index / columns
                ) *
                cellHeight;


            drawVideoCover(
                ctx,
                item.video,
                x,
                y,
                cellWidth,
                cellHeight
            );


            const name =
                item.box
                    .querySelector(
                        ".videoName"
                    );


            if(name){

                ctx.fillStyle =
                    "rgba(0,0,0,.65)";


                ctx.fillRect(
                    x+10,
                    y+cellHeight-45,
                    Math.min(
                        280,
                        cellWidth-20
                    ),
                    30
                );


                ctx.fillStyle =
                    "#fff";


                ctx.font =
                    "16px Tahoma";


                ctx.fillText(
                    name.textContent
                        .trim()
                        .substring(
                            0,
                            30
                        ),
                    x+20,
                    y+cellHeight-24
                );

            }

        }
    );


    /*
     Header
    */

    ctx.fillStyle =
        "rgba(0,0,0,.65)";


    ctx.fillRect(
        15,
        15,
        330,
        45
    );


    ctx.fillStyle =
        "#fff";


    ctx.font =
        "bold 20px Tahoma";


    ctx.fillText(
        currentMeeting
            ? currentMeeting.name
            : "English Class",
        30,
        45
    );


    continueRecordingCanvas();

}


/* =====================================================
   CONTINUE CANVAS
===================================================== */

function continueRecordingCanvas(){

    if(!isRecording)
        return;


    recordAnimation =
        requestAnimationFrame(
            drawRecordingFrame
        );

}


/* =====================================================
   DRAW VIDEO COVER
===================================================== */

function drawVideoCover(
    ctx,
    video,
    x,
    y,
    width,
    height
){

    const vw =
        video.videoWidth;


    const vh =
        video.videoHeight;


    if(!vw || !vh)
        return;


    const sourceRatio =
        vw / vh;


    const boxRatio =
        width / height;


    let drawWidth;

    let drawHeight;

    let drawX;

    let drawY;


    if(
        sourceRatio >
        boxRatio
    ){

        drawHeight =
            height;


        drawWidth =
            height *
            sourceRatio;


        drawX =
            x +
            (
                width -
                drawWidth
            ) / 2;


        drawY =
            y;

    }else{

        drawWidth =
            width;


        drawHeight =
            width /
            sourceRatio;


        drawX =
            x;


        drawY =
            y +
            (
                height -
                drawHeight
            ) / 2;

    }


    ctx.save();


    ctx.beginPath();


    ctx.rect(
        x,
        y,
        width,
        height
    );


    ctx.clip();


    ctx.drawImage(
        video,
        drawX,
        drawY,
        drawWidth,
        drawHeight
    );


    ctx.restore();

}


/* =====================================================
   STOP RECORDING
===================================================== */

function stopRecording(){

    if(
        recorder &&
        recorder.state !==
        "inactive"
    ){

        recorder.stop();

    }

}


/* =====================================================
   RECORD TIMER
===================================================== */

function updateRecordTimer(){

    if(!recordingStartedAt)
        return;


    const totalSeconds =
        Math.floor(
            (
                Date.now() -
                recordingStartedAt
            ) / 1000
        );


    const minutes =
        String(
            Math.floor(
                totalSeconds / 60
            )
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            totalSeconds % 60
        ).padStart(
            2,
            "0"
        );


    document
        .getElementById(
            "recordTimer"
        )
        .textContent =
            minutes+
            ":"+
            seconds;

}


/* =====================================================
   FINISH RECORDING
===================================================== */

function finishRecording(){

    clearInterval(
        recordingTimer
    );


    recordingTimer =
        null;


    if(recordAnimation){

        cancelAnimationFrame(
            recordAnimation
        );


        recordAnimation =
            null;

    }


    isRecording = false;


    document
        .getElementById(
            "recordInfo"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "recordBtn"
        )
        .classList
        .remove("recording");


    document
        .getElementById(
            "recordBtn"
        )
        .textContent =
            "🔴";


    if(
        !recordedChunks.length
    ){

        cleanupRecording();

        alert(
            "فایل ضبط‌شده خالی است."
        );

        return;

    }


    const blob =
        new Blob(
            recordedChunks,
            {
                type:"video/webm"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const size =
        (
            blob.size /
            1024 /
            1024
        ).toFixed(1);


    showRecordingResult(
        url,
        size
    );


    cleanupRecording();

}


/* =====================================================
   RECORD RESULT
===================================================== */

function showRecordingResult(
    url,
    size
){

    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
            "🎬 ضبط کامل کلاس";


    document
        .getElementById(
            "modalBody"
        )
        .innerHTML = `

            <div class="modalText">

                ضبط آماده شد.

                <br><br>

                نمای کلاس و صدای شرکت‌کنندگان
                در یک فایل قرار گرفته است.

                <br>

                حجم فایل:
                <b>${esc(size)} MB</b>

            </div>

            <br>

            <video
                src="${url}"
                controls
                playsinline>
            </video>

            <a
                class="downloadBtn"
                href="${url}"
                download="English-Class-${Date.now()}.webm">

                💾 ذخیره فایل ضبط‌شده

            </a>

        `;


    document
        .getElementById(
            "modal"
        )
        .classList
        .remove("hidden");

}


/* =====================================================
   RECORDING CLEANUP
===================================================== */

function cleanupRecording(){

    if(recordAnimation){

        cancelAnimationFrame(
            recordAnimation
        );

        recordAnimation =
            null;

    }


    if(recordAudioSources){

        recordAudioSources
            .forEach(
                source=>{

                    try{

                        source.disconnect();

                    }catch(e){}

                }
            );

    }


    recordAudioSources = [];


    if(recordAudioContext){

        try{

            recordAudioContext.close();

        }catch(e){}

    }


    recordAudioContext =
        null;


    recordAudioDestination =
        null;


    recordCanvas =
        null;


    recordCanvasCtx =
        null;


    recorder =
        null;


    recordingStartedAt =
        0;

}


/* =====================================================
   LOAD RECORDINGS
===================================================== */

async function loadRecordings(){

    const box =
        document.getElementById(
            "recordingsList"
        );


    const {data,error} =
        await supabaseClient
            .from("recordings")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        box.innerHTML =
            "هنوز ضبطی ثبت نشده.";

        return;

    }


    if(
        !data ||
        !data.length
    ){

        box.innerHTML =
            "هنوز ضبطی ثبت نشده.";

        return;

    }


    box.innerHTML = "";


    data.forEach(
        recording=>{

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item";


            item.innerHTML = `

                <div class="itemTitle">
                    🎬 ${esc(recording.name)}
                </div>

                <div>
                    ${esc(
                        recording.user_name
                        || ""
                    )}
                </div>

                ${
                    recording.file_url
                    ?
                    `
                    <div class="itemButtons">

                        <a
                            class="smallBtn blue"
                            href="${esc(
                                recording.file_url
                            )}"
                            target="_blank">

                            ▶️ مشاهده

                        </a>

                    </div>
                    `
                    :
                    ""
                }

            `;


            box.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   MODAL
===================================================== */

function closeModal(){

    document
        .getElementById(
            "modal"
        )
        .classList
        .add("hidden");

}


/* =====================================================
   LEAVE MEETING
===================================================== */

async function leaveMeeting(){

    /*
     اول ضبط را متوقف کن.
    */

    if(isRecording){

        stopRecording();

    }


    /*
     Screen Share
    */

    if(isScreenSharing){

        await stopScreenShare();

    }


    /*
     Reconnect timers
    */

    Object.keys(
        reconnectTimers
    )
    .forEach(
        key=>{

            clearTimeout(
                reconnectTimers[key]
            );

            delete reconnectTimers[key];

        }
    );


    /*
     Peerها
    */

    Object.keys(
        peers
    )
    .forEach(
        userId=>{

            try{

                peers[userId]
                    .close();

            }catch(e){}

        }
    );


    peers = {};

    remoteStreams = {};

    pendingCandidates = {};


    /*
     Presence
    */

    if(presenceChannel){

        try{

            await presenceChannel.untrack();

        }catch(e){}


        try{

            await supabaseClient
                .removeChannel(
                    presenceChannel
                );

        }catch(e){}


        presenceChannel =
            null;

    }


    /*
     Signal
    */

    if(signalChannel){

        try{

            await supabaseClient
                .removeChannel(
                    signalChannel
                );

        }catch(e){}


        signalChannel =
            null;

    }


    /*
     Chat
    */

    if(meetingChatChannel){

        try{

            await supabaseClient
                .removeChannel(
                    meetingChatChannel
                );

        }catch(e){}


        meetingChatChannel =
            null;

    }


    /*
     Local Media
    */

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track=>{
                    track.stop();
                }
            );

        localStream = null;

    }


    if(screenStream){

        screenStream
            .getTracks()
            .forEach(
                track=>{
                    track.stop();
                }
            );

        screenStream = null;

    }


    /*
     Reset UI
    */

    document
        .getElementById(
            "videoGrid"
        )
        .innerHTML = "";


    document
        .getElementById(
            "meeting"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "audioUnlock"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "recordInfo"
        )
        .classList
        .add("hidden");


    isScreenSharing = false;

    currentMeeting = null;

    currentGroup = null;

}


/* =====================================================
   PAGE EXIT
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{

        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    track=>{
                        track.stop();
                    }
                );

        }

    }
);

</script>
