<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>زبان شیرین | کلاس آنلاین</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Tahoma,Arial,sans-serif;
    background:#071824;
}
button,input,textarea{
    font-family:inherit;
}
button{
    cursor:pointer;
}
.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginPage{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at top,#12384c,#071824 65%);
}
.loginBox{
    width:min(430px,92%);
    padding:30px;
    border-radius:25px;
    background:#102733;
    box-shadow:0 20px 70px #0008;
    color:white;
}
.loginBox h1{
    text-align:center;
    margin:0 0 8px;
    font-size:30px;
}
.loginBox p{
    text-align:center;
    color:#a9bbc4;
}
.field{
    margin-top:15px;
}
.field label{
    display:block;
    margin-bottom:7px;
    color:#c9d7dd;
}
.field input{
    width:100%;
    border:1px solid #36515e;
    background:#081923;
    color:white;
    padding:14px;
    border-radius:12px;
    outline:none;
}
.mainBtn{
    width:100%;
    border:0;
    padding:14px;
    margin-top:20px;
    border-radius:13px;
    background:#00a884;
    color:white;
    font-weight:bold;
    font-size:16px;
}
.mainBtn:hover{
    filter:brightness(1.1);
}
.error{
    color:#ff7676;
    text-align:center;
    margin-top:12px;
}

/* ================= APP ================= */

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#081923;
}

/* TOP BAR */

.topbar{
    height:58px;
    min-height:58px;
    background:#092230;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 13px;
    border-bottom:1px solid #193b49;
    z-index:20;
}
.topLeft,.topRight{
    display:flex;
    align-items:center;
    gap:10px;
}
.className{
    font-size:14px;
}
.onlineDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#1bdc8c;
}
.topBtn{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:#123746;
    color:white;
    font-size:18px;
}
.leaveBtn{
    background:#e53935;
}

/* MAIN */

.main{
    flex:1;
    min-height:0;
    display:flex;
    position:relative;
}

/* WHITEBOARD */

.whiteboardArea{
    flex:1;
    min-width:0;
    position:relative;
    background:#fff;
    overflow:hidden;
}
#boardCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:white;
    touch-action:none;
}

/* TOOLBAR */

.toolbar{
    position:absolute;
    right:12px;
    top:12px;
    width:48px;
    background:#fff;
    border-radius:13px;
    box-shadow:0 3px 15px #0003;
    padding:5px;
    display:flex;
    flex-direction:column;
    gap:4px;
    z-index:10;
}
.tool{
    width:38px;
    height:38px;
    border:0;
    border-radius:8px;
    background:white;
    color:#343434;
    font-size:18px;
}
.tool:hover{
    background:#edf2f4;
}
.tool.active{
    background:#d9edf7;
    color:#006a8a;
}
.tool.danger{
    color:#d62828;
}
.toolSeparator{
    height:1px;
    background:#ddd;
    margin:3px 2px;
}

/* BOARD HEADER */

.boardActions{
    position:absolute;
    left:12px;
    top:12px;
    z-index:10;
    display:flex;
    gap:5px;
}
.boardAction{
    width:38px;
    height:38px;
    border:0;
    border-radius:9px;
    background:#fff;
    box-shadow:0 2px 8px #0002;
    font-size:18px;
}
.pageInfo{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    padding:6px 14px;
    border-radius:20px;
    box-shadow:0 2px 10px #0002;
    font-size:13px;
    z-index:10;
}

/* SIDE PANEL */

.sidePanel{
    width:330px;
    max-width:40%;
    min-width:260px;
    background:#0b202b;
    color:white;
    display:flex;
    flex-direction:column;
    border-left:1px solid #1b3a46;
}
.panelTabs{
    display:flex;
    height:50px;
    border-bottom:1px solid #24404b;
}
.panelTab{
    flex:1;
    border:0;
    background:transparent;
    color:#9eb0b8;
}
.panelTab.active{
    color:white;
    border-bottom:2px solid #00a884;
}
.panelContent{
    flex:1;
    min-height:0;
    overflow:hidden;
}
.members{
    height:100%;
    overflow:auto;
    padding:10px;
}
.member{
    padding:12px;
    background:#102d38;
    border-radius:10px;
    margin-bottom:8px;
    display:flex;
    justify-content:space-between;
}
.memberName{
    display:flex;
    gap:8px;
    align-items:center;
}
.avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#7b1fa2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* CHAT */

.chat{
    height:100%;
    display:flex;
    flex-direction:column;
}
.messages{
    flex:1;
    overflow:auto;
    padding:12px;
}
.message{
    margin-bottom:10px;
    max-width:85%;
}
.message.mine{
    margin-right:auto;
}
.message .who{
    font-size:11px;
    color:#9bb0b9;
    margin-bottom:3px;
}
.message .bubble{
    background:#173744;
    padding:9px 11px;
    border-radius:12px;
}
.message.mine .bubble{
    background:#075e54;
}
.chatInput{
    display:flex;
    gap:6px;
    padding:8px;
    border-top:1px solid #24404b;
}
.chatInput input{
    flex:1;
    border:0;
    outline:0;
    background:#122e39;
    color:white;
    border-radius:10px;
    padding:11px;
}
.chatInput button{
    width:45px;
    border:0;
    border-radius:10px;
    background:#00a884;
    color:white;
}

/* BOTTOM CONTROLS */

.bottomBar{
    height:62px;
    min-height:62px;
    background:#071923;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    border-top:1px solid #19323e;
}
.control{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:#23323a;
    color:white;
    font-size:18px;
}
.control.active{
    background:#f5c6c6;
    color:#7c2020;
}
.control.leave{
    background:#e53935;
}

/* POPUP */

.modal{
    position:fixed;
    inset:0;
    background:#0008;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
}
.modalBox{
    width:min(430px,92%);
    background:#102733;
    color:white;
    border-radius:20px;
    padding:25px;
}
.modalBox h2{
    margin-top:0;
}
.modalBox input{
    width:100%;
    padding:13px;
    background:#071923;
    border:1px solid #34515c;
    color:white;
    border-radius:10px;
}
.modalBtns{
    display:flex;
    gap:8px;
    margin-top:15px;
}
.modalBtns button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:10px;
}
.confirm{
    background:#00a884;
    color:white;
}
.cancel{
    background:#30434b;
    color:white;
}

/* RESPONSIVE */

@media(max-width:850px){
    .sidePanel{
        position:absolute;
        right:0;
        top:0;
        bottom:0;
        z-index:30;
        width:min(330px,88%);
        max-width:none;
        box-shadow:-10px 0 30px #0005;
        display:none;
    }
    .sidePanel.open{
        display:flex;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage">
    <div class="loginBox">
        <h1>زبان شیرین</h1>
        <p>ورود به کلاس آنلاین</p>

        <div class="field">
            <label>نام شما</label>
            <input id="nameInput" placeholder="مثلاً Kian">
        </div>

        <div class="field">
            <label>کد جلسه</label>
            <input id="roomInput" placeholder="مثلاً ENGLISH-01">
        </div>

        <div class="field">
            <label>رمز کلاس</label>
            <input id="passwordInput" type="password" placeholder="رمز کلاس">
        </div>

        <button class="mainBtn" onclick="joinClass()">
            ورود به کلاس
        </button>

        <div id="loginError" class="error"></div>
    </div>
</section>


<!-- APP -->

<section id="app" class="hidden">

    <header class="topbar">

        <div class="topRight">
            <button class="topBtn" onclick="toggleSidePanel()">☰</button>
            <span class="onlineDot"></span>
            <span class="className" id="classTitle">کلاس زبان شیرین</span>
        </div>

        <div class="topLeft">
            <button class="topBtn" onclick="shareClass()">↗</button>
            <button class="topBtn leaveBtn" onclick="leaveClass()">⏎</button>
        </div>

    </header>


    <main class="main">

        <!-- WHITEBOARD -->

        <section class="whiteboardArea">

            <canvas id="boardCanvas"></canvas>

            <div class="boardActions">
                <button class="boardAction" onclick="undoBoard()">↶</button>
                <button class="boardAction" onclick="redoBoard()">↷</button>
                <button class="boardAction" onclick="clearBoard()">⌫</button>
            </div>

            <div class="toolbar">

                <button class="tool active"
                        id="tool-select"
                        onclick="setTool('select')"
                        title="انتخاب">↖</button>

                <button class="tool"
                        id="tool-pen"
                        onclick="setTool('pen')"
                        title="قلم">✎</button>

                <button class="tool"
                        id="tool-highlighter"
                        onclick="setTool('highlighter')"
                        title="هایلایتر">🖍</button>

                <button class="tool"
                        id="tool-eraser"
                        onclick="setTool('eraser')"
                        title="پاک‌کن">⌫</button>

                <div class="toolSeparator"></div>

                <button class="tool"
                        onclick="addText()"
                        title="متن">T</button>

                <button class="tool"
                        onclick="drawShape('line')"
                        title="خط">╱</button>

                <button class="tool"
                        onclick="drawShape('rect')"
                        title="مستطیل">□</button>

                <button class="tool"
                        onclick="drawShape('circle')"
                        title="دایره">○</button>

                <button class="tool"
                        onclick="drawShape('arrow')"
                        title="فلش">➜</button>

                <div class="toolSeparator"></div>

                <button class="tool"
                        onclick="zoomIn()"
                        title="بزرگ‌نمایی">＋</button>

                <button class="tool"
                        onclick="zoomOut()"
                        title="کوچک‌نمایی">－</button>

                <button class="tool"
                        onclick="resetZoom()"
                        title="بازنشانی">⌂</button>

                <div class="toolSeparator"></div>

                <button class="tool danger"
                        onclick="clearBoard()"
                        title="پاک کردن تخته">🗑</button>

            </div>

            <div class="pageInfo">
                صفحه <span id="pageNumber">1</span>
            </div>

        </section>


        <!-- SIDE PANEL -->

        <aside id="sidePanel" class="sidePanel">

            <div class="panelTabs">

                <button class="panelTab active"
                        id="membersTab"
                        onclick="showPanel('members')">
                    اعضا
                </button>

                <button class="panelTab"
                        id="chatTab"
                        onclick="showPanel('chat')">
                    چت
                </button>

            </div>

            <div class="panelContent">

                <div id="membersPanel" class="members"></div>

                <div id="chatPanel" class="chat hidden">

                    <div id="messages" class="messages"></div>

                    <div class="chatInput">
                        <input id="chatInput"
                               placeholder="پیام بنویس..."
                               onkeydown="if(event.key==='Enter')sendMessage()">
                        <button onclick="sendMessage()">➤</button>
                    </div>

                </div>

            </div>

        </aside>

    </main>


    <!-- BOTTOM -->

    <footer class="bottomBar">

        <button id="micBtn"
                class="control"
                onclick="toggleMic()">🎙</button>

        <button id="cameraBtn"
                class="control"
                onclick="toggleCamera()">📹</button>

        <button class="control"
                onclick="shareScreen()">▣</button>

        <button class="control"
                onclick="toggleSidePanel()">👥</button>

        <button class="control leave"
                onclick="leaveClass()">☎</button>

    </footer>

</section>


<!-- TEXT MODAL -->

<div id="textModal" class="modal hidden">

    <div class="modalBox">

        <h2>نوشتن روی تخته</h2>

        <input id="textInput"
               placeholder="متن خود را بنویسید">

        <div class="modalBtns">

            <button class="cancel"
                    onclick="closeTextModal()">
                لغو
            </button>

            <button class="confirm"
                    onclick="insertText()">
                افزودن
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL = "https://uqqumhmzndgyoigcqnti.supabase.co";

/*
   کلید anon پروژه خودت را اینجا قرار بده.
   Service Role Key را هرگز داخل HTML قرار نده.
*/
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let currentUser = null;
let currentRoom = null;
let currentRoomId = null;

let channel = null;
let roomChannel = null;

let localStream = null;
let screenStream = null;

let micEnabled = false;
let cameraEnabled = false;

let canvas;
let ctx;

let currentTool = "select";

let drawing = false;
let startX = 0;
let startY = 0;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let history = [];
let redoHistory = [];

let boardObjects = [];

let pendingTextPosition = null;


/* =========================================================
   LOGIN
   ========================================================= */

async function joinClass(){

    const name =
        document.getElementById("nameInput").value.trim();

    const roomCode =
        document.getElementById("roomInput").value.trim();

    const password =
        document.getElementById("passwordInput").value;

    const error =
        document.getElementById("loginError");

    error.textContent = "";

    if(!name || !roomCode || !password){

        error.textContent =
            "نام، کد جلسه و رمز کلاس را وارد کنید.";

        return;
    }

    if(SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY"){

        error.textContent =
            "ابتدا anon key پروژه Supabase را در کد قرار بده.";

        return;
    }

    const {data,error:dbError} =
        await supabaseClient
        .from("meetings")
        .select("*")
        .eq("room_code",roomCode)
        .eq("password",password)
        .eq("is_active",true)
        .maybeSingle();

    if(dbError){

        console.error(dbError);

        error.textContent =
            "خطا در اتصال به Supabase.";

        return;
    }

    if(!data){

        error.textContent =
            "کد جلسه یا رمز کلاس اشتباه است.";

        return;
    }

    currentUser = {
        id:crypto.randomUUID(),
        name:name,
        role:"student"
    };

    currentRoom = data;
    currentRoomId = data.id;

    localStorage.setItem(
        "zaban_shirin_user",
        JSON.stringify(currentUser)
    );

    localStorage.setItem(
        "zaban_shirin_room",
        roomCode
    );

    await registerMember();

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    document
        .getElementById("classTitle")
        .textContent =
            data.title || "کلاس زبان شیرین";

    initCanvas();

    await loadBoard();

    await loadMessages();

    subscribeRealtime();

    await updateMembers();

    resizeCanvas();
}


/* =========================================================
   MEMBER
   ========================================================= */

async function registerMember(){

    await supabaseClient
        .from("meeting_members")
        .upsert({

            meeting_id:currentRoomId,

            user_id:currentUser.id,

            name:currentUser.name,

            role:currentUser.role,

            is_online:true,

            last_seen:new Date().toISOString()

        },{
            onConflict:"meeting_id,user_id"
        });
}


async function updateMembers(){

    const {data} =
        await supabaseClient
        .from("meeting_members")
        .select("*")
        .eq("meeting_id",currentRoomId)
        .eq("is_online",true)
        .order("created_at");

    const box =
        document.getElementById("membersPanel");

    box.innerHTML = "";

    (data || []).forEach(member=>{

        const div =
            document.createElement("div");

        div.className = "member";

        div.innerHTML = `

            <div class="memberName">

                <div class="avatar">
                    ${escapeHtml(
                        member.name
                        .charAt(0)
                        .toUpperCase()
                    )}
                </div>

                <span>
                    ${escapeHtml(member.name)}
                </span>

            </div>

            <span>
                ${member.role === "teacher"
                    ? "مدرس"
                    : "دانش‌آموز"}
            </span>
        `;

        box.appendChild(div);

    });
}


/* =========================================================
   REALTIME
   ========================================================= */

function subscribeRealtime(){

    if(channel)
        supabaseClient.removeChannel(channel);

    channel =
        supabaseClient
        .channel("meeting-" + currentRoomId)

        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"meeting_members",
                filter:"meeting_id=eq." + currentRoomId
            },
            ()=>{
                updateMembers();
            }
        )

        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"chat_messages",
                filter:"meeting_id=eq." + currentRoomId
            },
            payload=>{
                addMessageToUI(payload.new);
            }
        )

        .on(
            "broadcast",
            {
                event:"board"
            },
            payload=>{

                if(payload.payload.sender === currentUser.id)
                    return;

                if(payload.payload.action === "state"){

                    boardObjects =
                        payload.payload.objects || [];

                    redrawBoard();
                }

            }
        )

        .subscribe();


    roomChannel =
        supabaseClient
        .channel("webrtc-" + currentRoomId)

        .on(
            "broadcast",
            {event:"webrtc"},
            payload=>{

                handleWebRTCSignal(
                    payload.payload
                );

            }
        )

        .subscribe();
}


/* =========================================================
   WHITEBOARD
   ========================================================= */

function initCanvas(){

    canvas =
        document.getElementById("boardCanvas");

    ctx =
        canvas.getContext("2d");

    resizeCanvas();

    canvas.addEventListener(
        "pointerdown",
        boardPointerDown
    );

    canvas.addEventListener(
        "pointermove",
        boardPointerMove
    );

    canvas.addEventListener(
        "pointerup",
        boardPointerUp
    );

    canvas.addEventListener(
        "pointercancel",
        boardPointerUp
    );

    window.addEventListener(
        "resize",
        resizeCanvas
    );

    saveHistory();

}


function resizeCanvas(){

    if(!canvas)
        return;

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    redrawBoard();
}


function screenToBoard(x,y){

    return {

        x:(x-offsetX)/scale,

        y:(y-offsetY)/scale

    };
}


function boardToScreen(x,y){

    return {

        x:x*scale+offsetX,

        y:y*scale+offsetY

    };
}


function boardPointerDown(e){

    const rect =
        canvas.getBoundingClientRect();

    const p =
        screenToBoard(
            e.clientX-rect.left,
            e.clientY-rect.top
        );

    startX = p.x;
    startY = p.y;

    if(currentTool === "select")
        return;

    if(currentTool === "eraser"){

        drawing = true;

        eraseAt(p.x,p.y);

        return;
    }

    if(
        currentTool === "pen" ||
        currentTool === "highlighter"
    ){

        drawing = true;

        boardObjects.push({

            type:"stroke",

            points:[
                {
                    x:p.x,
                    y:p.y
                }
            ],

            color:
                currentTool === "highlighter"
                ? "rgba(255,220,0,.35)"
                : "#222",

            width:
                currentTool === "highlighter"
                ? 18
                : 3

        });

        redrawBoard();

        return;
    }

    if(
        currentTool === "line" ||
        currentTool === "rect" ||
        currentTool === "circle" ||
        currentTool === "arrow"
    ){

        drawing = true;

        return;
    }
}


function boardPointerMove(e){

    if(!drawing)
        return;

    const rect =
        canvas.getBoundingClientRect();

    const p =
        screenToBoard(
            e.clientX-rect.left,
            e.clientY-rect.top
        );

    if(
        currentTool === "pen" ||
        currentTool === "highlighter"
    ){

        const stroke =
            boardObjects[
                boardObjects.length-1
            ];

        stroke.points.push({
            x:p.x,
            y:p.y
        });

        redrawBoard();

        return;
    }

    if(currentTool === "eraser"){

        eraseAt(p.x,p.y);

        return;
    }

    redrawBoard();

    drawPreview(
        startX,
        startY,
        p.x,
        p.y
    );
}


function boardPointerUp(e){

    if(!drawing)
        return;

    drawing = false;

    const rect =
        canvas.getBoundingClientRect();

    const p =
        screenToBoard(
            e.clientX-rect.left,
            e.clientY-rect.top
        );

    if(
        currentTool === "line" ||
        currentTool === "rect" ||
        currentTool === "circle" ||
        currentTool === "arrow"
    ){

        boardObjects.push({

            type:currentTool,

            x:startX,

            y:startY,

            x2:p.x,

            y2:p.y,

            color:"#222",

            width:3

        });

    }

    saveHistory();

    redrawBoard();

    broadcastBoard();

}


function drawPreview(x1,y1,x2,y2){

    ctx.save();

    ctx.strokeStyle="#777";

    ctx.lineWidth=2;

    if(currentTool==="line"){

        ctx.beginPath();

        ctx.moveTo(
            boardToScreen(x1,y1).x,
            boardToScreen(x1,y1).y
        );

        ctx.lineTo(
            boardToScreen(x2,y2).x,
            boardToScreen(x2,y2).y
        );

        ctx.stroke();

    }

    if(currentTool==="rect"){

        const a=boardToScreen(x1,y1);
        const b=boardToScreen(x2,y2);

        ctx.strokeRect(
            a.x,
            a.y,
            b.x-a.x,
            b.y-a.y
        );

    }

    if(currentTool==="circle"){

        const a=boardToScreen(x1,y1);
        const b=boardToScreen(x2,y2);

        const r=
            Math.sqrt(
                Math.pow(b.x-a.x,2)+
                Math.pow(b.y-a.y,2)
            );

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            r,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    if(currentTool==="arrow"){

        drawArrow(
            boardToScreen(x1,y1).x,
            boardToScreen(x1,y1).y,
            boardToScreen(x2,y2).x,
            boardToScreen(x2,y2).y
        );

    }

    ctx.restore();
}


function redrawBoard(){

    if(!ctx)
        return;

    const rect =
        canvas.getBoundingClientRect();

    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );

    ctx.fillStyle="#fff";

    ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
    );

    boardObjects.forEach(obj=>{

        if(obj.type==="stroke"){

            if(obj.points.length<2)
                return;

            ctx.save();

            ctx.strokeStyle=obj.color;

            ctx.lineWidth=obj.width;

            ctx.lineCap="round";

            ctx.lineJoin="round";

            ctx.beginPath();

            const first =
                boardToScreen(
                    obj.points[0].x,
                    obj.points[0].y
                );

            ctx.moveTo(
                first.x,
                first.y
            );

            for(
                let i=1;
                i<obj.points.length;
                i++
            ){

                const p =
                    boardToScreen(
                        obj.points[i].x,
                        obj.points[i].y
                    );

                ctx.lineTo(
                    p.x,
                    p.y
                );
            }

            ctx.stroke();

            ctx.restore();

            return;
        }

        if(obj.type==="text"){

            const p =
                boardToScreen(
                    obj.x,
                    obj.y
                );

            ctx.save();

            ctx.fillStyle =
                obj.color || "#222";

            ctx.font =
                `${obj.size || 22}px Tahoma`;

            ctx.direction="rtl";

            ctx.fillText(
                obj.text,
                p.x,
                p.y
            );

            ctx.restore();

            return;
        }

        const a =
            boardToScreen(
                obj.x,
                obj.y
            );

        const b =
            boardToScreen(
                obj.x2,
                obj.y2
            );

        ctx.save();

        ctx.strokeStyle =
            obj.color || "#222";

        ctx.lineWidth =
            obj.width || 3;

        if(obj.type==="line"){

            ctx.beginPath();

            ctx.moveTo(a.x,a.y);

            ctx.lineTo(b.x,b.y);

            ctx.stroke();

        }

        if(obj.type==="rect"){

            ctx.strokeRect(
                a.x,
                a.y,
                b.x-a.x,
                b.y-a.y
            );

        }

        if(obj.type==="circle"){

            const r =
                Math.sqrt(
                    Math.pow(
                        b.x-a.x,
                        2
                    )+
                    Math.pow(
                        b.y-a.y,
                        2
                    )
                );

            ctx.beginPath();

            ctx.arc(
                a.x,
                a.y,
                r,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }

        if(obj.type==="arrow"){

            drawArrow(
                a.x,
                a.y,
                b.x,
                b.y
            );

        }

        ctx.restore();

    });

}


function drawArrow(x1,y1,x2,y2){

    const angle =
        Math.atan2(
            y2-y1,
            x2-x1
        );

    ctx.beginPath();

    ctx.moveTo(x1,y1);

    ctx.lineTo(x2,y2);

    ctx.stroke();

    const size=10;

    ctx.beginPath();

    ctx.moveTo(
        x2-size*Math.cos(angle-Math.PI/6),
        y2-size*Math.sin(angle-Math.PI/6)
    );

    ctx.lineTo(x2,y2);

    ctx.lineTo(
        x2-size*Math.cos(angle+Math.PI/6),
        y2-size*Math.sin(angle+Math.PI/6)
    );

    ctx.stroke();

}


/* =========================================================
   TEXT
   ========================================================= */

function addText(){

    pendingTextPosition = {
        x:100/scale,
        y:100/scale
    };

    document
        .getElementById("textModal")
        .classList.remove("hidden");

    document
        .getElementById("textInput")
        .focus();
}


function insertText(){

    const text =
        document
        .getElementById("textInput")
        .value
        .trim();

    if(!text){

        closeTextModal();

        return;
    }

    boardObjects.push({

        type:"text",

        x:pendingTextPosition.x,

        y:pendingTextPosition.y,

        text:text,

        size:22,

        color:"#222"

    });

    saveHistory();

    redrawBoard();

    broadcastBoard();

    document
        .getElementById("textInput")
        .value="";

    closeTextModal();
}


function closeTextModal(){

    document
        .getElementById("textModal")
        .classList.add("hidden");
}


/* =========================================================
   TOOL
   ========================================================= */

function setTool(tool){

    currentTool=tool;

    document
        .querySelectorAll(".tool")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    const selected =
        document.getElementById(
            "tool-"+tool
        );

    if(selected)
        selected.classList.add("active");
}


function drawShape(type){

    setTool(type);
}


/* =========================================================
   ERASER
   ========================================================= */

function eraseAt(x,y){

    const distance=25;

    boardObjects =
        boardObjects.filter(obj=>{

            if(obj.type==="stroke"){

                return !obj.points.some(p=>{

                    return Math.hypot(
                        p.x-x,
                        p.y-y
                    ) < distance;

                });

            }

            if(obj.type==="text"){

                return Math.hypot(
                    obj.x-x,
                    obj.y-y
                ) > distance;

            }

            const minX=
                Math.min(obj.x,obj.x2);

            const maxX=
                Math.max(obj.x,obj.x2);

            const minY=
                Math.min(obj.y,obj.y2);

            const maxY=
                Math.max(obj.y,obj.y2);

            return !(
                x>=minX-distance &&
                x<=maxX+distance &&
                y>=minY-distance &&
                y<=maxY+distance
            );

        });

    redrawBoard();

    broadcastBoard();
}


/* =========================================================
   HISTORY
   ========================================================= */

function saveHistory(){

    history.push(
        JSON.stringify(boardObjects)
    );

    if(history.length>50)
        history.shift();

    redoHistory=[];
}


function undoBoard(){

    if(history.length<=1)
        return;

    redoHistory.push(
        history.pop()
    );

    boardObjects =
        JSON.parse(
            history[history.length-1]
        );

    redrawBoard();

    broadcastBoard();
}


function redoBoard(){

    if(!redoHistory.length)
        return;

    const state =
        redoHistory.pop();

    history.push(state);

    boardObjects =
        JSON.parse(state);

    redrawBoard();

    broadcastBoard();
}


async function clearBoard(){

    if(!confirm("کل نوشته‌های تخته پاک شود؟"))
        return;

    boardObjects=[];

    saveHistory();

    redrawBoard();

    broadcastBoard();

    await saveBoard();
}


/* =========================================================
   SUPABASE WHITEBOARD
   ========================================================= */

async function loadBoard(){

    const {data} =
        await supabaseClient
        .from("whiteboards")
        .select("*")
        .eq("meeting_id",currentRoomId)
        .maybeSingle();

    if(data && data.objects){

        boardObjects =
            data.objects;

    }else{

        boardObjects=[];

    }

    history=[
        JSON.stringify(boardObjects)
    ];

    redrawBoard();
}


async function saveBoard(){

    await supabaseClient
        .from("whiteboards")
        .upsert({

            meeting_id:currentRoomId,

            objects:boardObjects,

            updated_at:
                new Date().toISOString()

        },{
            onConflict:"meeting_id"
        });
}


function broadcastBoard(){

    if(!channel)
        return;

    channel.send({

        type:"broadcast",

        event:"board",

        payload:{

            sender:currentUser.id,

            action:"state",

            objects:boardObjects

        }

    });

    saveBoard();
}


/* =========================================================
   ZOOM
   ========================================================= */

function zoomIn(){

    scale=Math.min(
        scale+0.1,
        3
    );

    redrawBoard();
}


function zoomOut(){

    scale=Math.max(
        scale-0.1,
        0.4
    );

    redrawBoard();
}


function resetZoom(){

    scale=1;

    offsetX=0;

    offsetY=0;

    redrawBoard();
}


/* =========================================================
   CHAT
   ========================================================= */

async function sendMessage(){

    const input =
        document.getElementById("chatInput");

    const text =
        input.value.trim();

    if(!text)
        return;

    await supabaseClient
        .from("chat_messages")
        .insert({

            meeting_id:currentRoomId,

            user_id:currentUser.id,

            user_name:currentUser.name,

            message:text

        });

    input.value="";
}


async function loadMessages(){

    const {data} =
        await supabaseClient
        .from("chat_messages")
        .select("*")
        .eq("meeting_id",currentRoomId)
        .order("created_at");

    const box =
        document.getElementById("messages");

    box.innerHTML="";

    (data || []).forEach(
        addMessageToUI
    );
}


function addMessageToUI(message){

    const box =
        document.getElementById("messages");

    if(
        box.querySelector(
            `[data-message-id="${message.id}"]`
        )
    )
        return;

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (
            message.user_id === currentUser.id
            ? "mine"
            : ""
        );

    div.dataset.messageId =
        message.id || "";

    div.innerHTML=`

        <div class="who">
            ${escapeHtml(message.user_name)}
        </div>

        <div class="bubble">
            ${escapeHtml(message.message)}
        </div>

    `;

    box.appendChild(div);

    box.scrollTop =
        box.scrollHeight;
}


/* =========================================================
   PANEL
   ========================================================= */

function toggleSidePanel(){

    document
        .getElementById("sidePanel")
        .classList.toggle("open");
}


function showPanel(panel){

    const members =
        document.getElementById(
            "membersPanel"
        );

    const chat =
        document.getElementById(
            "chatPanel"
        );

    const membersTab =
        document.getElementById(
            "membersTab"
        );

    const chatTab =
        document.getElementById(
            "chatTab"
        );

    if(panel==="members"){

        members.classList.remove("hidden");

        chat.classList.add("hidden");

        membersTab.classList.add("active");

        chatTab.classList.remove("active");

    }else{

        members.classList.add("hidden");

        chat.classList.remove("hidden");

        membersTab.classList.remove("active");

        chatTab.classList.add("active");

    }
}


/* =========================================================
   MICROPHONE
   ========================================================= */

async function toggleMic(){

    if(!localStream){

        try{

            localStream =
                await navigator.mediaDevices
                .getUserMedia({
                    audio:true,
                    video:false
                });

        }catch(e){

            alert(
                "دسترسی میکروفون داده نشد."
            );

            return;
        }
    }

    const tracks =
        localStream.getAudioTracks();

    if(!tracks.length)
        return;

    micEnabled =
        !micEnabled;

    tracks.forEach(
        t=>t.enabled=micEnabled
    );

    document
        .getElementById("micBtn")
        .classList.toggle(
            "active",
            !micEnabled
        );
}


/* =========================================================
   CAMERA
   ========================================================= */

async function toggleCamera(){

    if(!localStream){

        try{

            localStream =
                await navigator.mediaDevices
                .getUserMedia({
                    audio:true,
                    video:true
                });

        }catch(e){

            alert(
                "دسترسی دوربین داده نشد."
            );

            return;
        }

    }else{

        const videoTracks =
            localStream.getVideoTracks();

        if(!videoTracks.length){

            try{

                const stream =
                    await navigator.mediaDevices
                    .getUserMedia({
                        video:true
                    });

                stream
                    .getVideoTracks()
                    .forEach(
                        track=>{
                            localStream.addTrack(track);
                        }
                    );

            }catch(e){

                alert(
                    "دسترسی دوربین داده نشد."
                );

                return;
            }
        }

    }

    cameraEnabled =
        !cameraEnabled;

    localStream
        .getVideoTracks()
        .forEach(
            t=>t.enabled=cameraEnabled
        );

    document
        .getElementById("cameraBtn")
        .classList.toggle(
            "active",
            !cameraEnabled
        );
}


/* =========================================================
   SCREEN SHARE
   ========================================================= */

async function shareScreen(){

    try{

        screenStream =
            await navigator.mediaDevices
            .getDisplayMedia({
                video:true
            });

        screenStream
            .getVideoTracks()[0]
            .addEventListener(
                "ended",
                ()=>{
                    screenStream=null;
                }
            );

    }catch(e){

        console.log(e);

    }
}


/* =========================================================
   WEBRTC SIGNALING
   ========================================================= */

async function handleWebRTCSignal(signal){

    /*
      این قسمت برای signaling واقعی WebRTC آماده است.
      ارتباط peer-to-peer می‌تواند از همین Realtime channel
      برای offer / answer / ICE استفاده کند.
    */

    if(!signal)
        return;

    if(signal.type==="ping"){

        if(roomChannel){

            roomChannel.send({

                type:"broadcast",

                event:"webrtc",

                payload:{
                    type:"pong",
                    sender:currentUser.id
                }

            });

        }

    }

}


/* =========================================================
   SHARE CLASS
   ========================================================= */

async function shareClass(){

    const text =
        "کلاس زبان شیرین\n\n" +
        "کد جلسه: " +
        currentRoom.room_code +
        "\n" +
        "رمز کلاس: " +
        currentRoom.password;

    try{

        await navigator.clipboard.writeText(text);

        alert(
            "اطلاعات ورود کلاس کپی شد."
        );

    }catch(e){

        alert(text);

    }
}


/* =========================================================
   LEAVE
   ========================================================= */

async function leaveClass(){

    if(currentRoomId && currentUser){

        await supabaseClient
            .from("meeting_members")
            .update({

                is_online:false,

                last_seen:
                    new Date().toISOString()

            })
            .eq(
                "meeting_id",
                currentRoomId
            )
            .eq(
                "user_id",
                currentUser.id
            );

    }

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

    }

    if(channel){

        await supabaseClient
            .removeChannel(channel);

        channel=null;

    }

    if(roomChannel){

        await supabaseClient
            .removeChannel(roomChannel);

        roomChannel=null;

    }

    currentRoom=null;

    currentRoomId=null;

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("loginPage")
        .classList.remove("hidden");
}


/* =========================================================
   SECURITY / ESCAPE
   ========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   STARTUP
   ========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{
        if(currentRoomId && currentUser){

            supabaseClient
                .from("meeting_members")
                .update({
                    is_online:false,
                    last_seen:
                        new Date().toISOString()
                })
                .eq(
                    "meeting_id",
                    currentRoomId
                )
                .eq(
                    "user_id",
                    currentUser.id
                );
        }
    }
);
