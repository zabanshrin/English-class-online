<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>زبان شیرین</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#070b14;
  --panel:#101827;
  --panel2:#172238;
  --line:#27344b;
  --text:#f7f9ff;
  --muted:#9ca9bd;
  --primary:#6677ff;
  --primary2:#8b5cf6;
  --green:#20c997;
  --red:#ff5c70;
  --yellow:#f5bd45;
  --shadow:0 20px 60px #0008;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 20% 0,#1c2754 0,transparent 35%),
    radial-gradient(circle at 100% 100%,#25174b 0,transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
}
body{overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.topbar{
  height:68px;
  position:fixed;
  top:0;
  right:0;
  left:0;
  z-index:50;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  background:#09101deb;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}
.brand{
  font-size:21px;
  font-weight:900;
  margin-left:auto;
}
.menu-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:13px;
  color:#fff;
  background:#172238;
  font-size:22px;
}
.avatar{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  font-weight:900;
}

.sidebar{
  position:fixed;
  right:0;
  top:68px;
  bottom:0;
  width:260px;
  z-index:45;
  padding:18px;
  background:#0a1120f2;
  border-left:1px solid var(--line);
  transform:translateX(110%);
  transition:.25s;
}
.sidebar.open{transform:translateX(0)}
.nav{
  display:grid;
  gap:7px;
}
.nav button{
  width:100%;
  padding:13px 15px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#cbd5e1;
  text-align:right;
}
.nav button:hover,
.nav button.active{
  background:#1a2740;
  color:#fff;
}

.main{
  width:100%;
  max-width:1450px;
  margin:68px auto 0;
  padding:22px;
}
.page{display:none}
.page.active{display:block}

.hero{
  padding:30px;
  margin-bottom:20px;
  border:1px solid var(--line);
  border-radius:25px;
  background:linear-gradient(135deg,#151f39,#101827);
  box-shadow:var(--shadow);
}
.hero h1{
  margin:0 0 10px;
  font-size:clamp(30px,6vw,55px);
}
.hero h2{margin-top:0}
.hero p{
  color:var(--muted);
  line-height:1.9;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:15px;
}
.card{
  padding:18px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  box-shadow:0 10px 35px #0003;
}
.card h3{margin-top:0}
.muted{color:var(--muted)}
.row{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  padding:11px 15px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#24314a;
}
.btn.primary{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
}
.btn.danger{background:#632538}
.btn.green{background:#145b45}
.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.field{
  display:grid;
  gap:7px;
  margin:13px 0;
}
.field label{
  color:#bac5d7;
  font-size:13px;
}
.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #2a3953;
  border-radius:12px;
  outline:none;
  color:#fff;
  background:#090f1b;
}
.field textarea{
  min-height:100px;
  resize:vertical;
}
.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--primary);
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}
.auth-box{
  width:min(450px,100%);
  padding:28px;
  border:1px solid var(--line);
  border-radius:25px;
  background:#101827;
  box-shadow:var(--shadow);
}
.auth-brand{
  text-align:center;
  font-size:34px;
  font-weight:900;
}
.auth-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:22px;
}
.tabs{
  display:flex;
  gap:6px;
  padding:5px;
  border-radius:13px;
  background:#090f1b;
}
.tabs button{
  flex:1;
  padding:10px;
  border:0;
  border-radius:10px;
  color:#aeb9ca;
  background:transparent;
}
.tabs button.active{
  color:#fff;
  background:#273550;
}

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:grid;
  place-items:center;
  padding:18px;
  background:#000b;
}
.modal-box{
  width:min(470px,100%);
  padding:23px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#101827;
  box-shadow:var(--shadow);
}

.toast-box{
  position:fixed;
  left:15px;
  bottom:15px;
  z-index:300;
  width:min(420px,calc(100vw - 30px));
  display:grid;
  gap:8px;
}
.toast{
  padding:12px 15px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#18243a;
  box-shadow:var(--shadow);
}
.toast.error{border-color:#9b3045}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:15px;
}
table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}
th,td{
  padding:11px;
  border-bottom:1px solid var(--line);
  text-align:right;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:#cbd5e1;
  font-size:12px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#777;
}
.dot.green{background:var(--green)}
.dot.yellow{background:var(--yellow)}
.dot.red{background:var(--red)}

/* CLASSROOM */

.classroom{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  background:#03070d;
}
.class-header{
  min-height:62px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 12px;
  background:#0b1220;
  border-bottom:1px solid #202b3d;
}
.class-title{
  margin-left:auto;
  font-weight:900;
}
.connection{
  color:#aeb9c9;
  font-size:12px;
}
.stage{
  position:relative;
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 310px;
  gap:10px;
  padding:10px;
}
.video-area{
  position:relative;
  min-width:0;
  overflow:hidden;
  border:1px solid #1d293d;
  border-radius:16px;
  background:#02050a;
}
.videos{
  height:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  align-content:start;
  gap:10px;
  overflow:auto;
  padding:10px;
}
.video-tile{
  position:relative;
  overflow:hidden;
  min-height:130px;
  aspect-ratio:16/10;
  border:1px solid #27344a;
  border-radius:14px;
  background:#0b1321;
}
.video-tile video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#02050a;
}
.video-name{
  position:absolute;
  right:7px;
  bottom:7px;
  padding:5px 8px;
  border-radius:8px;
  color:#fff;
  background:#000a;
  font-size:12px;
}
.local-tile{
  position:absolute;
  left:15px;
  bottom:15px;
  width:185px;
  z-index:10;
}
.local-tile video{
  display:block;
  width:100%;
  border-radius:14px;
}

.side-panel{
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border:1px solid #202c40;
  border-radius:16px;
  background:#0c1422;
}
.side-tabs{
  display:flex;
  border-bottom:1px solid var(--line);
}
.side-tabs button{
  flex:1;
  padding:11px;
  border:0;
  color:#aeb9ca;
  background:transparent;
}
.side-tabs button.active{
  color:#fff;
  background:#18243a;
}
.side-body{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:10px;
}
.member{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 4px;
  border-bottom:1px solid #202b3e;
}
.member-avatar{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#263550;
  font-size:12px;
  font-weight:800;
}
.member-info{
  min-width:0;
  flex:1;
}
.member-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.member-meta{
  color:var(--muted);
  font-size:11px;
}
.chat-message{
  margin:7px 0;
  padding:9px 10px;
  border-radius:10px;
  background:#182338;
}
.chat-message b{
  display:block;
  margin-bottom:3px;
  font-size:12px;
}
.chat-message small{
  display:block;
  margin-top:5px;
  color:#7f8da4;
}
.chat-input{
  display:flex;
  gap:6px;
  padding:8px;
  border-top:1px solid var(--line);
}
.chat-input input{
  min-width:0;
  flex:1;
  padding:10px;
  color:#fff;
  border:1px solid #29374e;
  border-radius:10px;
  background:#080f1b;
}

.class-tools{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  padding:9px;
  background:#0b1220;
  border-top:1px solid #202b3d;
}
.tool{
  width:45px;
  height:45px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:#1b273b;
}
.tool.active{background:var(--primary)}
.tool.leave{background:#68283b}

/* WHITEBOARD */

.whiteboard{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  flex-direction:column;
  color:#111;
  background:#fff;
}
.whiteboard.open{display:flex}
.board-toolbar{
  display:flex;
  align-items:center;
  gap:7px;
  overflow:auto;
  min-height:58px;
  padding:7px;
  color:#fff;
  background:#111827;
}
.board-toolbar button{
  padding:8px 11px;
  border:0;
  border-radius:9px;
  color:#fff;
  background:#27344c;
  white-space:nowrap;
}
.board-toolbar button.active{background:#6677ff}
.board-canvas-wrap{
  position:relative;
  flex:1;
  overflow:auto;
  background:#fff;
}
#boardCanvas{
  display:block;
  background:#fff;
  touch-action:none;
}
.text-editor{
  position:absolute;
  z-index:10;
  display:none;
  width:220px;
  padding:8px;
  border:2px solid #6677ff;
  border-radius:9px;
  background:#fff;
}
.text-editor textarea{
  width:100%;
  min-height:75px;
  color:#111;
  border:0;
  outline:0;
  resize:none;
}
.text-editor-actions{
  display:flex;
  gap:5px;
  justify-content:flex-end;
}
.text-editor-actions button{
  padding:6px 9px;
  border:0;
  border-radius:7px;
}
.board-readonly{
  padding:5px 10px;
  color:#cbd5e1;
  font-size:12px;
}

@media(min-width:900px){
  .sidebar{
    transform:none;
  }
  .main{
    margin-right:260px;
  }
  .menu-btn{
    display:none;
  }
}
@media(max-width:899px){
  .stage{
    display:block;
  }
  .side-panel{
    position:absolute;
    right:10px;
    left:10px;
    bottom:10px;
    height:55vh;
    display:none;
    z-index:20;
  }
  .side-panel.open{display:flex}
  .videos{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(max-width:550px){
  .main{padding:14px}
  .hero{padding:20px}
  .videos{grid-template-columns:1fr}
  .local-tile{width:125px}
  .class-title{font-size:14px}
  .connection{display:none}
  .class-header .btn{padding:9px}
}
</style>
</head>

<body>

<div id="app"></div>
<div id="toastBox" class="toast-box"></div>

<script>
"use strict";

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://uqqumhmzndgyoigcqnti.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_R3LAX7EYbdYUwjQRgkmesA_QJ2ZmPtD";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false
    }
  }
);

/* =========================================================
   APPLICATION STATE
========================================================= */

const state = {
  user:null,
  profile:null,
  page:"home",
  meetings:[],
  notifications:[],
  users:[],
  classId:null,
  classData:null,
  side:"members"
};

/* =========================================================
   RTC STATE
========================================================= */

const rtc = {
  localStream:null,
  localVideoTrack:null,
  localAudioTrack:null,
  cameraDeviceId:null,
  facingMode:"user",

  signalChannel:null,
  presenceChannel:null,
  chatChannel:null,
  boardChannel:null,

  peers:new Map(),
  peerUsers:new Map(),
  polite:new Map(),
  makingOffer:new Map(),
  ignoreOffer:new Map(),
  pendingIce:new Map(),
  remoteStreams:new Map(),
  reconnectTimers:new Map(),

  destroyed:false,
  joining:false,

  memberState:new Map(),

  listeners:[],
  timers:[]
};

/* =========================================================
   WHITEBOARD STATE
========================================================= */

const board = {
  canvas:null,
  ctx:null,
  objects:new Map(),
  undo:[],
  redo:[],
  tool:"pen",
  color:"#111111",
  size:3,
  drawing:false,
  startX:0,
  startY:0,
  current:null,
  selectedId:null,
  editingId:null,
  canEdit:false
};

/* =========================================================
   HELPERS
========================================================= */

const $ = selector => document.querySelector(selector);

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function initials(name){
  const s=String(name||"?").trim();
  if(!s)return "?";
  return s.split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}

function roleText(role){
  if(role==="admin")return "مدیر";
  if(role==="teacher")return "استاد";
  return "دانش‌آموز";
}

function isTeacher(){
  return state.profile?.role==="teacher" ||
         state.profile?.role==="admin";
}

function isAdmin(){
  return state.profile?.role==="admin";
}

function toast(message,type=""){
  const box=$("#toastBox");
  if(!box)return;
  const el=document.createElement("div");
  el.className="toast "+(type==="error"?"error":"");
  el.textContent=message;
  box.appendChild(el);
  setTimeout(()=>el.remove(),4500);
}

function showError(error){
  console.error(error);
  toast(error?.message || "خطای نامشخصی رخ داد","error");
}

function formatDate(value){
  if(!value)return "";
  try{
    return new Date(value).toLocaleString("fa-IR");
  }catch{
    return "";
  }
}

async function rpc(name,args){
  const result=await db.rpc(name,args);
  if(result.error)throw result.error;
  return result.data;
}

/* =========================================================
   BOOT
========================================================= */

async function boot(){

  try{

    const saved=localStorage.getItem("zaban_shirin_session");

    if(saved){
      try{
        state.user=JSON.parse(saved);
      }catch{
        state.user=null;
      }
    }

    if(state.user?.id){
      await loadProfile();
    }

    if(state.user?.id){
      renderShell();
      await loadPageData("home");
    }else{
      renderAuth();
    }

  }catch(error){
    showError(error);
    renderAuth();
  }
}

/* =========================================================
   AUTH
========================================================= */

function renderAuth(){

  $("#app").innerHTML=`
    <div class="auth">
      <div class="auth-box">

        <div class="auth-brand">زبان شیرین 🍯</div>

        <div class="auth-sub">
          آموزش آنلاین، کلاس زنده و یادگیری تعاملی
        </div>

        <div class="tabs">
          <button id="loginTab" class="active">ورود</button>
          <button id="registerTab">ثبت‌نام</button>
        </div>

        <div id="authForm"></div>

      </div>
    </div>
  `;

  $("#loginTab").onclick=()=>renderAuthForm("login");
  $("#registerTab").onclick=()=>renderAuthForm("register");

  renderAuthForm("login");
}

function renderAuthForm(mode){

  const register=mode==="register";

  $("#loginTab").classList.toggle("active",!register);
  $("#registerTab").classList.toggle("active",register);

  $("#authForm").innerHTML=register?`

    <div class="field">
      <label>نام</label>
      <input id="authName" autocomplete="name">
    </div>

    <div class="field">
      <label>نام کاربری</label>
      <input id="authUsername" autocomplete="username">
    </div>

    <div class="field">
      <label>رمز عبور</label>
      <input id="authPassword" type="password" autocomplete="new-password">
    </div>

    <button class="btn primary" id="authSubmit" style="width:100%">
      ساخت حساب
    </button>

  `:`

    <div class="field">
      <label>نام کاربری</label>
      <input id="authUsername" autocomplete="username">
    </div>

    <div class="field">
      <label>رمز عبور</label>
      <input id="authPassword" type="password" autocomplete="current-password">
    </div>

    <button class="btn primary" id="authSubmit" style="width:100%">
      ورود
    </button>

  `;

  $("#authSubmit").onclick=()=>authenticate(register);
}

async function authenticate(register){

  try{

    const username=$("#authUsername").value.trim();
    const password=$("#authPassword").value;

    if(!username || !password){
      throw new Error("نام کاربری و رمز عبور را وارد کنید.");
    }

    let result;

    if(register){

      const name=$("#authName").value.trim();

      if(!name){
        throw new Error("نام را وارد کنید.");
      }

      result=await rpc(
        "register_username",
        {
          p_name:name,
          p_username:username,
          p_password:password
        }
      );

    }else{

      result=await rpc(
        "login_username",
        {
          p_username:username,
          p_password:password
        }
      );

    }

    const user=Array.isArray(result)?result[0]:result;

    if(!user?.id){
      throw new Error("اطلاعات ورود معتبر دریافت نشد.");
    }

    state.user={
      id:user.id,
      username:user.username || username,
      name:user.name || user.full_name || username,
      role:user.role
    };

    localStorage.setItem(
      "zaban_shirin_session",
      JSON.stringify(state.user)
    );

    await loadProfile();

    renderShell();

    await loadPageData("home");

    toast(register?"حساب با موفقیت ساخته شد":"ورود موفق بود");

  }catch(error){
    showError(error);
  }
}

async function loadProfile(){

  const result=await db
    .from("profiles")
    .select("*")
    .eq("id",state.user.id)
    .maybeSingle();

  if(result.error)throw result.error;

  if(!result.data){
    state.profile=state.user;
  }else{
    state.profile=result.data;
  }

}

/* =========================================================
   SHELL
========================================================= */

function navItem(page,label,icon){

  return `
    <button
      data-page="${page}"
      class="${state.page===page?"active":""}"
    >
      ${icon} &nbsp; ${label}
    </button>
  `;
}

function renderShell(){

  $("#app").innerHTML=`

    <header class="topbar">

      <button class="menu-btn" id="menuButton">
        ☰
      </button>

      <div class="brand">
        زبان شیرین
      </div>

      <div class="avatar">
        ${esc(initials(state.profile?.name))}
      </div>

    </header>

    <aside class="sidebar" id="sidebar">

      <nav class="nav">

        ${navItem("home","خانه","⌂")}

        ${navItem("my","کلاس‌های من","▣")}

        ${navItem("classes","کلاس‌ها","◈")}

        ${isTeacher()?navItem("create","ساخت کلاس","＋"):""}

        ${navItem("profile","پروفایل","●")}

        ${navItem("settings","تنظیمات","⚙")}

/* =========================================================

========================================================= */

async function setPage(page){

  state.page=page;

  renderShell();

  await loadPageData(page);
}

async function loadPageData(page){

  try{

    if(
      page==="home" ||
      page==="classes" ||
      page==="my" ||
      page==="create" ||
      page==="admin"
    ){
      await loadMeetings();
    }

    if(page==="notifications"){
      await loadNotifications();
    }

    if(page==="admin"){
      if(!isAdmin()){
        throw new Error("دسترسی غیرمجاز.");
      }
      await loadUsers();
    }

    renderPage(page);

  }catch(error){
    showError(error);
    renderPage(page);
  }
}

async function loadMeetings(){

  const result=await db
    .from("meetings")
    .select("*")
    .order("created_at",{ascending:false});

  if(result.error)throw result.error;

  state.meetings=result.data || [];

  const target=$("#page");

  if(page==="home")renderHome(target);
  else if(page==="classes")renderClasses(target,false);
  else if(page==="my")renderClasses(target,true);
  else if(page==="create")renderCreate(target);
  else if(page==="profile")renderProfile(target);
  else if(page==="settings")renderSettings(target);
  else if(page==="notifications")renderNotifications(target);
  else if(page==="admin")renderAdmin(target);
  else renderHome(target);
}

async function createMeeting(){

  try{

    const name=$("#meetingName").value.trim();

    if(!name){
      throw new Error("نام کلاس الزامی است.");
    }

    const capacity=Number($("#meetingCapacity").value);

    if(!Number.isInteger(capacity) || capacity<1){
      throw new Error("ظرفیت کلاس معتبر نیست.");
    }

    await rpc(
      "create_meeting",
      {
        p_capacity:capacity,
        p_description:$("#meetingDescription").value.trim(),
        p_name:name,
        p_password:$("#meetingPassword").value,
        p_status:$("#meetingStatus").value
      }
    );

    toast("کلاس با موفقیت ساخته شد");

    await loadMeetings();

    await setPage("classes");

  }catch(error){
    showError(error);
  }
}

function openJoinModal(id){

  const meeting=state.meetings.find(
    x=>String(x.id)===String(id)

  const modal=document.createElement("div");

  modal.className="modal";

  modal.innerHTML=`

    <div class="modal-box">

      <h2>
        ورود به ${esc(meeting.name)}
      </h2>

      <div class="field">
        <label>رمز کلاس</label>
        <input id="joinPassword" type="password">
      </div>

      <div class="row">

        <button
          class="btn"
          id="joinCancel"
        >
          انصراف
        </button>

        <button
          class="btn primary"
          id="joinConfirm"
        >
          ورود
        </button>

      </div>

    </div>
  `;

  document.body.appendChild(modal);

  modal.querySelector("#joinCancel").onclick=()=>{
    modal.remove();
  };

  modal.querySelector("#joinConfirm").onclick=async()=>{

    try{

      const password=modal.querySelector("#joinPassword").value;

      const result=await rpc(
        "join_meeting_with_password",
        {
          p_meeting_id:id,
          p_password:password
        }
      );

      modal.remove();

      await enterClassroom(
        id,
        meeting,
        result
      );

    }catch(error){
      showError(error);
    }

  };
}

/* =========================================================
   MEDIA
========================================================= */

async function requestLocalMedia(){

  if(!navigator.mediaDevices?.getUserMedia){
    throw new Error(
      "مرورگر شما از دسترسی دوربین و میکروفون پشتیبانی نمی‌کند."
    );
  }

  let stream;

  try{

    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:rtc.facingMode,
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });

  }catch(error){

    if(error.name==="NotAllowedError"){
      throw new Error(
        "دسترسی دوربین یا میکروفون رد شده است. Permission مرورگر را بررسی کنید."
      );
    }

    if(error.name==="NotFoundError"){
      throw new Error(
        "دوربین یا میکروفون روی دستگاه پیدا نشد."
      );
    }

    throw error;
  }

  rtc.localStream=stream;

  rtc.localVideoTrack=stream.getVideoTracks()[0] || null;
  rtc.localAudioTrack=stream.getAudioTracks()[0] || null;

  const video=$("#localVideo");

  if(video){

    video.srcObject=stream;

    try{
      await video.play();
    }catch{}
  }

  updateMediaButtons();
}

function updateMediaButtons(){

  const mic=$("#micButton");
  const cam=$("#cameraButton");

  if(mic){

    mic.classList.toggle(
      "active",
      !!rtc.localAudioTrack?.enabled
    );

  }

  if(cam){

    cam.classList.toggle(
      "active",
      !!rtc.localVideoTrack?.enabled
    );

  }
}

function toggleMicrophone(){

  if(!rtc.localAudioTrack)return;

  rtc.localAudioTrack.enabled=
    !rtc.localAudioTrack.enabled;

  updateMediaButtons();

  publishMemberState();
}

function toggleCamera(){

  if(!rtc.localVideoTrack)return;

  rtc.localVideoTrack.enabled=
    !rtc.localVideoTrack.enabled;

  updateMediaButtons();

  publishMemberState();
}

async function flipCamera(){

  if(!rtc.localVideoTrack){
    toast("دوربین فعال نیست","error");
    return;
  }

  if(!navigator.mediaDevices?.getUserMedia){
    return;
  }

  rtc.facingMode=
    rtc.facingMode==="user"
    ?"environment"
    :"user";

  try{

    const stream=
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            exact:rtc.facingMode
          }
        },
        audio:false
      });

    const newTrack=stream.getVideoTracks()[0];

    if(!newTrack)throw new Error("دوربین جدید پیدا نشد.");

    for(const peer of rtc.peers.values()){

      const sender=peer
        .getSenders()
        .find(s=>s.track?.kind==="video");

      if(sender){
        await sender.replaceTrack(newTrack);
      }
    }

    rtc.localVideoTrack.stop();

    rtc.localVideoTrack=newTrack;

    if(rtc.localStream){

      const old=rtc.localStream
        .getVideoTracks()[0];

      if(old){
        rtc.localStream.removeTrack(old);
      }

      rtc.localStream.addTrack(newTrack);
    }

    $("#localVideo").srcObject=rtc.localStream;

    publishMemberState();

  }catch(error){

    if(error.name==="OverconstrainedError"){
      toast("این دستگاه امکان تغییر دوربین را در این حالت ندارد","error");
      return;
    }

    showError(error);
  }
}

/* =========================================================
   SCREEN SHARE
========================================================= */

async function shareScreen(){

  if(!navigator.mediaDevices?.getDisplayMedia){

    toast(
      "مرورگر شما Screen Share را پشتیبانی نمی‌کند.",
      "error"
    );

    return;
  }

  try{

    const display=
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:true
      });

    const track=display.getVideoTracks()[0];

    if(!track)return;

    rtc.screenTrack=track;

    for(const peer of rtc.peers.values()){

      const sender=peer
        .getSenders()
        .find(s=>s.track?.kind==="video");

      if(sender){
        await sender.replaceTrack(track);
      }
    }

    track.onended=async()=>{

      if(!rtc.localVideoTrack)return;

      for(const peer of rtc.peers.values()){

        const sender=peer
          .getSenders()
          .find(s=>s.track?.kind==="video");

        if(sender){
          await sender.replaceTrack(
            rtc.localVideoTrack
          );
        }
      }

      rtc.screenTrack=null;
    };

    toast("اشتراک‌گذاری صفحه فعال شد");

  }catch(error){

    if(error.name==="NotAllowedError"){
      toast("اشتراک‌گذاری صفحه لغو شد.","error");
      return;
    }

    showError(error);
  }
}

/* =========================================================
   REALTIME SETUP
========================================================= */

async function setupRealtime(){

  if(!state.classId){
    throw new Error("شناسه کلاس مشخص نیست.");
  }

  const classId=String(state.classId);

  rtc.signalChannel=
    db.channel(`class:${classId}:signal:${state.user.id}`);

  rtc.signalChannel.on(
    "broadcast",
    {event:"rtc"},
    payload=>{
      handleRTCSignal(payload.payload);
    }
  );

  rtc.signalChannel.on(
    "broadcast",
    {event:"member"},
    payload=>{
      handleMemberSignal(payload.payload);
    }
  );

  rtc.signalChannel.on(
    "broadcast",
    {event:"chat"},
    payload=>{
      handleRealtimeChat(payload.payload);
    }
  );

  rtc.signalChannel.on(
    "broadcast",
    {event:"board"},
    payload=>{
      handleBoardRealtime(payload.payload);
    }
  );

  const signalResult=
    await rtc.signalChannel.subscribe();

  if(signalResult!=="SUBSCRIBED"){
    throw new Error(
      "اتصال Realtime کلاس برقرار نشد."
    );
  }

  rtc.chatChannel=
    db.channel(`class:${classId}:messages`);

  rtc.chatChannel.on(
    "postgres_changes",
    {
      event:"INSERT",
      schema:"public",
      table:"messages",
      filter:`meeting_id=eq.${classId}`
    },
    payload=>{
      appendChatMessage(payload.new);
    }
  );

  await rtc.chatChannel.subscribe();

  rtc.boardChannel=
    db.channel(`class:${classId}:whiteboard`);

  rtc.boardChannel.on(
    "postgres_changes",
    {
      event:"INSERT",
      schema:"public",
      table:"whiteboard_objects",
      filter:`meeting_id=eq.${classId}`
    },
    payload=>{
      receiveBoardDatabaseObject(payload.new);
    }
  );

  rtc.boardChannel.on(
    "postgres_changes",
    {
      event:"UPDATE",
      schema:"public",
      table:"whiteboard_objects",
      filter:`meeting_id=eq.${classId}`
    },
    payload=>{
      receiveBoardDatabaseObject(payload.new);
    }
  );

  rtc.boardChannel.on(
    "postgres_changes",
    {
      event:"DELETE",
      schema:"public",
      table:"whiteboard_objects",
      filter:`meeting_id=eq.${classId}`
    },
    payload=>{
      if(payload.old?.id){
        board.objects.delete(String(payload.old.id));
        redrawBoard();
      }
    }
  );

  await rtc.boardChannel.subscribe();
}

   PRESENCE
========================================================= */

async function setupPresence(){

  const classId=String(state.classId);

  rtc.presenceChannel=
    db.channel(`class:${classId}:presence`);

  rtc.presenceChannel.on(
    "presence",
    {event:"sync"},
    ()=>{
      syncPresenceUsers();
    }
  );

  rtc.presenceChannel.on(
    "presence",
    {event:"join"},
    payload=>{
      handlePresenceJoin(payload);
    }
  );

  rtc.presenceChannel.on(
    "presence",
    {event:"leave"},
    payload=>{
      handlePresenceLeave(payload);
    }
  );

  const result=
    await rtc.presenceChannel.subscribe();

  if(result!=="SUBSCRIBED"){
    throw new Error("Presence کلاس متصل نشد.");
  }

  await rtc.presenceChannel.track({
    user_id:state.user.id,
    name:state.profile?.name || state.user.name,
    username:state.profile?.username || state.user.username,
    role:state.profile?.role || state.user.role,
    microphone:!!rtc.localAudioTrack?.enabled,
    camera:!!rtc.localVideoTrack?.enabled,
    online:true
  });

  renderMembers();
}

async function publishMemberState(){

  if(!rtc.presenceChannel)return;

  try{

    await rtc.presenceChannel.track({
      user_id:state.user.id,
      name:state.profile?.name || state.user.name,
      username:state.profile?.username || state.user.username,
      role:state.profile?.role || state.user.role,
      microphone:!!rtc.localAudioTrack?.enabled,
      camera:!!rtc.localVideoTrack?.enabled,
      online:true
    });

  }catch(error){
    console.warn(error);
  }
}

function syncPresenceUsers(){

  if(!rtc.presenceChannel)return;

  const statePresence=
    rtc.presenceChannel.presenceState();

  rtc.memberState.clear();

  Object.values(statePresence).forEach(entries=>{

    entries.forEach(entry=>{

      if(entry.user_id){
        rtc.memberState.set(
          String(entry.user_id),
          entry
        );
      }

    });

  });

  renderMembers();
}

function handlePresenceJoin(){

  syncPresenceUsers();

}

function handlePresenceLeave(){

  syncPresenceUsers();

}

/* =========================================================
   RTC SIGNALING
========================================================= */

async function announceJoin(){

  await sendRTC({
    type:"join",
    from:state.user.id,
    name:state.profile?.name || state.user.name,
    role:state.profile?.role || state.user.role
  });

}

async function sendRTC(message){

  if(!rtc.signalChannel)return;

  try{

    await rtc.signalChannel.send({
      type:"broadcast",
      event:"rtc",
      payload:{
        ...message,
        class_id:String(state.classId),
        from:String(message.from || state.user.id)
      }
    });

  }catch(error){
    console.warn("RTC send error",error);
  }
}

async function handleRTCSignal(message){

  if(rtc.destroyed)return;
  if(!message)return;

  if(
    message.class_id &&
    String(message.class_id)!==String(state.classId)
  ){
    return;
  }

  if(
    String(message.from)===String(state.user.id)
  ){
    return;
  }

  const from=String(message.from);

  try{

    if(message.type==="join"){

      rtc.peerUsers.set(
        from,
        {
          id:from,
          name:message.name || "کاربر",
          role:message.role || "student"
        }
      );

      /*
        Deterministic polite/impolite assignment.
        The lexicographically smaller ID is impolite.
      */
      const polite=
        String(state.user.id)>from;

      rtc.polite.set(from,polite);

      await createPeerConnection(
        from,
        true
      );

      return;
    }

    if(message.type==="offer"){

      const pc=
        await createPeerConnection(
          from,
          false
        );

      const polite=
        rtc.polite.get(from) ?? true;

      const offerCollision=
        message.description &&
        (
          pc.signalingState!=="stable" ||
          rtc.makingOffer.get(from)
        );

      rtc.ignoreOffer.set(
        from,
        !polite && offerCollision
      );

      if(rtc.ignoreOffer.get(from)){
        return;
      }

      if(offerCollision){

        if(pc.signalingState!=="stable"){

          try{

            await pc.setLocalDescription({
              type:"rollback"
            });

          }catch(error){
            console.warn("rollback",error);
          }

        }

      }

      await pc.setRemoteDescription(
        message.description
      );

      await flushPendingIce(from);

      const answer=
        await pc.createAnswer();

      await pc.setLocalDescription(answer);

      await sendRTC({
        type:"answer",
        from:state.user.id,
        to:from,
        description:pc.localDescription
      });

      return;
    }

    if(message.type==="answer"){

      const pc=rtc.peers.get(from);

      if(!pc)return;

      await pc.setRemoteDescription(
        message.description
      );

      await flushPendingIce(from);

      return;
    }

    if(message.type==="ice"){

      const candidate=message.candidate;

      if(!candidate)return;

      const pc=rtc.peers.get(from);

      if(!pc){
        await createPeerConnection(
          from,
          false
        );
      }

      const current=rtc.peers.get(from);

      if(!current)return;

      if(current.remoteDescription){

        try{

          await current.addIceCandidate(
            candidate
          );

        }catch(error){

          if(!rtc.ignoreOffer.get(from)){
            console.warn(
              "ICE candidate error",
              error
            );
          }

        }

      }else{

        if(!rtc.pendingIce.has(from)){
          rtc.pendingIce.set(from,[]);
        }

        rtc.pendingIce
          .get(from)
          .push(candidate);
      }

      return;
    }

    if(message.type==="leave"){

      cleanupPeer(from);

      return;
    }

    if(message.type==="peer-state"){

      rtc.memberState.set(
        from,
        {
          ...(rtc.memberState.get(from)||{}),
          ...message.state
        }
      );

      renderMembers();

    }

  }catch(error){

    console.warn(
      "RTC signaling error:",
      error
    );

  }
}

/* =========================================================
   PEER CONNECTION
========================================================= */

async function createPeerConnection(
  peerId,
  initiator
){

  peerId=String(peerId);

  if(rtc.peers.has(peerId)){
    return rtc.peers.get(peerId);
  }

  const pc=new RTCPeerConnection({

    iceServers:[
      {
        urls:[
          "stun:stun.l.google.com:19302",
          "stun:stun1.l.google.com:19302"
        ]
      }

      /*
        TURN can be added here later.

        {
          urls:"turn:YOUR_TURN_SERVER",
          username:"YOUR_USERNAME",
          credential:"YOUR_CREDENTIAL"
        }
      */
    ],

    iceCandidatePoolSize:10
  });

  rtc.peers.set(peerId,pc);

  rtc.makingOffer.set(peerId,false);
  rtc.ignoreOffer.set(peerId,false);

  if(!rtc.polite.has(peerId)){

    rtc.polite.set(
      peerId,
      String(state.user.id)>peerId
    );

  }

  if(rtc.localStream){

    rtc.localStream
      .getTracks()
      .forEach(track=>{

        try{
          pc.addTrack(
            track,
            rtc.localStream
          );
        }catch(error){
          console.warn("addTrack",error);
        }

      });

  }

  pc.onicecandidate=event=>{

    if(event.candidate){

      sendRTC({
        type:"ice",
        from:state.user.id,
        to:peerId,
        candidate:event.candidate
      });

    }

  };

  pc.ontrack=event=>{

    let stream=
      rtc.remoteStreams.get(peerId);

    if(!stream){

      stream=new MediaStream();

      rtc.remoteStreams.set(
        peerId,
        stream
      );

    }

    const track=event.track;

    if(
      !stream.getTracks()
        .some(existing=>existing.id===track.id)
    ){

      stream.addTrack(track);

    }

    renderRemoteVideo(
      peerId,
      stream
    );

  };

  pc.onconnectionstatechange=()=>{

    const connectionState=
      pc.connectionState;

    if(
      connectionState==="connected"
    ){

      clearReconnectTimer(peerId);

      setConnectionStatus("Connected");

    }

    if(
      connectionState==="disconnected"
    ){

      setConnectionStatus(
        "Reconnecting"
      );

      scheduleReconnect(peerId);

    }

    if(
      connectionState==="failed"
    ){

      setConnectionStatus(
        "Reconnecting"
      );

      scheduleReconnect(peerId);

    }

    if(
      connectionState==="closed"
    ){

      cleanupPeer(peerId);

    }

  };

  pc.oniceconnectionstatechange=()=>{

    if(
      pc.iceConnectionState==="failed"
    ){

      scheduleReconnect(peerId);

    }

  };

  pc.onnegotiationneeded=async()=>{

    if(!initiator && !rtc.polite.get(peerId)){
      return;
    }

    try{

      rtc.makingOffer.set(
        peerId,
        true
      );

      await pc.setLocalDescription();

      await sendRTC({
        type:"offer",
        from:state.user.id,
        to:peerId,
        description:pc.localDescription
      });

    }catch(error){

      console.warn(
        "negotiation",
        error
      );

    }finally{

      rtc.makingOffer.set(
        peerId,
        false
      );

    }

  };

  return pc;
}

/* =========================================================
   ICE QUEUE
========================================================= */

async function flushPendingIce(peerId){

  const pc=rtc.peers.get(peerId);

  if(!pc)return;

  const queue=
    rtc.pendingIce.get(peerId)||[];

  rtc.pendingIce.delete(peerId);

  for(const candidate of queue){

    try{

      await pc.addIceCandidate(candidate);

    }catch(error){

      console.warn(
        "queued ICE error",
        error
      );

    }

  }
}

/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect(peerId){

  peerId=String(peerId);

  if(rtc.reconnectTimers.has(peerId)){
    return;
  }

  const timer=setTimeout(async()=>{

    rtc.reconnectTimers.delete(peerId);

    const pc=rtc.peers.get(peerId);

    if(!pc)return;

    try{

      if(
        pc.connectionState==="connected"
      ){
        return;
      }

      if(
        pc.signalingState!=="stable"
      ){
        return;
      }

      const polite=
        rtc.polite.get(peerId);

      if(!polite){

        await pc.setLocalDescription(
          await pc.createOffer({
            iceRestart:true
          })
        );

        await sendRTC({
          type:"offer",
          from:state.user.id,
          to:peerId,
          description:pc.localDescription
        });

      }else{

        /*
          The polite side waits for the other peer.
          If no recovery occurs, the existing connection
          remains alive and another join/offer can restore it.
        */

        await sendRTC({
          type:"peer-state",
          from:state.user.id,
          to:peerId,
          state:{
            reconnect:true
          }
        });

      }

    }catch(error){

      console.warn(
        "ICE restart",
        error
      );

    }

  },4000);

  rtc.reconnectTimers.set(
    peerId,
    timer
  );
}

function clearReconnectTimer(peerId){

  const timer=
    rtc.reconnectTimers.get(peerId);

  if(timer){

    clearTimeout(timer);

    rtc.reconnectTimers.delete(
      peerId
    );

  }
}

/* =========================================================
   REMOTE VIDEO
========================================================= */

function renderRemoteVideo(
  peerId,
  stream
){

  const container=$("#remoteVideos");

  if(!container)return;

  let tile=
    document.querySelector(
      `[data-peer="${CSS.escape(String(peerId))}"]`
    );

  if(!tile){

    tile=document.createElement("div");

    tile.className="video-tile";

    tile.dataset.peer=String(peerId);

    const video=document.createElement("video");

    video.autoplay=true;
    video.playsInline=true;

    const name=document.createElement("span");

    name.className="video-name";

    const user=
      rtc.peerUsers.get(String(peerId));

    name.textContent=
      user?.name || "کاربر";

    tile.appendChild(video);
    tile.appendChild(name);

    container.appendChild(tile);

  }

  const video=tile.querySelector("video");

  if(video.srcObject!==stream){

    video.srcObject=stream;

  }

  video.autoplay=true;
  video.playsInline=true;

  video.play().catch(()=>{
    /*
      Mobile autoplay may require a user gesture.
      The media element remains available and will play
      after a permitted interaction.
    */
  });
}

/* =========================================================
   PEER CLEANUP
========================================================= */

function cleanupPeer(peerId){

  peerId=String(peerId);

  clearReconnectTimer(peerId);

  const pc=rtc.peers.get(peerId);

  if(pc){

    try{
      pc.ontrack=null;
      pc.onicecandidate=null;
      pc.onnegotiationneeded=null;
      pc.close();
    }catch{}

  }

  rtc.peers.delete(peerId);
  rtc.peerUsers.delete(peerId);
  rtc.polite.delete(peerId);
  rtc.makingOffer.delete(peerId);
  rtc.ignoreOffer.delete(peerId);
  rtc.pendingIce.delete(peerId);
  rtc.remoteStreams.delete(peerId);

  const tile=
    document.querySelector(
      `[data-peer="${CSS.escape(peerId)}"]`
    );

  tile?.remove();

  renderMembers();
}

/* =========================================================
   MEMBER SIGNAL
========================================================= */

function handleMemberSignal(message){

  if(
    !message ||
    String(message.class_id)!==
      String(state.classId)
  ){
    return;
  }

  if(
    String(message.from)===
      String(state.user.id)
  ){
    return;
  }

  if(message.state){

    rtc.memberState.set(
      String(message.from),
      message.state
    );

    renderMembers();

  }
}

/* =========================================================
   MEMBERS UI
========================================================= */

function renderMembers(){

  const body=$("#sideBody");

  if(!body || state.side!=="members"){
    return;
  }

  const members=
    Array.from(
      rtc.memberState.values()
    );

  const me={
    user_id:state.user?.id,
    name:state.profile?.name || state.user?.name,
    role:state.profile?.role || state.user?.role,
    microphone:!!rtc.localAudioTrack?.enabled,
    camera:!!rtc.localVideoTrack?.enabled,
    online:true
  };

  const map=new Map();

  map.set(String(me.user_id),me);

  members.forEach(m=>{
    if(m.user_id){
      map.set(String(m.user_id),m);
    }
  });

  const list=Array.from(map.values());

  body.innerHTML=list.length
    ?
    list.map(member=>`

      <div class="member">

        <div class="member-avatar">
          ${esc(initials(member.name))}
        </div>

        <div class="member-info">

          <div class="member-name">
            ${esc(member.name || "کاربر")}
          </div>

          <div class="member-meta">
            ${roleText(member.role)}
          </div>

        </div>

        <div>
          ${member.microphone?"🎙":"🔇"}
          ${member.camera?"📷":"🚫"}
        </div>

      </div>

    `).join("")
    :
    `<p class="muted">عضوی پیدا نشد.</p>`;
}

/* =========================================================
   SIDE PANEL
========================================================= */

function toggleSidePanel(tab){

  const panel=$("#sidePanel");

  if(!panel)return;

  if(window.innerWidth<=899){

    if(
      panel.classList.contains("open") &&
      state.side===tab
    ){

      panel.classList.remove("open");

      return;

    }

    panel.classList.add("open");

  }

  showSideTab(tab);
}

function showSideTab(tab){

  state.side=tab;

  const panel=$("#sidePanel");

  if(panel && window.innerWidth<=899){
    panel.classList.add("open");
  }

  $("#chatTab")?.classList.toggle(
    "active",
    tab==="chat"
  );

  $("#membersTab")?.classList.toggle(
    "active",
    tab==="members"
  );

  const input=$("#chatInput");

  if(input){
    input.style.display=
      tab==="chat"?"flex":"none";
  }

  if(tab==="members"){
    renderMembers();
  }else{
    loadExistingMessages().catch(console.warn);
  }
}

async function sendChatMessage(){

  const input=$("#chatText");

  if(!input)return;

  const text=input.value.trim();

  if(!text)return;

  try{

    const result=await db
      .from("messages")
      .insert({

        user_id:state.user.id,

      })

      .single();

function appendChatMessage(message){

  if(!message)return;
  if(
    String(message.meeting_id)!==
    String(state.classId)
  )return;

  if(state.side!=="chat")return;

  const body=$("#sideBody");

    body.querySelector(
      `[data-message-id="${CSS.escape(String(message.id))}"]`
    )
  ){
    return;
  }

  const item=document.createElement("div");

  item.className="chat-message";

  item.dataset.messageId=
    String(message.id);

  const member=
    rtc.memberState.get(
      String(message.user_id)
    );

  const name=
    message.user_name ||
    member?.name ||
    (
      String(message.user_id)===
      String(state.user.id)
      ?state.profile?.name
      :"کاربر"
    );

  item.innerHTML=`

    <b>${esc(name)}</b>

    <span>${esc(message.content || "")}</span>

    <small>
      ${formatDate(message.created_at)}
    </small>

  `;

  body.appendChild(item);

  body.scrollTop=body.scrollHeight;
}

function handleRealtimeChat(message){

  if(!message)return;

  appendChatMessage(message);

}

/* =========================================================
   WHITEBOARD SETUP
========================================================= */

function setupBoard(){

  board.canvas=$("#boardCanvas");

  if(!board.canvas)return;

  board.ctx=
    board.canvas.getContext("2d");

  board.canEdit=isTeacher();

  $("#boardPermission").textContent=
    board.canEdit
    ?"ویرایش برای شما فعال است"
    :"فقط مشاهده";

  const wrap=$("#boardCanvasWrap");

  const width=
    Math.max(
      1200,
      wrap.clientWidth
    );

  const height=
    Math.max(
      800,
      wrap.clientHeight
    );

  board.canvas.width=width;
  board.canvas.height=height;

  board.canvas.style.width=width+"px";
  board.canvas.style.height=height+"px";

  board.color=
    $("#boardColor").value;

  board.size=
    Number($("#boardSize").value);

  attachBoardEvents();

  updateBoardTools();

  redrawBoard();
}

function attachBoardEvents(){

  const canvas=board.canvas;

  if(!canvas)return;

  canvas.onpointerdown=null;
  canvas.onpointermove=null;
  canvas.onpointerup=null;
  canvas.onpointercancel=null;

  canvas.onpointerdown=event=>{
    boardPointerDown(event);
  };

  canvas.onpointermove=event=>{
    boardPointerMove(event);
  };

  canvas.onpointerup=event=>{
    boardPointerUp(event);
  };

  canvas.onpointercancel=event=>{
    boardPointerUp(event);
  };
}

function boardPoint(event){

  const rect=
    board.canvas.getBoundingClientRect();

  return {
    x:event.clientX-rect.left,
    y:event.clientY-rect.top
  };
}

/* =========================================================
   WHITEBOARD TOOLS
========================================================= */

function setBoardTool(tool){

  if(!board.canEdit && tool!=="move"){
    board.tool=tool;
    updateBoardTools();
    return;
  }

  board.tool=tool;

  updateBoardTools();

}

function updateBoardTools(){

  [
    "pen",
    "eraser",
    "line",
    "rectangle",
    "circle",
    "text",
    "move"
  ].forEach(tool=>{

    document
      .getElementById(
        "tool-"+tool
      )
      ?.classList.toggle(
        "active",
        board.tool===tool
      );

  });

}

$("#boardColor")?.addEventListener(
  "change",
  event=>{
    board.color=event.target.value;
  }
);

$("#boardSize")?.addEventListener(
  "change",
  event=>{
    board.size=Number(event.target.value);
  }
);

/* =========================================================
   WHITEBOARD DRAW
========================================================= */

function boardPointerDown(event){

  if(!board.canvas)return;

  const point=boardPoint(event);

  if(!board.canEdit){

    if(board.tool==="text"){
      return;
    }

    return;
  }

  board.canvas.setPointerCapture(
    event.pointerId
  );

  if(board.tool==="text"){

    openTextEditor(
      point.x,
      point.y,
      null
    );

    return;
  }

  if(board.tool==="move"){

    const hit=findBoardObjectAt(
      point.x,
      point.y
    );

    if(hit){

      board.selectedId=hit.id;

      board.drawing=true;

      board.startX=point.x;
      board.startY=point.y;

      board.current={
        ...hit
      };

    }

    return;
  }

  board.drawing=true;

  board.startX=point.x;
  board.startY=point.y;

  if(
    board.tool==="pen" ||
    board.tool==="eraser"
  ){

    const object={
      id:crypto.randomUUID(),
      meeting_id:state.classId,
      type:"path",
      points:[
        point
      ],
      color:
        board.tool==="eraser"
        ?"rgba(255,255,255,1)"
        :board.color,
      size:board.size,
      created_by:state.user.id
    };

    board.current=object;

    board.objects.set(
      object.id,
      object
    );

    redrawBoard();

  }

}

function boardPointerMove(event){

  if(!board.drawing)return;

  const point=boardPoint(event);

  if(board.tool==="pen" ||
     board.tool==="eraser"){

    board.current.points.push(point);

    redrawBoard();

    return;
  }

  if(
    board.tool==="line" ||
    board.tool==="rectangle" ||
    board.tool==="circle"
  ){

    board.current={
      id:board.current?.id ||
        crypto.randomUUID(),
      meeting_id:state.classId,
      type:board.tool,
      x:board.startX,
      y:board.startY,
      x2:point.x,
      y2:point.y,
      color:board.color,
      size:board.size,
      created_by:state.user.id
    };

    redrawBoard();

    return;
  }

  if(board.tool==="move"){

    if(!board.current)return;

    const dx=
      point.x-board.startX;

    const dy=
      point.y-board.startY;

    const moved={
      ...board.current
    };

    moveObjectData(
      moved,
      dx,
      dy
    );

    board.current=moved;

    redrawBoard();

  }

}

async function boardPointerUp(event){

  if(!board.drawing)return;

  board.drawing=false;

  if(
    board.tool==="pen" ||
    board.tool==="eraser" ||
    board.tool==="line" ||
    board.tool==="rectangle" ||
    board.tool==="circle"
  ){

    if(board.current){

      board.objects.set(
        board.current.id,
        board.current
      );

      pushBoardObject(
        board.current
      );

    }

  }

  if(board.tool==="move"){

    if(board.current){

      board.objects.set(
        board.current.id,
        board.current
      );

      updateBoardObject(
        board.current
      );

    }

  }

  board.current=null;

  redrawBoard();

}

function cancelBoardText(){

async function saveBoardText(){

  if(!board.canEdit)return;

  const input=$("#textEditorInput");

  if(!input)return;

  const text=input.value;

  if(!text.trim()){

    hideTextEditor();

      );

      size:Math.max(16,board.size*6),
      created_by:state.user.id
    };

      object.id,

    );

    await pushBoardObject(
      object
    );

  }

  hideTextEditor();

  redrawBoard();

/* =========================================================
   BOARD OBJECT HIT TEST
========================================================= */

function findBoardObjectAt(x,y){

  const objects=
    Array.from(
      board.objects.values()
    ).reverse();

  for(const object of objects){

    if(object.type==="text"){

      const size=
        Number(object.size)||18;

      const width=
        board.ctx.measureText(
          object.text||""
        ).width;

      if(
        x>=object.x &&
        x<=object.x+Math.max(width,30) &&
        y>=object.y-size &&
        y<=object.y+10
      ){
        return object;
      }

    }

    if(
      object.type==="rectangle" ||
      object.type==="circle"
    ){

      const minX=
        Math.min(object.x,object.x2);

      const maxX=
        Math.max(object.x,object.x2);

      const minY=
        Math.min(object.y,object.y2);

      const maxY=
        Math.max(object.y,object.y2);

      if(
        x>=minX &&
        x<=maxX &&
        y>=minY &&
        y<=maxY
      ){
        return object;
      }

    }

    if(object.type==="line"){

      const distance=
        pointLineDistance(
          x,
          y,
          object.x,
          object.y,
          object.x2,
          object.y2
        );

      if(distance<=10){
        return object;
      }

    }

    if(object.type==="path"){

      for(const point of object.points||[]){

        if(
          Math.hypot(
            point.x-x,
            point.y-y
          )<=12
        ){
          return object;
        }

      }

    }

  }

  return null;
}

function pointLineDistance(
  px,py,
  x1,y1,
  x2,y2
){

  const dx=x2-x1;
  const dy=y2-y1;

  if(dx===0 && dy===0){
    return Math.hypot(
      px-x1,
      py-y1
    );
  }

  const t=
    ((px-x1)*dx+(py-y1)*dy)/
    (dx*dx+dy*dy);

  const clamped=
    Math.max(0,Math.min(1,t));

  const x=x1+clamped*dx;
  const y=y1+clamped*dy;

  return Math.hypot(
    px-x,
    py-y
  );
}

/* =========================================================
   MOVE OBJECT
========================================================= */

function moveObjectData(
  object,
  dx,
  dy
){

  if(object.type==="text"){

    object.x+=dx;
    object.y+=dy;

  }else if(
    object.type==="line" ||
    object.type==="rectangle" ||
    object.type==="circle"
  ){

    object.x+=dx;
    object.y+=dy;
    object.x2+=dx;
    object.y2+=dy;

  }else if(object.type==="path"){

    object.points=
      object.points.map(point=>({
        x:point.x+dx,
        y:point.y+dy
      }));

  }

}

/* =========================================================
   WHITEBOARD DRAW RENDER
========================================================= */

function redrawBoard(){

  const canvas=board.canvas;

  const ctx=board.ctx;

  if(!canvas || !ctx)return;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle="#fff";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const objects=
    Array.from(
      board.objects.values()
    );

  if(
    board.current &&
    !objects.some(
      x=>x.id===board.current.id
    )
  ){
    objects.push(board.current);
  }

  objects.forEach(
    drawBoardObject
  );

}

function drawBoardObject(object){

  const ctx=board.ctx;

  if(!object)return;

  ctx.save();

  ctx.lineWidth=
    Number(object.size)||3;

  ctx.lineCap="round";
  ctx.lineJoin="round";

  if(object.type==="path"){

    const points=object.points||[];

    if(points.length){

      ctx.strokeStyle=
        object.color || "#111";

      ctx.beginPath();

      ctx.moveTo(
        points[0].x,
        points[0].y
      );

      for(
        let i=1;
        i<points.length;
        i++
      ){

        ctx.lineTo(
          points[i].x,
          points[i].y
        );

      }

      ctx.stroke();

    }

  }

  if(object.type==="line"){

    ctx.strokeStyle=
      object.color || "#111";

    ctx.beginPath();

    ctx.moveTo(
      object.x,
      object.y
    );

    ctx.lineTo(
      object.x2,
      object.y2
    );

    ctx.stroke();

  }

  if(object.type==="rectangle"){

    ctx.strokeStyle=
      object.color || "#111";

    ctx.strokeRect(
      object.x,
      object.y,
      object.x2-object.x,
      object.y2-object.y
    );

  }

  if(object.type==="circle"){

    ctx.strokeStyle=
      object.color || "#111";

    const radius=
      Math.hypot(
        object.x2-object.x,
        object.y2-object.y
      );

    ctx.beginPath();

    ctx.arc(
      object.x,
      object.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }

  if(object.type==="text"){

    ctx.fillStyle=
      object.color || "#111";

    ctx.font=
      `${Number(object.size)||18}px system-ui,Tahoma,Arial`;

    ctx.textBaseline="alphabetic";

    const lines=
      String(object.text||"").split("\n");

    const lineHeight=
      (Number(object.size)||18)*1.35;

    lines.forEach(
      (line,index)=>{

        ctx.fillText(
          line,
          object.x,
          object.y+
            index*lineHeight
        );

      }
    );

  }

  ctx.restore();

}

/* =========================================================
   BOARD DATABASE
========================================================= */

function boardPayload(object){

  return {
    id:object.id,
    meeting_id:state.classId,
    type:object.type,
    data:{
      x:object.x,
      y:object.y,
      x2:object.x2,
      y2:object.y2,
      points:object.points,
      text:object.text,
      color:object.color,
      size:object.size
    },
    created_by:state.user.id
  };
}

function normalizeBoardRow(row){

  if(!row)return null;

  const data=
    row.data || {};

  return {
    id:String(row.id),
    meeting_id:row.meeting_id,
    type:row.type,
    x:data.x,
    y:data.y,
    x2:data.x2,
    y2:data.y2,
    points:data.points || [],
    text:data.text,
    color:data.color,
    size:data.size,
    created_by:row.created_by
  };
}

async function pushBoardObject(object){

  if(!board.canEdit)return;

  const payload=
    boardPayload(object);

  const result=
    await db
      .from("whiteboard_objects")
      .upsert(
        payload,
        {
          onConflict:"id"
        }
      )
      .select()
      .single();

  if(result.error){

    console.warn(
      "board insert",
      result.error
    );

    /*
      Realtime broadcast is still sent so other clients
      can see the operation when database RLS is restrictive.
    */

  }else{

    receiveBoardDatabaseObject(
      result.data
    );

  }

  await sendBoardEvent({
    operation:"upsert",
    object
  });

}

async function updateBoardObject(object){

  if(!board.canEdit)return;

  const payload=
    boardPayload(object);

  const result=
    await db
      .from("whiteboard_objects")
      .update(payload)
      .eq("id",object.id)
      .eq("meeting_id",state.classId)
      .select()
      .single();

  if(result.error){

    console.warn(
      "board update",
      result.error
    );

  }else{

    receiveBoardDatabaseObject(
      result.data
    );

  }

  await sendBoardEvent({
    operation:"update",
    object
  });
}

function receiveBoardDatabaseObject(row){

  const object=
    normalizeBoardRow(row);

  if(!object)return;

  board.objects.set(
    String(object.id),
    object
  );

  redrawBoard();

}

async function sendBoardEvent(event){

  if(!rtc.signalChannel)return;

  try{

    await rtc.signalChannel.send({
      type:"broadcast",
      event:"board",
      payload:{
        class_id:String(state.classId),
        from:String(state.user.id),
        ...event
      }
    });

  }catch(error){

    console.warn(
      "board realtime",
      error
    );

  }
}

function handleBoardRealtime(message){

  if(!message)return;

  if(
    String(message.class_id)!==
    String(state.classId)
  ){
    return;
  }

  if(
    String(message.from)===
    String(state.user.id)
  ){
    return;
  }

  if(message.object){

    board.objects.set(
      String(message.object.id),
      message.object
    );

    redrawBoard();

  }

}

/* =========================================================
   BOARD UNDO / REDO / CLEAR
========================================================= */

async function boardUndo(){

  if(!board.canEdit)return;

  const objects=
    Array.from(
      board.objects.values()
    );

  if(!objects.length)return;

  const last=objects[objects.length-1];

  board.undo.push(last);

  board.objects.delete(
    String(last.id)
  );

  await db
    .from("whiteboard_objects")
    .delete()
    .eq("id",last.id)
    .eq("meeting_id",state.classId);

  await sendBoardEvent({
    operation:"delete",
    object:{
      id:last.id
    }
  });

  redrawBoard();
}

async function boardRedo(){

  if(!board.canEdit)return;

  const object=
    board.redo.pop();

  if(!object)return;

  board.objects.set(
    String(object.id),
    object
  );

  await pushBoardObject(
    object
  );

  redrawBoard();
}

async function clearBoard(){

  if(!board.canEdit)return;

  if(!confirm("کل تخته پاک شود؟")){
    return;
  }

  const result=
    await db
      .from("whiteboard_objects")
      .delete()
      .eq("meeting_id",state.classId);

  if(result.error){

    showError(result.error);

    return;
  }

  board.objects.clear();

  await sendBoardEvent({
    operation:"clear"
  });

  redrawBoard();

}

/* =========================================================
   RECORDING
========================================================= */

async function startLocalRecording(){

  if(
    !navigator.mediaDevices?.getDisplayMedia
  ){

    toast(
      "مرورگر شما ضبط صفحه را پشتیبانی نمی‌کند.",
      "error"
    );

    return;
  }

  let displayStream=null;

  try{

    displayStream=
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:true
      });

    let tracks=[
      ...displayStream.getVideoTracks(),
      ...displayStream.getAudioTracks()
    ];

    /*
      If display audio is unavailable but the local microphone
      is available, add the microphone to the recording stream.
    */

    if(
      rtc.localAudioTrack &&
      !displayStream.getAudioTracks().length
    ){

      tracks.push(
        rtc.localAudioTrack.clone()
      );

    }

    const recordingStream=
      new MediaStream(tracks);

    const mimeCandidates=[
      "video/webm;codecs=vp9,opus",
      "video/webm;codecs=vp8,opus",
      "video/webm"
    ];

    const mimeType=
      mimeCandidates.find(
        type=>
          MediaRecorder.isTypeSupported(type)
      );

    if(!mimeType){

      throw new Error(
        "فرمت ضبط ویدیو توسط مرورگر پشتیبانی نمی‌شود."
      );

    }

    const chunks=[];

    const recorder=
      new MediaRecorder(
        recordingStream,
        {mimeType}
      );

    recorder.ondataavailable=event=>{

      if(event.data?.size){
        chunks.push(event.data);
      }

    };

    recorder.onstop=()=>{

      const blob=
        new Blob(
          chunks,
          {type:mimeType}
        );

      const url=
        URL.createObjectURL(blob);

      const a=
        document.createElement("a");

      a.href=url;

      a.download=
        `zaban-shirin-${Date.now()}.webm`;

      a.click();

      setTimeout(()=>{
        URL.revokeObjectURL(url);
      },1000);

      recordingStream
        .getTracks()
        .forEach(track=>{
          if(
            track!==rtc.localAudioTrack
          ){
            track.stop();
          }
        });

      toast(
        "ضبط محلی آماده شد."
      );

    };

    recorder.onerror=event=>{

      console.error(
        "MediaRecorder",
        event
      );

      toast(
        "خطا هنگام ضبط.",
        "error"
      );

    };

    recorder.start(1000);

    displayStream
      .getVideoTracks()[0]
      ?.addEventListener(
        "ended",
        ()=>{
          if(
            recorder.state!=="inactive"
          ){
            recorder.stop();
          }
        }
      );

    toast(
      "ضبط محلی شروع شد. برای پایان اشتراک‌گذاری صفحه را متوقف کنید."
    );

  }catch(error){

    displayStream
      ?.getTracks()
      .forEach(
        track=>track.stop()
      );

    if(error.name==="NotAllowedError"){

      toast(
        "ضبط لغو شد.",
        "error"
      );

      return;
    }

    showError(error);

  }

}

/* =========================================================
   CLASSROOM LEAVE / CLEANUP
========================================================= */

async function announceLeave(){

  await sendRTC({
    type:"leave",
    from:state.user.id
  });

}

async function leaveClassroom(){

  if(rtc.destroyed){
    return;
  }

  rtc.destroyed=true;

  try{
    await announceLeave();
  }catch{}

  if(rtc.presenceChannel){

    try{
      await rtc.presenceChannel.untrack();
    }catch{}

  }

  /*
    Close every peer independently.
  */

  for(const [peerId,pc] of rtc.peers){

    clearReconnectTimer(peerId);

    try{
      pc.close();
    }catch{}

  }

  rtc.peers.clear();
  rtc.peerUsers.clear();
  rtc.polite.clear();
  rtc.makingOffer.clear();
  rtc.ignoreOffer.clear();
  rtc.pendingIce.clear();
  rtc.remoteStreams.clear();

  /*
    Stop only local media.
    Remote streams are never used to control local media.
  */

  if(rtc.localStream){

    rtc.localStream
      .getTracks()
      .forEach(track=>{
        try{
          track.stop();
        }catch{}
      });

  }

  if(rtc.screenTrack){

    try{
      rtc.screenTrack.stop();
    }catch{}

  }

  rtc.localStream=null;
  rtc.localVideoTrack=null;
  rtc.localAudioTrack=null;
  rtc.screenTrack=null;

  if(rtc.signalChannel){

    try{
      await db.removeChannel(
        rtc.signalChannel
      );
    }catch{}

  }

  if(rtc.presenceChannel){

    try{
      await db.removeChannel(
        rtc.presenceChannel
      );
    }catch{}

  }

  if(rtc.chatChannel){

    try{
      await db.removeChannel(
        rtc.chatChannel
      );
    }catch{}

  }

  if(rtc.boardChannel){

    try{
      await db.removeChannel(
        rtc.boardChannel
      );
    }catch{}

  }

  rtc.signalChannel=null;
  rtc.presenceChannel=null;
  rtc.chatChannel=null;
  rtc.boardChannel=null;

  rtc.memberState.clear();

  document
    .getElementById("classroom")
    ?.remove();

  document
    .getElementById("whiteboard")
    ?.remove();

  state.classId=null;
  state.classData=null;

  setPage("classes");
}

const leaveClass=leaveClassroom;

/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  try{

    if(state.classId){
      await leaveClassroom();
    }

  }catch{}

  localStorage.removeItem(
    "zaban_shirin_session"
  );

  state.user=null;
  state.profile=null;

  renderAuth();

}

/* =========================================================
   WINDOW CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    try{

      rtc.peers.forEach(
        pc=>{
          try{
            pc.close();
          }catch{}
        }
      );

      rtc.localStream
        ?.getTracks()
        .forEach(
          track=>track.stop()
        );

    }catch{}
  }
);

window.addEventListener(
  "pagehide",
  ()=>{
    try{

      rtc.peers.forEach(
        pc=>{
          try{
            pc.close();
          }catch{}
        }
      );

    }catch{}
  }
);

/* =========================================================
   GLOBAL ERROR HANDLING
========================================================= */

window.addEventListener(
  "error",
  event=>{
    console.error(
      "Global error:",
      event.error || event.message
    );
  }
);

window.addEventListener(
  "unhandledrejection",
  event=>{
    console.error(
      "Unhandled promise:",
      event.reason
    );
  }
);

/* =========================================================
   START
========================================================= */

boot();
