<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>English Class Online</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Tahoma,Arial,sans-serif;
    background:#0b1020;
    color:white;
}

button,input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#263b75,#0b1020 60%);
}

.loginBox{
    width:min(430px,100%);
    background:#151c31;
    border:1px solid #303b61;
    border-radius:24px;
    padding:28px;
    box-shadow:0 20px 60px #0008;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#9ba8c7;
    margin-bottom:25px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#b8c4df;
}

.field input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #39466d;
    background:#0d1427;
    color:white;
    outline:none;
}

.field input:focus{
    border-color:#657fff;
}

.primary{
    width:100%;
    padding:14px;
    border-radius:12px;
    background:#506dff;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.secondary{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:12px;
    background:#242d49;
    color:white;
}

.message{
    text-align:center;
    margin-top:12px;
    color:#ffb4b4;
}

/* ================= APP ================= */

#app{
    height:100vh;
    overflow:hidden;
}

.topbar{
    height:64px;
    background:#11182c;
    border-bottom:1px solid #293452;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.brand{
    font-weight:bold;
    font-size:18px;
}

.userInfo{
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#526dff;
    font-weight:bold;
}

.logout{
    background:#293452;
    color:white;
    padding:8px 12px;
    border-radius:10px;
}

/* ================= DASHBOARD ================= */

.dashboard{
    height:calc(100vh - 64px);
    overflow:auto;
    padding:18px;
}

.grid{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
}

.card{
    background:#151c31;
    border:1px solid #2d3858;
    border-radius:18px;
    padding:18px;
}

.card h2{
    margin-top:0;
}

.item{
    background:#0d1427;
    border:1px solid #2c3756;
    border-radius:14px;
    padding:14px;
    margin-top:10px;
}

.itemTitle{
    font-weight:bold;
    margin-bottom:6px;
}

.itemButtons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.smallBtn{
    padding:9px 12px;
    border-radius:9px;
    background:#293452;
    color:white;
}

.green{
    background:#168b68;
}

.red{
    background:#c53c50;
}

.blue{
    background:#4d68ef;
}

/* ================= MEETING ================= */

#meeting{
    position:fixed;
    inset:0;
    background:#070b15;
    z-index:1000;
    display:flex;
    flex-direction:column;
}

.meetingHeader{
    min-height:58px;
    background:#11182b;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    border-bottom:1px solid #27314d;
}

.meetingTitle{
    font-weight:bold;
}

.meetingPeople{
    color:#aeb9d3;
    font-size:13px;
}

.meetingMain{
    flex:1;
    min-height:0;
    display:flex;
}

.videoArea{
    flex:1;
    min-width:0;
    padding:10px;
    overflow:auto;
}

.videoGrid{
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:10px;
    align-content:center;
}

.videoBox{
    position:relative;
    background:#131a2b;
    border:1px solid #2b3754;
    border-radius:16px;
    overflow:hidden;
    min-height:180px;
    aspect-ratio:16/10;
}

.videoBox video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#090d17;
}

.videoName{
    position:absolute;
    right:8px;
    bottom:8px;
    background:#000b;
    padding:6px 9px;
    border-radius:8px;
    font-size:12px;
}

.videoStatus{
    position:absolute;
    left:8px;
    bottom:8px;
    background:#000b;
    padding:5px 8px;
    border-radius:8px;
    font-size:12px;
}

.localMirror video{
    transform:none;
}

/* ================= CHAT ================= */

.meetingChat{
    width:320px;
    background:#11182b;
    border-right:1px solid #293452;
    display:flex;
    flex-direction:column;
}

.chatHeader{
    height:52px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    border-bottom:1px solid #293452;
}

.chatMessages{
    flex:1;
    overflow:auto;
    padding:12px;
}

.chatMsg{
    background:#202a45;
    border-radius:12px;
    padding:9px;
    margin-bottom:8px;
}

.chatMsgName{
    font-size:11px;
    color:#9eafff;
    margin-bottom:4px;
}

.chatMsgText{
    word-break:break-word;
}

.chatInput{
    display:flex;
    gap:7px;
    padding:10px;
    border-top:1px solid #293452;
}

.chatInput input{
    flex:1;
    min-width:0;
    background:#0b1120;
    border:1px solid #34405f;
    color:white;
    padding:10px;
    border-radius:10px;
}

.chatInput button{
    background:#526dff;
    color:white;
    border-radius:10px;
    padding:0 14px;
}

/* ================= CONTROLS ================= */

.controls{
    min-height:74px;
    background:#11182b;
    border-top:1px solid #293452;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:10px;
    flex-wrap:wrap;
}

.control{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#27314b;
    color:white;
    font-size:19px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.control span{
    display:none;
}

.control.active{
    background:#536dff;
}

.control.danger{
    background:#d74357;
    width:auto;
    padding:0 18px;
    border-radius:24px;
}

.control.recording{
    background:#c52d43;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    50%{opacity:.55}
}

/* ================= RECORD ================= */

.recordInfo{
    position:absolute;
    top:70px;
    left:12px;
    background:#b91f35;
    border-radius:9px;
    padding:7px 11px;
    font-size:12px;
    z-index:20;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:#000b;
    z-index:3000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modalBox{
    width:min(430px,100%);
    background:#171e33;
    border:1px solid #354161;
    border-radius:18px;
    padding:20px;
}

.modalBox h3{
    margin-top:0;
}

.modalButtons{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modalButtons button{
    flex:1;
    padding:11px;
    border-radius:10px;
    color:white;
    background:#293452;
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

    .meetingMain{
        position:relative;
    }

    .meetingChat{
        position:absolute;
        inset:0;
        width:100%;
        z-index:50;
    }

    .videoGrid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        align-content:start;
    }

    .videoBox{
        min-height:130px;
    }

    .meetingChat.hiddenChat{
        display:none;
    }

    .brand{
        font-size:15px;
    }
}

@media(min-width:701px){

    .meetingChat.hiddenChat{
        display:none;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginPage">

    <div class="loginBox">

        <div class="logo">🎓 English Class</div>

        <div class="subtitle">
            کلاس آنلاین
        </div>

        <div id="loginForm">

            <div class="field">
                <label>نام کاربری</label>
                <input id="loginUsername" autocomplete="username">
            </div>

            <div class="field">
                <label>رمز عبور</label>
                <input id="loginPassword" type="password">

        </div>


        <div id="registerForm" class="hidden">

            <div class="field">
                <label>نام</label>
                <input id="regName">
            </div>

            <div class="field">
                <label>نام کاربری</label>
                <input id="regUsername">

            <div class="field">
                <label>رمز عبور</label>

</section>


<!-- ================= APP ================= -->

<section id="app" class="hidden">

    <header class="topbar">

        <div class="brand">
            🎓 English Class
        </div>

        <div class="userInfo">

            <div id="userNameTop"></div>

            <div class="avatar" id="avatarTop">

            </div>

    <main class="dashboard">

            <div class="card">

                <button class="smallBtn blue"
                        onclick="createMeeting()">

            <div class="card">

<!-- ================= MEETING ================= -->

<section id="meeting" class="hidden">

    <header class="meetingHeader">

        <div>

            <div class="meetingTitle" id="meetingTitle">
                کلاس آنلاین
            </div>

            <div class="meetingPeople" id="meetingPeople">

            </div>

                onclick="leaveMeeting()">

         class="recordInfo hidden">

        <div class="videoArea">

            <div id="videoGrid"
                 class="videoGrid">

                <!-- videos inserted here -->

               class="meetingChat">

            <div class="chatHeader">

                <b>💬 چت کلاس</b>

                <button class="smallBtn"
                        onclick="toggleMeetingChat()">
                    ✕
                </button>

            </div>

            <div id="meetingMessages"
                 class="chatMessages">
            </div>

                <input id="meetingChatInput"
                       placeholder="پیام...">

                <button onclick="sendMeetingMessage()">
                    ارسال
                </button>

            </div>

        </aside>

    <footer class="controls">

        <button id="micBtn"
                class="control"
                onclick="toggleMic()">
            🎤
        </button>

                class="control"
                onclick="toggleCamera()">
            📷
        </button>

        <button id="screenBtn"
                class="control"
                onclick="toggleScreenShare()">
            🖥️
        </button>

        <button id="recordBtn"
                class="control"
                onclick="toggleRecording()">
            🔴
        </button>

        <button class="control"
                onclick="toggleMeetingChat()">
            💬
        </button>

        <button class="control"
                onclick="toggleFullscreen()">
            ⛶
        </button>

        <button class="control danger"
                onclick="leaveMeeting()">
            📞 خروج
        </button>

    </footer>

<!-- ================= MODAL ================= -->

<div id="modal"
     class="modal hidden">

    <div class="modalBox">

        <h3 id="modalTitle">
            پیام
        </h3>

        <div id="modalBody"></div>

        <div class="modalButtons">

            <button onclick="closeModal()">
                بستن
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://uqqumhmzndgyoigcqnti.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_R3LAX7EYbdYUwjQRgkmesA_QJ2ZmPtD";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentMeeting = null;

let currentGroup = null;

let localStream = null;

let screenStream = null;

let peers = {};

let presenceChannel = null;

let signalChannel = null;

let meetingChatChannel = null;

let groupChatChannel = null;

let recorder = null;

let recordedChunks = [];

let recordingStartedAt = null;

let recordingTimerInterval = null;

let isRecording = false;

let isScreenSharing = false;

let originalVideoTrack = null;

let remoteStreams = {};

let remoteVideoElements = {};


/* =========================================================
   WEBRTC CONFIG
========================================================= */

const rtcConfig = {

    iceServers: [

        {
            urls:"stun:stun.l.google.com:19302"
        },

        {
            urls:"stun:stun1.l.google.com:19302"
        },

        {
            urls:"stun:stun2.l.google.com:19302"
        }

    ]

};


/* =========================================================
   LOGIN UI
========================================================= */

function showRegister(){

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

    document
        .getElementById("loginMessage")
        .textContent="";
}


function showLogin(){

    document
        .getElementById("registerForm")
        .classList.add("hidden");

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("loginMessage")
        .textContent="";
}


/* =========================================================
   REGISTER
========================================================= */

async function registerUser(){

    const name =
        document.getElementById("regName").value.trim();

    const username =
        document.getElementById("regUsername").value.trim();

    const password =
        document.getElementById("regPassword").value;

    if(!name || !username || !password){

        showLoginMessage("همه قسمت‌ها را پر کن.");

        return;
    }


    const {data:existing,error:checkError} =
        await supabaseClient
            .from("users")
            .select("id")
            .eq("username",username)
            .maybeSingle();


    if(checkError){

        showLoginMessage(checkError.message);

        return;
    }


    if(existing){

        showLoginMessage("این نام کاربری قبلاً استفاده شده.");

        return;
    }


    const {data,error} =
        await supabaseClient
            .from("users")
            .insert({

                name:name,
                username:username,
                password:password

            })
            .select()
            .single();


    if(error){

        showLoginMessage(error.message);

        return;
    }


    currentUser=data;

    localStorage.setItem(
        "englishClassUser",
        JSON.stringify(currentUser)
    );

    openApp();
}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const username =
        document.getElementById("loginUsername").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if(!username || !password){

        showLoginMessage(
            "نام کاربری و رمز عبور را وارد کن."
        );

        return;
    }


    const {data,error} =
        await supabaseClient
            .from("users")
            .select("*")
            .eq("username",username)
            .eq("password",password)
            .maybeSingle();


    if(error){

        showLoginMessage(error.message);

        return;
    }


    if(!data){

        showLoginMessage(
            "نام کاربری یا رمز عبور اشتباه است."
        );

        return;
    }


    currentUser=data;

    localStorage.setItem(
        "englishClassUser",
        JSON.stringify(currentUser)
    );

    openApp();
}


function showLoginMessage(text){

    document
        .getElementById("loginMessage")
        .textContent=text;
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

    if(currentMeeting){

        await leaveMeeting();

    }

    currentUser=null;

    localStorage.removeItem(
        "englishClassUser"
    );

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("loginPage")
        .classList.remove("hidden");
}


/* =========================================================
   OPEN APP
========================================================= */

async function openApp(){

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");


    document
        .getElementById("userNameTop")
        .textContent=currentUser.name;


    document
        .getElementById("avatarTop")
        .textContent=
            currentUser.name
                .charAt(0)
                .toUpperCase();


    await loadGroups();

    await loadMeetings();

    await loadRecordings();
}


/* =========================================================
   LOAD SESSION
========================================================= */

window.addEventListener(
    "load",
    async()=>{

        const saved =
            localStorage.getItem(
                "englishClassUser"
            );

        if(saved){

            try{

                currentUser=
                    JSON.parse(saved);

                await openApp();

            }catch(e){

                localStorage.removeItem(
                    "englishClassUser"
                );

            }

        }

    }
);


/* =========================================================
   GROUPS
========================================================= */

async function loadGroups(){

    const list =
        document.getElementById("groupsList");

    list.innerHTML="در حال بارگذاری...";


    const {data,error} =
        await supabaseClient
            .from("groups")
            .select("*")
            .order("created_at",{ascending:false});


    if(error){

        list.innerHTML="خطا در دریافت گروه‌ها";

        return;
    }


    if(!data.length){

        list.innerHTML=
            "<p>هنوز گروهی ساخته نشده.</p>";

        return;
    }


    list.innerHTML="";


    data.forEach(group=>{

        const div=
            document.createElement("div");

        div.className="item";


        div.innerHTML=`

            <div class="itemTitle">
                👥 ${escapeHtml(group.name)}
            </div>

            <div>
                سازنده:
                ${escapeHtml(group.owner_name || "")}
            </div>

            <div class="itemButtons">

                <button class="smallBtn blue"
                    onclick="enterGroup(${group.id})">
                    ورود
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* =========================================================
   CREATE GROUP
========================================================= */

async function createGroup(){

    const name =
        prompt("نام گروه:");

    if(!name) return;


    const password =
        prompt(
            "رمز گروه (اختیاری):"
        );


    const {error} =
        await supabaseClient
            .from("groups")
            .insert({

                name:name,
                password:password || null,
                owner_id:currentUser.id,
                owner_name:currentUser.name

            });


    if(error){

        alert(error.message);

        return;
    }


    await loadGroups();
}


/* =========================================================
   ENTER GROUP
========================================================= */

async function enterGroup(id){

    const {data:group,error} =
        await supabaseClient
            .from("groups")
            .select("*")
            .eq("id",id)
            .single();


    if(error){

        alert(error.message);

        return;
    }


    if(group.password){

        const pass =
            prompt("رمز گروه را وارد کن:");

        if(pass!==group.password){

            alert("رمز اشتباه است.");

            return;
        }

    }


    currentGroup=group;


    startGroupChat(id);


    alert(
        "وارد گروه شدی. پیام گروه از طریق سرور همگام می‌شود."
    );
}


/* =========================================================
   GROUP CHAT
========================================================= */

function startGroupChat(groupId){

    if(groupChatChannel){

        supabaseClient.removeChannel(
            groupChatChannel
        );

    }


    groupChatChannel =
        supabaseClient
            .channel(
                "group-chat-"+groupId
            )
            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages",
                    filter:
                        "group_id=eq."+groupId
                },
                payload=>{

                    console.log(
                        "Group message",
                        payload.new
                    );

                }
            )

/* =========================================================
   WEBRTC REALTIME
========================================================= */

function setupMeetingRealtime(){

    const room =
        "meeting-"+currentMeeting.id;


    if(presenceChannel){

        supabaseClient.removeChannel(
            presenceChannel
        );

    }

    if(signalChannel){

        supabaseClient.removeChannel(
            signalChannel
        );

    }

    if(meetingChatChannel){

        supabaseClient.removeChannel(
            meetingChatChannel
        );

    }


    /*
      PRESENCE
    */

    presenceChannel =
        supabaseClient
            .channel(room+"-presence",{

                config:{
                    presence:{
                        key:String(currentUser.id)
                    }
                }

            });


    presenceChannel
        .on(
            "presence",
            {
                event:"sync"
            },
            async()=>{

                const state =
                    presenceChannel.presenceState();


                updatePeopleCount(state);


                for(const key in state){

                    if(
                        String(key)
                        !==
                        String(currentUser.id)
                    ){

                        const first =
                            state[key]?.[0];

                        if(first){

                            await ensurePeer(
                                String(key),
                                true
                            );

                        }

                    }

                }

            }
        )
        .on(
            "presence",
            {
                event:"join"
            },
            async payload=>{

                const key =
                    payload.key;


                if(
                    String(key)
                    !==
                    String(currentUser.id)
                ){

                    await ensurePeer(
                        String(key),
                        true
                    );

                }

            }
        )
        .on(
            "presence",
            {
                event:"leave"
            },
            payload=>{

                removePeer(
                    String(payload.key)
                );

            }
        )
        .subscribe(
            async status=>{

                if(status==="SUBSCRIBED"){

                    await presenceChannel.track({

                        user_id:
                            currentUser.id,

                        name:
                            currentUser.name

                    });

                }

            }
        );


    /*
      SIGNALING
    */

    signalChannel =
        supabaseClient
            .channel(room+"-signals");


    signalChannel
        .on(
            "broadcast",
            {
                event:"offer"
            },
            async payload=>{

                const data=payload.payload;

                if(
                    String(data.to)
                    !==
                    String(currentUser.id)
                )
                    return;


                await handleOffer(data);

            }
        )
        .on(
            "broadcast",
            {
                event:"answer"
            },
            async payload=>{

                const data=payload.payload;

                if(
                    String(data.to)
                    !==
                    String(currentUser.id)
                )
                    return;


                await handleAnswer(data);

            }
        )
        .on(
            "broadcast",
            {
                event:"ice"
            },
            async payload=>{

                const data=payload.payload;

                if(
                    String(data.to)
                    !==
                    String(currentUser.id)
                )
                    return;


                await handleIce(data);

            }
        )
        .subscribe();


    /*
       CHAT
    */

    meetingChatChannel =
        supabaseClient
            .channel(
                room+"-chat"
            );


    meetingChatChannel
        .on(
            "broadcast",
            {
                event:"chat"
            },
            payload=>{

                const msg=
                    payload.payload;


                if(
                    String(msg.user_id)
                    ===
                    String(currentUser.id)
                )
                    return;


                appendMeetingMessage(
                    msg.user_name,
                    msg.text
                );

            }
        )
        .subscribe();

}

/* =========================================================
   PEER
========================================================= */

async function ensurePeer(userId,createOffer){

    if(
        String(userId)
        ===
        String(currentUser.id)
    )
        return;


    if(!peers[userId]){

        createPeer(userId);

    }


    if(createOffer){

        const peer=peers[userId];

        /*
          جلوگیری از Offerهای اضافی
        */

        if(
            peer.signalingState
            ===
            "stable"
        ){

            await createOfferForUser(
                userId
            );

        }

    }

}


/* =========================================================
   CREATE PEER
========================================================= */

function createPeer(userId){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    peers[userId]=pc;


    /*
       مهم:
       Audio + Video Track هر دو
       به PeerConnection اضافه می‌شوند.
    */

    if(localStream){

        localStream
            .getTracks()
            .forEach(track=>{

                pc.addTrack(
                    track,
                    localStream
                );

            });

    }


    /*
       دریافت صدای طرف مقابل
    */

    pc.ontrack = event=>{

        console.log(
            "REMOTE TRACK:",
            userId,
            event.track.kind
        );


        let stream =
            remoteStreams[userId];


        if(!stream){

            stream =
                new MediaStream();

            remoteStreams[userId]=stream;

        }


        /*
           از اضافه کردن Track تکراری
           جلوگیری می‌کنیم.
        */

        if(
            !stream
                .getTracks()
                .some(
                    t=>t.id===event.track.id
                )
        ){

            stream.addTrack(
                event.track
            );

        }


        updateRemoteVideo(
            userId,
            stream
        );

    };


    /*
       ICE
    */

    pc.onicecandidate = async event=>{

        if(!event.candidate)
            return;


        await sendSignal(
            "ice",
            {
                to:userId,

                from:currentUser.id,

                candidate:
                    event.candidate
            }
        );

    };


    pc.onconnectionstatechange=()=>{

        console.log(
            "Peer state",
            userId,
            pc.connectionState
        );


        if(
            pc.connectionState
            ===
            "failed"
        ){

            removePeer(userId);

            setTimeout(
                ()=>ensurePeer(
                    userId,
                    true
                ),
                1500
            );

        }

    };


    pc.oniceconnectionstatechange=()=>{

        if(
            pc.iceConnectionState
            ===
            "failed"
        ){

            pc.restartIce();

        }

    };


    return pc;

}


/* =========================================================
   CREATE OFFER
========================================================= */

async function createOfferForUser(userId){

    const pc=peers[userId];

    if(!pc)
        return;


    try{

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        await sendSignal(
            "offer",
            {

                to:userId,

                from:currentUser.id,

                description:
                    pc.localDescription

            }
        );

    }catch(e){

        console.error(
            "offer error",
            e
        );

    }

}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(data){

    const userId=
        String(data.from);


    if(!peers[userId]){

        createPeer(userId);

    }


    const pc=
        peers[userId];


    try{

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                data.description
            )
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        await sendSignal(
            "answer",
            {

                to:userId,

                from:currentUser.id,

                description:
                    pc.localDescription

            }
        );


    }catch(e){

        console.error(
            "handle offer",
            e
        );

    }

}


/* =========================================================
   HANDLE ANSWER
========================================================= */

async function handleAnswer(data){

    const userId=
        String(data.from);


    const pc=
        peers[userId];


    if(!pc)
        return;


    try{

        if(
            pc.signalingState
            ===
            "have-local-offer"
        ){

            await pc.setRemoteDescription(
                new RTCSessionDescription(
                    data.description
                )
            );

        }

    }catch(e){

        console.error(
            "answer error",
            e
        );

    }

}


/* =========================================================
   ICE
========================================================= */

async function handleIce(data){

    const userId=
        String(data.from);


    const pc=
        peers[userId];


    if(!pc || !data.candidate)
        return;


    try{

        await pc.addIceCandidate(
            new RTCIceCandidate(
                data.candidate
            )
        );

    }catch(e){

        console.error(
            "ICE error",
            e
        );

    }

}

    await signalChannel.send({

        type:"broadcast",

        event:event,

        payload:payload

    });

}

        );

        document.getElementById(
            "remote-"+userId
        );


    if(!box){

        box =

            );

            "remote-"+userId;

        box.innerHTML=`

            <video

                autoplay
                playsinline
                controls="false">
            </video>

            <div
                class="videoName"
                id="name-${userId}">

            </div>

            <div
                class="videoStatus"
                id="status-${userId}">
                🎤
            </div>

        `;


        grid.appendChild(box);


        /*
           برای صدا:
           muted نباید باشد.
        */

        const video=
            box.querySelector("video");


        video.autoplay=true;

        video.playsInline=true;

        video.muted=false;


        remoteVideoElements[userId]=video;

    }


    const video =
        document.getElementById(
            "video-"+userId
        );


    if(!video)
        return;


    if(video.srcObject!==stream){

        video.srcObject=stream;

    }


    /*
       این قسمت مشکل اصلی صدای نسخه قبلی را
       حل می‌کند.
    */

    video.muted=false;

    video.volume=1.0;

    video.autoplay=true;

    video.playsInline=true;


    const playPromise=
        video.play();


    if(playPromise){

        playPromise.catch(
            error=>{

                console.warn(
                    "Autoplay blocked:",
                    error
                );


                /*
                   اگر مرورگر Autoplay را بست،
                   با اولین لمس صفحه دوباره play می‌کنیم.
                */

                const resume=()=>{

                    video.play()
                        .catch(()=>{});

                    document
                        .removeEventListener(
                            "click",
                            resume
                        );

                    document
                        .removeEventListener(
                            "touchstart",
                            resume
                        );

                };


                document
                    .addEventListener(
                        "click",
                        resume,
                        {once:true}
                    );

                document
                    .addEventListener(
                        "touchstart",
                        resume,
                        {once:true}
                    );

            }
        );

    }

}

/* =========================================================
   SCREEN SHARE
========================================================= */

async function toggleScreenShare(){

    if(isScreenSharing){

        await stopScreenShare();

        return;

    }


    if(!navigator.mediaDevices.getDisplayMedia){

        alert(
            "مرورگر این دستگاه از اشتراک صفحه پشتیبانی نمی‌کند."
        );

        return;
    }


    try{

        screenStream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video:true,

                    audio:true

                });


        const screenTrack=
            screenStream
                .getVideoTracks()[0];


        if(!localStream){

            return;

        }


        originalVideoTrack=
            localStream
                .getVideoTracks()[0];


        /*
          Track دوربین را با Screen Track
          در تمام PeerConnectionها عوض می‌کنیم.
        */

        for(
            const userId in peers
        ){

            const pc=
                peers[userId];


            const sender=
                pc
                    .getSenders()
                    .find(
                        s=>
                            s.track
                            &&
                            s.track.kind
                            ===
                            "video"
                    );


            if(sender){

                await sender.replaceTrack(
                    screenTrack
                );

            }

        }


        /*
          تصویر خودمان هم صفحه را نشان می‌دهد.
        */

        const localVideo=
            document.getElementById(
                "localVideo"
            );


        if(localVideo){

            const previewStream=
                new MediaStream();


            previewStream.addTrack(
                screenTrack
            );


            const audioTrack=
                localStream
                    .getAudioTracks()[0];


            if(audioTrack){

                previewStream.addTrack(
                    audioTrack
                );

            }


            localVideo.srcObject=
                previewStream;


            localVideo.muted=true;

            localVideo.play()
                .catch(()=>{});

        }


        isScreenSharing=true;


        const btn=
            document.getElementById(
                "screenBtn"
            );


        btn.classList.add("active");

        btn.textContent="⏹️";


        /*
          اگر کاربر خودش Stop را از پنجره
          اشتراک صفحه زد.
        */

        screenTrack.onended=()=>{

            stopScreenShare();

        };


    }catch(error){

        console.error(
            "screen share",
            error
        );

    }

}


/* =========================================================
   STOP SCREEN SHARE
========================================================= */

async function stopScreenShare(){

    if(!isScreenSharing)
        return;


    const cameraTrack=
        originalVideoTrack;


    for(
        const userId in peers
    ){

        const pc=
            peers[userId];


        const sender=
            pc
                .getSenders()
                .find(
                    s=>
                        s.track
                        &&
                        s.track.kind
                        ===
                        "video"
                );


        if(sender && cameraTrack){

            await sender.replaceTrack(
                cameraTrack
            );

        }

    }


    if(screenStream){

        screenStream
            .getTracks()
            .forEach(
                track=>{
                    track.stop();
                }
            );

    }


    screenStream=null;

    isScreenSharing=false;


    const localVideo=
        document.getElementById(
            "localVideo"
        );


    if(localVideo && localStream){

        localVideo.srcObject=
            localStream;

        localVideo.muted=true;

        localVideo.play()
            .catch(()=>{});

    }


    const btn=
        document.getElementById(
            "screenBtn"
        );


    btn.classList.remove("active");

    btn.textContent="🖥️";

}

function appendMeetingMessage(
    name,
    text
){

    const box=
        document.getElementById(
            "meetingMessages"
        );


    const div=
        document.createElement(
            "div"
        );


    div.className="chatMsg";


    div.innerHTML=`

        <div class="chatMsgName">
            ${escapeHtml(name)}
        </div>

        <div class="chatMsgText">
            ${escapeHtml(text)}
        </div>

    `;


    box.appendChild(div);


    box.scrollTop=
        box.scrollHeight;

}


/* =========================================================
   SEND MEETING MESSAGE
========================================================= */

async function sendMeetingMessage(){

    const input=
        document.getElementById(
            "meetingChatInput"
        );


    const text=
        input.value.trim();


    if(!text || !currentMeeting)
        return;


    input.value="";


    const msg={

        meeting_id:
            currentMeeting.id,

        user_id:
            currentUser.id,

        user_name:
            currentUser.name,

        text:text

    };


    const {error}=
        await supabaseClient
            .from("messages")
            .insert(msg);


    if(error){

        console.error(error);

        return;
    }


    /*
       خودمان را فوراً نمایش می‌دهیم.
    */

    appendMeetingMessage(
        currentUser.name,
        text
    );


    /*
       بقیه افراد
       Realtime دریافت می‌کنند.
    */

    if(meetingChatChannel){

        await meetingChatChannel.send({

            type:"broadcast",

            event:"chat",

            payload:msg

        });

    }

}


/* =========================================================
   CHAT ENTER
========================================================= */

document
    .getElementById(
        "meetingChatInput"
    )
    .addEventListener(
        "keydown",
        e=>{

            if(e.key==="Enter"){

                sendMeetingMessage();

            }

        }
    );

/* =========================================================
   RECORDING
========================================================= */

async function toggleRecording(){

    if(isRecording){

        stopRecording();

    }else{

        await startRecording();

    }

}


/*
   نسخه فعلی ضبط، Stream دستگاه کاربر را ضبط می‌کند.
   یعنی دوربین/میکروفون خودش.
*/

async function startRecording(){

    if(!localStream){

        alert(
            "دوربین یا میکروفون فعال نیست."
        );

        return;
    }


    recordedChunks=[];


    let recordStream=
        localStream;


    /*
       اگر Screen Share فعال باشد،
       تصویر صفحه را ضبط می‌کنیم.
    */

    if(
        isScreenSharing
        &&
        screenStream
    ){

        const combined=
            new MediaStream();


        screenStream
            .getVideoTracks()
            .forEach(
                track=>{
                    combined.addTrack(
                        track
                    );
                }
            );


        localStream
            .getAudioTracks()
            .forEach(
                track=>{
                    combined.addTrack(
                        track
                    );
                }
            );


        recordStream=combined;

    }


    let options={};


    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9,opus"
        )
    ){

        options={
            mimeType:
                "video/webm;codecs=vp9,opus"
        };

    }else if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp8,opus"
        )
    ){

        options={
            mimeType:
                "video/webm;codecs=vp8,opus"
        };

    }else{

        options={
            mimeType:"video/webm"
        };

    }


    try{

        recorder=
            new MediaRecorder(
                recordStream,
                options
            );

    }catch(e){

        alert(
            "مرورگر امکان ضبط این Stream را ندارد."
        );

        return;
    }


    recorder.ondataavailable=
        event=>{

            if(
                event.data
                &&
                event.data.size>0
            ){

                recordedChunks.push(
                    event.data
                );

            }

        };


    recorder.onstop=
        finishRecording;


    recorder.start(1000);


    isRecording=true;

    recordingStartedAt=
        Date.now();


    document
        .getElementById(
            "recordInfo"
        )
        .classList.remove(
            "hidden"
        );


    const btn=
        document.getElementById(
            "recordBtn"
        );


    btn.classList.add(
        "recording"
    );


    btn.textContent="⏹️";


    recordingTimerInterval=
        setInterval(
            updateRecordTimer,
            1000
        );

}


/* =========================================================
   RECORD TIMER
========================================================= */

function updateRecordTimer(){

    if(!recordingStartedAt)
        return;


    const seconds=
        Math.floor(
            (
                Date.now()
                -
                recordingStartedAt
            )/1000
        );


    const min=
        String(
            Math.floor(seconds/60)
        ).padStart(2,"0");


    const sec=
        String(
            seconds%60
        ).padStart(2,"0");


    document
        .getElementById(
            "recordTimer"
        )
        .textContent=
            min+":"+sec;

}


/* =========================================================
   STOP RECORD
========================================================= */

function stopRecording(){

    if(
        recorder
        &&
        recorder.state
        !==
        "inactive"
    ){

        recorder.stop();

    }

}


/* =========================================================
   FINISH RECORDING
========================================================= */

function finishRecording(){

    clearInterval(
        recordingTimerInterval
    );


    recordingTimerInterval=null;

    isRecording=false;


    const btn=
        document.getElementById(
            "recordBtn"
        );


    btn.classList.remove(
        "recording"
    );


    btn.textContent="🔴";


    document
        .getElementById(
            "recordInfo"
        )
        .classList.add(
            "hidden"
        );


    if(!recordedChunks.length){

        return;
    }


    const blob=
        new Blob(
            recordedChunks,
            {
                type:"video/webm"
            }
        );


    const url=
        URL.createObjectURL(
            blob
        );


    /*
       ذخیره مستقیم روی گوشی
    */

    const a=
        document.createElement(
            "a"
        );


    a.href=url;

    a.download=
        "English-Class-"+
        Date.now()+
        ".webm";


    a.textContent=
        "💾 ذخیره ضبط کلاس";


    a.style.display="none";


    document.body.appendChild(a);


    /*
       به جای دانلود اجباری،
       پنجره را باز می‌کنیم.
    */

    showRecordingModal(
        url,
        blob
    );

}

   RECORDING MODAL

/* =========================================================
   RECORDINGS FROM SUPABASE
========================================================= */

async function loadRecordings(){

    const box=
        document.getElementById(
            "recordingsList"
        );


    const {data,error} =
        await supabaseClient
            .from("recordings")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        box.textContent=
            "هنوز ضبطی ثبت نشده.";

        return;
    }


    if(!data.length){

        box.textContent=
            "هنوز ضبطی ثبت نشده.";

        return;
    }


    box.innerHTML="";


    data.forEach(rec=>{

        const div=
            document.createElement(
                "div"
            );


        div.className="item";


        div.innerHTML=`

            <div class="itemTitle">
                🎬 ${escapeHtml(rec.name)}
            </div>

            <div>
                ${escapeHtml(
                    rec.user_name || ""
                )}
            </div>

            ${
                rec.file_url
                ?
                `
                <div class="itemButtons">

                    <a
                        href="${escapeAttribute(rec.file_url)}"
                        target="_blank"
                        class="smallBtn blue">
                        ▶️ مشاهده
                    </a>

                </div>
                `
                :
                `
                <div>
                    فایل در سرور موجود نیست.
                </div>
                `
            }

        `;


        box.appendChild(div);

    });

}


/* =========================================================
   FULLSCREEN
========================================================= */

    const meeting=

            "meeting"
        );


    if(
        !document.fullscreenElement
    ){

        if(
            meeting.requestFullscreen
        ){

            meeting.requestFullscreen()
                .catch(()=>{});

        }

    }else{

        document.exitFullscreen()
            .catch(()=>{});

    }

}


/* =========================================================
   LEAVE MEETING
========================================================= */

async function leaveMeeting(){

    if(isRecording){

        stopRecording();

    }


    if(isScreenSharing){

        await stopScreenShare();

    }


    /*
       Peerها
    */

    Object.keys(peers)
        .forEach(
            userId=>{
                try{
                    peers[userId].close();
                }catch(e){}
            }
        );


    peers={};

    remoteStreams={};

    remoteVideoElements={};


    if(presenceChannel){

        try{

            await presenceChannel.untrack();

        }catch(e){}


        supabaseClient.removeChannel(
            presenceChannel
        );

        presenceChannel=null;

    }


    if(signalChannel){

        supabaseClient.removeChannel(
            signalChannel
        );

        signalChannel=null;

    }


    if(meetingChatChannel){

        supabaseClient.removeChannel(
            meetingChatChannel
        );

        meetingChatChannel=null;

    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track=>{
                    track.stop();
                }
            );

        localStream=null;

    }


    document
        .getElementById(
            "videoGrid"
        )
        .innerHTML="";


    document
        .getElementById(
            "meeting"
        )
        .classList.add(
            "hidden"
        );


    currentMeeting=null;

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

    document
        .getElementById(
            "modal"
        )
        .classList.add(

        );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

    return String(text ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(text){

    return String(text ?? "")
        .replace(
            /"/g,
            "&quot;"
        );

}


/* =========================================================
   PAGE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        if(localStream){

            localStream
                .getTracks()
                .forEach(
                    t=>t.stop()
                );

        }

    }
);
