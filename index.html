<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>زبان شیرین | کلاس آنلاین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f1220; --bg2:#161a2e; --card:#1c2140; --card2:#232a52;
  --primary:#7c5cff; --primary2:#5b8cff; --accent:#22d3ee; --success:#2ecc71; --danger:#ff5470;
  --text:#f2f3f8; --muted:#9aa0c3; --border:#2c3260; --radius:18px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Vazirmatn',Tahoma,sans-serif; background:radial-gradient(1200px 800px at 80% -10%, #26305f 0%, var(--bg) 55%);
  color:var(--text); direction:rtl; min-height:100vh; overflow-x:hidden;
}
button{font-family:inherit; cursor:pointer; border:none; outline:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
.hidden{display:none !important;}
.screen{min-height:100vh; display:flex; flex-direction:column;}
.center-screen{align-items:center; justify-content:center; padding:20px;}

.brand{display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px;}
.brand .logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex;align-items:center;justify-content:center;font-size:26px; box-shadow:0 10px 30px rgba(124,92,255,.45);}
.brand h1{font-size:22px; font-weight:800;}
.brand span{display:block; font-size:12px; color:var(--muted); font-weight:500;}

.auth-card{
  width:100%; max-width:400px; background:linear-gradient(180deg, var(--card), var(--card2));
  border:1px solid var(--border); border-radius:24px; padding:28px 24px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)}}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
.field input{
  width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border);
  background:#141830; color:var(--text); font-size:15px; transition:.2s;
}
.field input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(124,92,255,.25);}
.btn{
  width:100%; padding:13px; border-radius:12px; font-weight:700; font-size:15px; transition:.2s;
  background:linear-gradient(135deg,var(--primary),var(--primary2)); color:#fff;
}
.btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn.outline{background:transparent; border:1.5px solid var(--border); color:var(--text);}
.btn.danger{background:linear-gradient(135deg,#ff5470,#ff2e63);}
.btn.sm{width:auto; padding:9px 16px; font-size:13px; border-radius:10px;}
.btn.icon-btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px; background:#242a52;}
.btn.icon-btn.off{background:var(--danger);}
.msg-box{margin-top:12px; padding:10px 12px; border-radius:10px; font-size:13px; text-align:center;}
.msg-box.error{background:rgba(255,84,112,.15); color:#ff8fa3; border:1px solid rgba(255,84,112,.35);}
.msg-box.success{background:rgba(46,204,113,.15); color:#7bf1a8; border:1px solid rgba(46,204,113,.35);}
.switch-link{text-align:center; margin-top:16px; font-size:13px; color:var(--muted);}
.switch-link a{color:var(--accent); cursor:pointer; font-weight:600;}

/* ===== App shell ===== */
.app-header{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; background:rgba(15,18,32,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.app-header .title{font-weight:800; font-size:17px;}
.hamburger{width:42px;height:42px;border-radius:12px; background:var(--card2); display:flex;align-items:center;justify-content:center;font-size:20px;}
.drawer-overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; opacity:0; pointer-events:none; transition:.25s;}
.drawer-overlay.open{opacity:1; pointer-events:auto;}
.drawer{
  position:fixed; top:0; right:-300px; width:280px; height:100%; background:var(--card); z-index:50;
  transition:.3s; padding:20px 16px; border-left:1px solid var(--border); overflow-y:auto;
}
.drawer.open{right:0;}
.drawer .duser{display:flex; align-items:center; gap:10px; padding-bottom:16px; margin-bottom:14px; border-bottom:1px solid var(--border);}
.duser .avatar{width:44px;height:44px;border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex;align-items:center;justify-content:center;font-weight:800;}
.duser .role-tag{font-size:11px; color:var(--muted);}
.drawer-item{display:flex; align-items:center; gap:12px; padding:13px 10px; border-radius:12px; font-size:14.5px; color:var(--text); transition:.2s;}
.drawer-item:hover, .drawer-item.active{background:var(--card2);}
.drawer-item .ic{font-size:19px; width:24px; text-align:center;}

.content{padding:18px; max-width:900px; margin:0 auto; width:100%; flex:1;}
.section-title{font-size:18px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}

.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.card{
  background:linear-gradient(180deg,var(--card),var(--card2)); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; transition:.2s;
}
.card:hover{transform:translateY(-3px); border-color:var(--primary);}
.card h3{font-size:16px; margin-bottom:6px;}
.card p{font-size:12.5px; color:var(--muted); margin-bottom:12px;}
.badge{display:inline-block; font-size:11px; padding:3px 10px; border-radius:20px; background:rgba(124,92,255,.2); color:#c7bbff; margin-bottom:8px;}
.empty-state{text-align:center; padding:50px 10px; color:var(--muted);}
.empty-state .ic{font-size:44px; margin-bottom:10px;}

.list-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px;
  background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:10px;
}
.list-item .info b{font-size:14.5px;}
.list-item .info div{font-size:12px; color:var(--muted); margin-top:2px;}
.pill{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--card2);}
.pill.admin{background:#ff5470; color:#fff;}
.pill.teacher{background:var(--accent); color:#0f1220;}
.pill.student{background:var(--card2); color:var(--muted);}

.fab{position:fixed; bottom:24px; left:24px; width:56px;height:56px;border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; font-size:26px; display:flex;align-items:center;justify-content:center; box-shadow:0 12px 30px rgba(124,92,255,.5); z-index:20;}

.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px;}
.modal{width:100%; max-width:400px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:22px;}
.modal h3{margin-bottom:16px; font-size:17px;}

/* ===== Meeting Room ===== */
.room{position:fixed; inset:0; background:#0a0c18; z-index:100; display:flex; flex-direction:column;}
.room-top{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#11142a; border-bottom:1px solid var(--border);}
.room-top .rname{font-weight:700; font-size:14px;}
.room-body{flex:1; display:flex; overflow:hidden; position:relative;}
.videos-wrap{flex:1; padding:10px; overflow-y:auto;}
.videos-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;}
.vtile{position:relative; background:#171a30; border-radius:14px; overflow:hidden; aspect-ratio:4/3; border:1px solid var(--border);}
.vtile video{width:100%; height:100%; object-fit:cover; background:#000;}
.vtile .vname{position:absolute; bottom:6px; right:8px; font-size:12px; background:rgba(0,0,0,.55); padding:3px 9px; border-radius:8px; display:flex; align-items:center; gap:5px;}
.vtile .vstate{position:absolute; top:8px; left:8px; display:flex; gap:5px;}
.vtile .vstate span{background:rgba(0,0,0,.55); border-radius:50%; width:24px;height:24px; display:flex;align-items:center;justify-content:center; font-size:12px;}
.side-panel{width:300px; background:#11142a; border-right:1px solid var(--border); display:flex; flex-direction:column; transition:.25s;}
.side-panel.hidden-panel{width:0; overflow:hidden; border:none;}
.side-tabs{display:flex; border-bottom:1px solid var(--border);}
.side-tabs button{flex:1; padding:12px; font-size:12.5px; color:var(--muted); background:transparent; border-bottom:2px solid transparent;}
.side-tabs button.active{color:var(--text); border-color:var(--primary);}
.side-content{flex:1; overflow-y:auto; padding:12px;}
.chat-msg{margin-bottom:10px;}
.chat-msg b{font-size:12.5px; color:var(--accent);}
.chat-msg p{font-size:13.5px; background:var(--card2); padding:8px 10px; border-radius:10px; margin-top:3px; display:inline-block;}
.chat-input-row{display:flex; gap:8px; padding:10px; border-top:1px solid var(--border);}
.chat-input-row input{flex:1; padding:10px 12px; border-radius:10px; background:#141830; border:1px solid var(--border); color:var(--text);}
.member-row{display:flex; align-items:center; justify-content:space-between; padding:8px 4px; font-size:13.5px; border-bottom:1px solid var(--border);}

.room-bottom{display:flex; align-items:center; justify-content:center; gap:10px; padding:14px; background:#11142a; border-top:1px solid var(--border); flex-wrap:wrap;}

.wb-wrap{position:absolute; inset:0; background:#fff; display:none; flex-direction:column; z-index:5;}
.wb-wrap.show{display:flex;}
.wb-toolbar{display:flex; align-items:center; gap:8px; padding:8px 10px; background:#1c2140; flex-wrap:wrap; overflow-x:auto;}
.wb-toolbar button{background:#2a2f5c; color:#fff; padding:8px 10px; border-radius:8px; font-size:12px;}
.wb-toolbar button.active{background:var(--primary);}
.wb-toolbar input[type=color]{width:34px; height:34px; border-radius:8px; border:none; padding:0; background:none;}
.wb-toolbar input[type=range]{width:80px;}
#wbCanvas{flex:1; touch-action:none; cursor:crosshair; background:#fff;}
.wb-toggle-btn{position:absolute; top:10px; left:10px; z-index:6;}

.toast{position:fixed; bottom:90px; right:50%; transform:translateX(50%); background:#1c2140; border:1px solid var(--border); padding:10px 18px; border-radius:12px; font-size:13px; z-index:200; animation:fadeUp .3s ease;}

@media(max-width:720px){
  .side-panel{position:absolute; right:0; top:0; bottom:0; z-index:10; width:85%; max-width:320px;}
  .side-panel.hidden-panel{width:0;}
}
</style>
</head>
<body>

<!-- ============ AUTH SCREENS ============ -->
<div id="authScreen" class="screen center-screen">
  <div class="brand">
    <div class="logo">🍯</div>
    <div><h1>زبان شیرین</h1><span>پلتفرم کلاس آنلاین</span></div>
  </div>

  <div class="auth-card" id="loginCard">
    <div class="field"><label>نام کاربری</label><input id="loginUsername" placeholder="نام کاربری خود را وارد کنید"></div>
    <div class="field"><label>رمز عبور</label><input id="loginPassword" type="password" placeholder="••••••••"></div>
    <button class="btn" onclick="doLogin()">ورود</button>
    <div id="loginMsg"></div>
    <div class="switch-link">حساب ندارید؟ <a onclick="toggleAuth('register')">ثبت‌نام کنید</a></div>
  </div>

  <div class="auth-card hidden" id="registerCard">
    <div class="field"><label>نام و نام‌خانوادگی</label><input id="regName" placeholder="مثلا: علی رضایی"></div>
    <div class="field"><label>نام کاربری</label><input id="regUsername" placeholder="یک نام کاربری یکتا"></div>
    <div class="field"><label>رمز عبور</label><input id="regPassword" type="password" placeholder="••••••••"></div>
    <button class="btn" onclick="doRegister()">ایجاد حساب</button>
    <div id="registerMsg"></div>
    <div class="switch-link">قبلاً ثبت‌نام کرده‌اید؟ <a onclick="toggleAuth('login')">وارد شوید</a></div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appScreen" class="screen hidden">
  <div class="app-header">
    <button class="hamburger" onclick="openDrawer()">☰</button>
    <div class="title" id="pageTitle">کلاس‌ها</div>
    <div style="width:42px"></div>
  </div>

  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="duser">
      <div class="avatar" id="avatarLetter">?</div>
      <div>
        <div style="font-weight:700; font-size:14px;" id="duName">—</div>
        <div class="role-tag" id="duRole">—</div>
      </div>
    </div>
    <div class="drawer-item" onclick="navigate('classes')"><span class="ic">🏫</span> کلاس‌ها</div>
    <div class="drawer-item" id="createClassMenuItem" onclick="navigate('createClass')"><span class="ic">➕</span> ایجاد کلاس</div>
    <div class="drawer-item" onclick="navigate('groups')"><span class="ic">💬</span> چت گروهی</div>
    <div class="drawer-item" onclick="navigate('recordings')"><span class="ic">🎥</span> کلاس‌های ضبط‌شده</div>
    <div class="drawer-item" onclick="navigate('settings')"><span class="ic">⚙️</span> تنظیمات</div>
    <div class="drawer-item hidden" id="adminMenuItem" onclick="navigate('admin')"><span class="ic">🛡️</span> پنل مدیریت</div>
    <div class="drawer-item" onclick="logout()" style="color:#ff8fa3;"><span class="ic">🚪</span> خروج از حساب</div>
  </div>

  <div class="content" id="content"></div>
</div>

<!-- ============ MEETING ROOM ============ -->
<div id="room" class="room hidden">
  <div class="room-top">
    <div class="rname" id="roomName">کلاس</div>
    <div style="display:flex; gap:8px;">
      <button class="btn sm outline" onclick="toggleSidePanel('chat')">چت</button>
      <button class="btn sm outline" onclick="toggleSidePanel('members')">اعضا</button>
    </div>
  </div>
  <div class="room-body">
    <div class="videos-wrap">
      <div class="videos-grid" id="videosGrid"></div>
      <div class="wb-wrap" id="wbWrap">
        <button class="btn sm icon-btn wb-toggle-btn" onclick="closeWhiteboard()">✖</button>
        <div class="wb-toolbar">
          <button data-tool="pen" onclick="setWbTool('pen')" class="active">✏️ قلم</button>
          <button data-tool="eraser" onclick="setWbTool('eraser')">🧽 پاک‌کن</button>
          <button data-tool="line" onclick="setWbTool('line')">📏 خط</button>
          <button data-tool="rect" onclick="setWbTool('rect')">⬛ مستطیل</button>
          <button data-tool="circle" onclick="setWbTool('circle')">⚪ دایره</button>
          <button data-tool="text" onclick="setWbTool('text')">🔤 متن</button>
          <input type="color" id="wbColor" value="#111111">
          <input type="range" id="wbSize" min="1" max="40" value="4">
          <button onclick="wbUndo()">↩ Undo</button>
          <button onclick="wbRedo()">↪ Redo</button>
          <button onclick="wbClearAll()">🗑 پاک کردن همه</button>
        </div>
        <canvas id="wbCanvas"></canvas>
      </div>
    </div>
    <div class="side-panel hidden-panel" id="sidePanel">
      <div class="side-tabs">
        <button id="tabChat" class="active" onclick="switchTab('chat')">چت کلاس</button>
        <button id="tabMembers" onclick="switchTab('members')">اعضا</button>
      </div>
      <div class="side-content hidden" id="chatContent"></div>
      <div class="side-content hidden" id="membersContent"></div>
      <div class="chat-input-row" id="chatInputRow">
        <input id="roomChatInput" placeholder="پیام بنویسید…" onkeydown="if(event.key==='Enter')sendRoomChat()">
        <button class="btn sm" onclick="sendRoomChat()">ارسال</button>
      </div>
    </div>
  </div>
  <div class="room-bottom" id="roomControls">
    <button class="btn icon-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    <button class="btn icon-btn" id="camBtn" onclick="toggleCam()">📷</button>
    <button class="btn icon-btn" onclick="switchCamera()">🔄</button>
    <button class="btn icon-btn" onclick="toggleScreenShare()">🖥️</button>
    <button class="btn icon-btn" id="wbBtn" onclick="openWhiteboard()">🖊️</button>
    <button class="btn icon-btn" id="recBtn" onclick="toggleRecording()">⏺️</button>
    <button class="btn icon-btn danger" onclick="leaveRoom()">📞</button>
  </div>
</div>

<div id="toastHost"></div>

<script>
/* ============================================================
   تنظیمات Supabase
============================================================ */
const SUPABASE_URL = "https://uqqumhmzndgyoigcqnti.supabase.co";
const SUPABASE_KEY = "sb_publishable_R3LAX7EYbdYUwjQRgkmesA_QJ2ZmPtD";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STUN_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" }
];

let currentUser = null; // {id, name, username, role}
let currentRoute = "classes";

/* ============================================================
   ابزار کمکی UI
============================================================ */
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.getElementById("toastHost").appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function roleLabel(r){ return r==='admin' ? 'مدیر' : r==='teacher' ? 'معلم' : 'دانش‌آموز'; }

/* ============================================================
   احراز هویت (RPC: register_username / login_username)
============================================================ */
function toggleAuth(which){
  document.getElementById("loginCard").classList.toggle("hidden", which!=="login");
  document.getElementById("registerCard").classList.toggle("hidden", which!=="register");
}

async function doRegister(){
  const name = document.getElementById("regName").value.trim();
  const username = document.getElementById("regUsername").value.trim();
  const password = document.getElementById("regPassword").value;
  const msgEl = document.getElementById("registerMsg");
  msgEl.innerHTML = "";
  if(!name || !username || !password){
    msgEl.innerHTML = `<div class="msg-box error">لطفاً همه فیلدها را پر کنید.</div>`;
    return;
  }
  try{
    const { data, error } = await db.rpc('register_username', {
      p_username: username, p_password: password, p_name: name
    });
    if(error) throw error;
    msgEl.innerHTML = `<div class="msg-box success">ثبت‌نام موفق بود! اکنون وارد شوید.</div>`;
    setTimeout(()=>toggleAuth('login'), 900);
  }catch(err){
    msgEl.innerHTML = `<div class="msg-box error">خطا در ثبت‌نام: ${esc(err.message||'نامشخص')}</div>`;
  }
}

async function doLogin(){
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  const msgEl = document.getElementById("loginMsg");
  msgEl.innerHTML = "";
  if(!username || !password){
    msgEl.innerHTML = `<div class="msg-box error">نام کاربری و رمز عبور را وارد کنید.</div>`;
    return;
  }
  try{
    const { data, error } = await db.rpc('login_username', {
      p_username: username, p_password: password
    });
    if(error) throw error;
    let profile = Array.isArray(data) ? data[0] : data;
    if(!profile){
      msgEl.innerHTML = `<div class="msg-box error">نام کاربری یا رمز عبور اشتباه است.</div>`;
      return;
    }
    currentUser = {
      id: profile.id, name: profile.name || username,
      username: profile.username || username, role: profile.role || 'student'
    };
    localStorage.setItem('zs_user', JSON.stringify(currentUser));
    msgEl.innerHTML = `<div class="msg-box success">ورود موفق! در حال انتقال…</div>`;
    setTimeout(enterApp, 500);
  }catch(err){
    msgEl.innerHTML = `<div class="msg-box error">خطا در ورود: ${esc(err.message||'نامشخص')}</div>`;
  }
}

function logout(){
  localStorage.removeItem('zs_user');
  currentUser = null;
  document.getElementById("appScreen").classList.add("hidden");
  document.getElementById("authScreen").classList.remove("hidden");
}

async function tryRestoreSession(){
  const raw = localStorage.getItem('zs_user');
  if(raw){
    try{
      currentUser = JSON.parse(raw);
      // تازه‌سازی نقش از دیتابیس (ممکن است مدیر نقش را تغییر داده باشد)
      const { data } = await db.from('profiles').select('*').eq('id', currentUser.id).single();
      if(data){ currentUser.role = data.role; currentUser.name = data.name; }
      enterApp();
      return;
    }catch(e){}
  }
}

function enterApp(){
  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("appScreen").classList.remove("hidden");
  document.getElementById("duName").textContent = currentUser.name;
  document.getElementById("duRole").textContent = roleLabel(currentUser.role);
  document.getElementById("avatarLetter").textContent = (currentUser.name||"?").charAt(0);
  document.getElementById("createClassMenuItem").classList.toggle("hidden", currentUser.role!=='admin');
  document.getElementById("adminMenuItem").classList.toggle("hidden", currentUser.role!=='admin');
  navigate('classes');
}

/* ============================================================
   Drawer / Navigation
============================================================ */

/* ============================================================
   کلاس آنلاین: WebRTC + Realtime Broadcast + Whiteboard + Recording
============================================================ */
let roomState = {
  meetingId: null, meetingName: "", channel: null,
  localStream: null, screenStream: null,
  peers: {}, // peerId -> RTCPeerConnection
  micOn: true, camOn: true, facingMode: "user",
  members: {}, // peerId -> {name, mic, cam}
  mediaRecorder: null, recordedChunks: [], isRecording: false,
  wb: { tool:'pen', color:'#111111', size:4, drawing:false, strokes:[], redoStack:[], startX:0, startY:0, currentPreview:null }
};
const myPeerId = crypto.randomUUID();

async function joinRoom(id, name){
  roomState.meetingId = id;
  roomState.meetingName = name;
  document.getElementById("room").classList.remove("hidden");
  document.getElementById("roomName").textContent = name;
  document.getElementById("videosGrid").innerHTML = "";

  try{
    roomState.localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  }catch(e){
    toast("⚠️ دسترسی به دوربین/میکروفون ممکن نشد. فقط می‌توانید مشاهده و چت کنید.");
    roomState.localStream = new MediaStream();
  }
  addVideoTile(myPeerId, currentUser.name, roomState.localStream, true);

  roomState.channel = db.channel('meeting_'+id, { config: { broadcast:{ self:false }, presence:{ key: myPeerId } } });

  roomState.channel
    .on('broadcast', {event:'signal'}, ({payload}) => handleSignal(payload))
    .on('broadcast', {event:'whiteboard'}, ({payload}) => handleWhiteboardEvent(payload))
    .on('presence', {event:'sync'}, () => syncPresence())
    .on('presence', {event:'leave'}, ({key}) => removePeer(key))
    .subscribe(async (status) => {
      if(status === 'SUBSCRIBED'){
        await roomState.channel.track({ name: currentUser.name, role: currentUser.role, mic:true, cam:true });
        loadRoomChat();
        loadWhiteboardHistory();
      }
    });
}

function syncPresence(){
  const state = roomState.channel.presenceState();
  const otherKeys = Object.keys(state).filter(k => k !== myPeerId);
  renderMembersList(state);
  otherKeys.forEach(key => {
    if(!roomState.peers[key]){
      const initiator = myPeerId < key; // فقط یک طرف پیشنهاد بدهد
      createPeerConnection(key, initiator);
    }
  });
}

function renderMembersList(state){
  const box = document.getElementById("membersContent");
  let rows = `<div class="member-row"><b>${esc(currentUser.name)} (شما)</b><span class="pill ${currentUser.role}">${roleLabel(currentUser.role)}</span></div>`;
  Object.keys(state).forEach(key=>{
    if(key===myPeerId) return;
    const p = state[key][0];
    rows += `<div class="member-row"><span>${esc(p.name)}</span><span class="pill ${p.role}">${roleLabel(p.role)}</span></div>`;
  });
  box.innerHTML = rows;
}

function createPeerConnection(peerId, initiator){
  const pc = new RTCPeerConnection({ iceServers: STUN_SERVERS });
  roomState.peers[peerId] = pc;

  roomState.localStream.getTracks().forEach(t => pc.addTrack(t, roomState.localStream));

  pc.onicecandidate = (e) => {
    if(e.candidate){
      roomState.channel.send({ type:'broadcast', event:'signal', payload:{ to:peerId, from:myPeerId, kind:'candidate', data:e.candidate } });
    }
  };
  pc.ontrack = (e) => {
    addVideoTile(peerId, "کاربر", e.streams[0], false);
  };

  if(initiator){
    pc.onnegotiationneeded = async () => {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      roomState.channel.send({ type:'broadcast', event:'signal', payload:{ to:peerId, from:myPeerId, kind:'offer', data:offer } });
    };
  }
  return pc;
}

async function handleSignal(payload){
  if(payload.to !== myPeerId) return;
  const { from, kind, data } = payload;
  let pc = roomState.peers[from];
  if(!pc) pc = createPeerConnection(from, false);

  if(kind === 'offer'){
    await pc.setRemoteDescription(new RTCSessionDescription(data));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    roomState.channel.send({ type:'broadcast', event:'signal', payload:{ to:from, from:myPeerId, kind:'answer', data:answer } });
  } else if(kind === 'answer'){
    await pc.setRemoteDescription(new RTCSessionDescription(data));
  } else if(kind === 'candidate'){
    try{ await pc.addIceCandidate(new RTCIceCandidate(data)); }catch(e){}
  }
}

function removePeer(peerId){
  if(roomState.peers[peerId]){ roomState.peers[peerId].close(); delete roomState.peers[peerId]; }
  const tile = document.getElementById('tile_'+peerId);
  if(tile) tile.remove();
}

function addVideoTile(peerId, name, stream, isSelf){
  let tile = document.getElementById('tile_'+peerId);
  if(!tile){
    tile = document.createElement('div');
    tile.className = 'vtile';
    tile.id = 'tile_'+peerId;
    tile.innerHTML = `<video autoplay playsinline ${isSelf?'muted':''}></video>
      <div class="vstate"><span id="micstate_${peerId}">🎤</span><span id="camstate_${peerId}">📷</span></div>
      <div class="vname" id="name_${peerId}">${esc(name)}${isSelf?' (شما)':''}</div>`;
    document.getElementById("videosGrid").appendChild(tile);
  }
  tile.querySelector('video').srcObject = stream;
}

/* ---- کنترل‌های میکروفون/دوربین ---- */
function toggleMic(){
  roomState.micOn = !roomState.micOn;
  roomState.localStream.getAudioTracks().forEach(t => t.enabled = roomState.micOn);
  document.getElementById("micBtn").classList.toggle("off", !roomState.micOn);
  document.getElementById("micBtn").textContent = roomState.micOn ? "🎤" : "🔇";
}
function toggleCam(){
  roomState.camOn = !roomState.camOn;
  roomState.localStream.getVideoTracks().forEach(t => t.enabled = roomState.camOn);
  document.getElementById("camBtn").classList.toggle("off", !roomState.camOn);
  document.getElementById("camBtn").textContent = roomState.camOn ? "📷" : "🚫";
}
async function switchCamera(){
  roomState.facingMode = roomState.facingMode === "user" ? "environment" : "user";
  try{
    const newStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: roomState.facingMode }, audio:true });
    const newVideoTrack = newStream.getVideoTracks()[0];
    Object.values(roomState.peers).forEach(pc=>{
      const sender = pc.getSenders().find(s=>s.track && s.track.kind==='video');
      if(sender) sender.replaceTrack(newVideoTrack);
    });
    roomState.localStream.getVideoTracks().forEach(t=>t.stop());
    roomState.localStream.removeTrack(roomState.localStream.getVideoTracks()[0]);
    roomState.localStream.addTrack(newVideoTrack);
    document.querySelector('#tile_'+myPeerId+' video').srcObject = roomState.localStream;
  }catch(e){
    toast("تعویض دوربین در این مرورگر پشتیبانی نمی‌شود.");
  }
}
async function toggleScreenShare(){
  try{
    if(!roomState.screenStream){
      roomState.screenStream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true });
      const screenTrack = roomState.screenStream.getVideoTracks()[0];
      Object.values(roomState.peers).forEach(pc=>{
        const sender = pc.getSenders().find(s=>s.track && s.track.kind==='video');
        if(sender) sender.replaceTrack(screenTrack);
      });
      document.querySelector('#tile_'+myPeerId+' video').srcObject = roomState.screenStream;
      screenTrack.onended = stopScreenShare;
    } else {
      stopScreenShare();
    }
  }catch(e){
    toast("اشتراک‌گذاری صفحه توسط مرورگر شما پشتیبانی نمی‌شود.");
  }
}
function stopScreenShare(){
  if(!roomState.screenStream) return;
  roomState.screenStream.getTracks().forEach(t=>t.stop());
  roomState.screenStream = null;
  const camTrack = roomState.localStream.getVideoTracks()[0];
  Object.values(roomState.peers).forEach(pc=>{
    const sender = pc.getSenders().find(s=>s.track && s.track.kind==='video');
    if(sender && camTrack) sender.replaceTrack(camTrack);
  });
  document.querySelector('#tile_'+myPeerId+' video').srcObject = roomState.localStream;
}

/* ---- تخته هوشمند (Whiteboard) ---- */
let wbCtx = null;
function canDrawWb(){ return currentUser.role === 'teacher' || currentUser.role === 'admin'; }

function openWhiteboard(){
  const wrap = document.getElementById("wbWrap");
  wrap.classList.add("show");
  const canvas = document.getElementById("wbCanvas");
  canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
  wbCtx = canvas.getContext("2d");
  redrawWhiteboard();

  if(!canDrawWb()){
    document.querySelector(".wb-toolbar").classList.add("hidden");
    toast("شما فقط می‌توانید تخته را مشاهده کنید.");
  }

  canvas.onpointerdown = wbPointerDown;
  canvas.onpointermove = wbPointerMove;
  canvas.onpointerup = wbPointerUp;
  canvas.onpointerleave = wbPointerUp;

  document.getElementById("wbColor").oninput = e => roomState.wb.color = e.target.value;
  document.getElementById("wbSize").oninput = e => roomState.wb.size = +e.target.value;
}
function closeWhiteboard(){ document.getElementById("wbWrap").classList.remove("show"); }
function setWbTool(tool){
  roomState.wb.tool = tool;
  document.querySelectorAll('.wb-toolbar button[data-tool]').forEach(b=>b.classList.toggle('active', b.dataset.tool===tool));
}

function wbPointerDown(e){
  if(!canDrawWb()) return;
  const rect = e.target.getBoundingClientRect();
  roomState.wb.startX = e.clientX - rect.left;
  roomState.wb.startY = e.clientY - rect.top;
  roomState.wb.drawing = true;

  if(roomState.wb.tool === 'text'){
    const text = prompt("متن مورد نظر را وارد کنید:");
    roomState.wb.drawing = false;
    if(!text) return;
    const stroke = { type:'text', x:roomState.wb.startX, y:roomState.wb.startY, text, color:roomState.wb.color, size:roomState.wb.size*4 };
    addStroke(stroke);
    return;
  }
  if(roomState.wb.tool === 'pen' || roomState.wb.tool === 'eraser'){
    roomState.wb.currentPreview = { type:'path', points:[[roomState.wb.startX, roomState.wb.startY]], color: roomState.wb.tool==='eraser'?'#ffffff':roomState.wb.color, size: roomState.wb.tool==='eraser'? roomState.wb.size*4 : roomState.wb.size };
  }
}
function wbPointerMove(e){
  if(!roomState.wb.drawing || !canDrawWb()) return;
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if(roomState.wb.tool === 'pen' || roomState.wb.tool === 'eraser'){
    roomState.wb.currentPreview.points.push([x,y]);
    redrawWhiteboard();
    drawStroke(roomState.wb.currentPreview);
  } else if(['line','rect','circle'].includes(roomState.wb.tool)){
    redrawWhiteboard();
    drawStroke({ type: roomState.wb.tool, x1:roomState.wb.startX, y1:roomState.wb.startY, x2:x, y2:y, color: roomState.wb.color, size: roomState.wb.size });
  }
}
function wbPointerUp(e){
  if(!roomState.wb.drawing || !canDrawWb()) return;
  roomState.wb.drawing = false;
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if(roomState.wb.tool === 'pen' || roomState.wb.tool === 'eraser'){
    addStroke(roomState.wb.currentPreview);
    roomState.wb.currentPreview = null;
  } else if(['line','rect','circle'].includes(roomState.wb.tool)){
    addStroke({ type: roomState.wb.tool, x1:roomState.wb.startX, y1:roomState.wb.startY, x2:x, y2:y, color: roomState.wb.color, size: roomState.wb.size });
  }
}

function drawStroke(s){
  wbCtx.lineJoin = "round"; wbCtx.lineCap = "round";
  wbCtx.strokeStyle = s.color; wbCtx.fillStyle = s.color; wbCtx.lineWidth = s.size;
  if(s.type === 'path'){
    wbCtx.beginPath();
    s.points.forEach(([x,y],i)=> i===0 ? wbCtx.moveTo(x,y) : wbCtx.lineTo(x,y));
    wbCtx.stroke();
  } else if(s.type === 'line'){
    wbCtx.beginPath(); wbCtx.moveTo(s.x1,s.y1); wbCtx.lineTo(s.x2,s.y2); wbCtx.stroke();
  } else if(s.type === 'rect'){
    wbCtx.strokeRect(s.x1,s.y1, s.x2-s.x1, s.y2-s.y1);
  } else if(s.type === 'circle'){
    const r = Math.hypot(s.x2-s.x1, s.y2-s.y1);
    wbCtx.beginPath(); wbCtx.arc(s.x1,s.y1,r,0,Math.PI*2); wbCtx.stroke();
  } else if(s.type === 'text'){
    wbCtx.font = `${s.size}px Vazirmatn`;
    wbCtx.fillText(s.text, s.x, s.y);
  }
}
function redrawWhiteboard(){
  if(!wbCtx) return;
  wbCtx.clearRect(0,0,wbCtx.canvas.width, wbCtx.canvas.height);
  roomState.wb.strokes.forEach(drawStroke);
}
function addStroke(stroke){
  roomState.wb.strokes.push(stroke);
  roomState.wb.redoStack = [];
  redrawWhiteboard();
  broadcastWb({ action:'add', stroke });
  db.from('whiteboard_strokes').insert({ meeting_id: roomState.meetingId, stroke }).then(()=>{});
}
function wbUndo(){
  if(!roomState.wb.strokes.length) return;
  const s = roomState.wb.strokes.pop();
  roomState.wb.redoStack.push(s);
  redrawWhiteboard();
  broadcastWb({ action:'undo' });
}
function wbRedo(){
  if(!roomState.wb.redoStack.length) return;
  const s = roomState.wb.redoStack.pop();
  roomState.wb.strokes.push(s);
  redrawWhiteboard();
  broadcastWb({ action:'redo', stroke:s });
}
function wbClearAll(){
  if(!canDrawWb()) return;
  roomState.wb.strokes = []; roomState.wb.redoStack = [];
  redrawWhiteboard();
  broadcastWb({ action:'clear' });
  db.from('whiteboard_strokes').delete().eq('meeting_id', roomState.meetingId).then(()=>{});
}
function broadcastWb(payload){
  roomState.channel.send({ type:'broadcast', event:'whiteboard', payload });
}
function handleWhiteboardEvent(payload){
  if(payload.action === 'add') roomState.wb.strokes.push(payload.stroke);
  else if(payload.action === 'undo') roomState.wb.redoStack.push(roomState.wb.strokes.pop());
  else if(payload.action === 'redo') roomState.wb.strokes.push(payload.stroke);
  else if(payload.action === 'clear') roomState.wb.strokes = [];
  redrawWhiteboard();
}
async function loadWhiteboardHistory(){
  const { data } = await db.from('whiteboard_strokes').select('*').eq('meeting_id', roomState.meetingId).order('created_at');
  roomState.wb.strokes = (data||[]).map(r=>r.stroke);
}

/* ---- ضبط جلسه ---- */
async function toggleRecording(){
  if(!roomState.isRecording){
    try{
      const capture = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true });
      roomState.recordedChunks = [];
      roomState.mediaRecorder = new MediaRecorder(capture, { mimeType: 'video/webm' });
      roomState.mediaRecorder.ondataavailable = e => { if(e.data.size>0) roomState.recordedChunks.push(e.data); };
      roomState.mediaRecorder.onstop = uploadRecording;
      roomState.mediaRecorder.start();
      roomState.isRecording = true;
      document.getElementById("recBtn").classList.add("off");
      toast("ضبط کلاس آغاز شد.");
      capture.getVideoTracks()[0].onended = () => stopRecordingIfActive();
    }catch(e){
      toast("⚠️ ضبط در این مرورگر/دستگاه پشتیبانی نمی‌شود.");
    }
  } else {
    stopRecordingIfActive();
  }
}
function stopRecordingIfActive(){
  if(roomState.mediaRecorder && roomState.isRecording){
    roomState.mediaRecorder.stop();
    roomState.isRecording = false;
    document.getElementById("recBtn").classList.remove("off");
  }
}
async function uploadRecording(){
  toast("در حال ذخیره‌سازی ضبط…");
  const blob = new Blob(roomState.recordedChunks, { type:'video/webm' });
  const path = `${roomState.meetingId}/${Date.now()}.webm`;
  const { error: upErr } = await db.storage.from('recordings').upload(path, blob);
  if(upErr){ toast("خطا در ذخیره ضبط: "+upErr.message); return; }
  await db.from('recordings').insert({
    meeting_id: roomState.meetingId, meeting_name: roomState.meetingName,
    owner_id: currentUser.id, owner_name: currentUser.name, file_path: path
  });
  toast("ضبط با موفقیت ذخیره شد ✅");
}

/* ---- خروج از کلاس ---- */
function leaveRoom(){
  Object.values(roomState.peers).forEach(pc=>pc.close());
  roomState.peers = {};
  if(roomState.localStream) roomState.localStream.getTracks().forEach(t=>t.stop());
  if(roomState.screenStream) roomState.screenStream.getTracks().forEach(t=>t.stop());
  stopRecordingIfActive();
  if(roomState.channel) db.removeChannel(roomState.channel);
  document.getElementById("videosGrid").innerHTML = "";
  document.getElementById("room").classList.add("hidden");
  closeWhiteboard();
  navigate('classes');
}

/* ============================================================
   شروع برنامه
============================================================ */
tryRestoreSession();
</script>
