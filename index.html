<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>درسگاه آنلاین</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Tahoma,Arial,sans-serif;
  background:#07111f;
  color:#fff;
}

body{
  overflow-x:hidden;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.page{
  width:min(1200px,94%);
  margin:auto;
}

.card{
  background:#0b1b2d;
  border:1px solid #1e4262;
  border-radius:20px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 10px 35px #0005;
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  margin:4px;
  background:#126bc6;
  color:#fff;
  font-weight:bold;
  font-size:14px;
}

.btn:hover{
  filter:brightness(1.1);
}

.btn.yellow{
  background:#ffd21c;
  color:#111;
}

.btn.green{
  background:#159653;
}

.btn.red{
  background:#d53d47;
}

.btn.gray{
  background:#263d58;
}

.btn.full{
  width:100%;
  margin:7px 0;
}

input,textarea,select{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #28577f;
  background:#061321;
  color:#fff;
  outline:none;
  font-size:15px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#ffd21c;
}

.logo{
  text-align:center;
  color:#ffd21c;
  font-size:31px;
  font-weight:bold;
  margin-bottom:25px;
}

.auth-card{
  width:min(520px,94%);
  margin:70px auto;
}

.notice{
  background:#0d243d;
  border:1px solid #245d8e;
  border-radius:13px;
  padding:13px;
  margin:10px 0;
  line-height:1.9;
}

.notice.error{
  background:#35151a;
  border-color:#9d303c;
}

.notice.success{
  background:#103521;
  border-color:#26784a;
}

.muted{
  color:#9fb3c9;
  font-size:13px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:5000;
  height:68px;
  background:#071425ee;
  backdrop-filter:blur(15px);
  border-bottom:1px solid #214b73;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 4%;
}

.top-logo{
  color:#ffd21c;
  font-weight:bold;
  font-size:20px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.menu-button{
  width:45px;
  height:45px;
  border:0;
  border-radius:12px;
  background:#102943;
  color:#fff;
  font-size:23px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ffd21c;
  color:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}

.stat{
  background:#071426;
  border:1px solid #21496e;
  border-radius:15px;
  padding:18px;
}

.stat-number{
  display:block;
  color:#ffd21c;
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
}

.class-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:15px;
}

.class-card{
  background:#071426;
  border:1px solid #24547e;
  border-radius:17px;
  padding:18px;
}

.class-title{
  color:#ffd21c;
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
  margin:3px;
}

.badge-admin{
  background:#554700;
  color:#ffe86a;
}

.badge-teacher{
  background:#123f68;
  color:#83cbff;
}

.badge-student{
  background:#12472e;
  color:#8ce9ad;
}

.empty{
  text-align:center;
  color:#93a9be;
  padding:30px;
}

hr{
  border:0;
  border-top:1px solid #21405e;
  margin:18px 0;
}

/* DRAWER */

.drawer-backdrop{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:8000;
  display:none;
}

.drawer{
  position:fixed;
  top:0;
  right:0;
  width:min(360px,90%);
  height:100%;
  background:#091827;
  border-left:1px solid #24537f;
  z-index:9000;
  transform:translateX(100%);
  transition:.25s;
  padding:20px;
  overflow:auto;
}

.drawer.open{
  transform:translateX(0);
}

.drawer-backdrop.open{
  display:block;
}

.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.drawer-head button{
  background:#263d58;
  border:0;
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
}

.drawer-item{
  width:100%;
  text-align:right;
  border:0;
  background:#0d2238;
  color:#fff;
  padding:15px;
  border-radius:13px;
  margin:5px 0;
  font-size:15px;
}

.drawer-item:hover{
  background:#143452;
}

/* ROOM */

.room{
  position:fixed;
  inset:0;
  background:#202124;
  z-index:7000;
  display:flex;
  flex-direction:column;
}

.room-header{
  height:58px;
  background:#202124;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 14px;
  flex-shrink:0;
}

.room-title{
  font-size:15px;
  font-weight:bold;
}

.room-status{
  font-size:12px;
  color:#b9c0c8;
}

.room-main{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
}

.video-area{
  flex:1;
  min-width:0;
  padding:10px;
  overflow:auto;
}

.video-grid{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:10px;
  align-content:center;
}

.video-box{
  position:relative;
  background:#111;
  border-radius:14px;
  overflow:hidden;
  min-height:190px;
  border:1px solid #3b3d42;
  box-shadow:0 5px 20px #0007;
}

.video-box video{
  width:100%;
  height:100%;
  min-height:190px;
  object-fit:cover;
  display:block;
  background:#111;
}

.video-name{
  position:absolute;
  right:9px;
  bottom:9px;
  background:#000b;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
}

.video-muted{
  position:absolute;
  left:9px;
  bottom:9px;
  background:#000b;
  border-radius:50%;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.no-video{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  background:#111820;
}

/* SIDE PANEL */

.room-side{
  width:360px;
  background:#0b1725;
  border-left:1px solid #30353a;
  display:none;
  flex-direction:column;
}

.room-side.open{
  display:flex;
}

.side-head{
  padding:15px;
  border-bottom:1px solid #26323d;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.side-content{
  flex:1;
  overflow:auto;
  padding:12px;
}

.room-chat{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.chat-message{
  background:#152536;
  border-radius:12px;
  padding:9px;
  line-height:1.7;
}

.chat-author{
  color:#ffd21c;
  font-size:12px;
  margin-bottom:3px;
}

.chat-text{
  font-size:14px;
}

.chat-input-area{
  padding:10px;
  border-top:1px solid #26323d;
  display:flex;
  gap:5px;
}

.chat-input-area input{
  margin:0;
}

.chat-input-area button{
  flex-shrink:0;
}

/* BOTTOM */

.room-controls{
  min-height:78px;
  background:#202124;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  padding:10px;
  flex-shrink:0;
}

.control{
  width:50px;
  height:50px;
  border-radius:50%;
  border:0;
  background:#3c4043;
  color:#fff;
  font-size:20px;
}

.control:hover{
  background:#505458;
}

.control.active{
  background:#d93025;
}

.control.leave{
  width:62px;
  border-radius:18px;
  background:#ea4335;
}

.control-label{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.control-label small{
  font-size:9px;
  color:#ddd;
}

.room-more{
  position:relative;
}

.more-menu{
  position:absolute;
  bottom:62px;
  left:0;
  width:220px;
  background:#17212b;
  border:1px solid #3d4a55;
  border-radius:14px;
  padding:8px;
  display:none;
  box-shadow:0 10px 30px #0009;
}

.more-menu.open{
  display:block;
}

.more-menu button{
  width:100%;
  background:transparent;
  color:#fff;
  border:0;
  text-align:right;
  padding:12px;
  border-radius:8px;
}

.more-menu button:hover{
  background:#26343f;
}

/* BOARD */

.board-screen{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#e9eef2;
  display:flex;
  flex-direction:column;
}

.board-header{
  height:58px;
  background:#101b29;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 10px;
  flex-shrink:0;
}

.board-title{
  font-weight:bold;
}

.board-toolbar{
  background:#152538;
  padding:7px;
  display:flex;
  gap:5px;
  overflow-x:auto;
  flex-shrink:0;
}

.board-tool{
  border:0;
  background:#263d58;
  color:#fff;
  border-radius:9px;
  padding:9px 12px;
  white-space:nowrap;
}

.board-tool.active{
  background:#ffd21c;
  color:#111;
}

.board-tool.danger{
  background:#d53d47;
}

.board-settings{
  background:#fff;
  color:#111;
  padding:8px;
  display:flex;
  gap:8px;
  align-items:center;
  overflow-x:auto;
  flex-shrink:0;
}

.board-settings label{
  white-space:nowrap;
  font-size:12px;
}

.board-settings input[type=color]{
  width:45px;
  height:35px;
  padding:2px;
  margin:0;
}

.board-settings input[type=range]{
  width:100px;
  margin:0;
}

.board-wrap{
  flex:1;
  position:relative;
  overflow:hidden;
  background:#fff;
}

#boardCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

/* ADMIN */

.admin-panel{
  margin-top:15px;
}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.tab{
  border:0;
  background:#102840;
  color:#cbd9e7;
  padding:11px 15px;
  border-radius:10px;
}

.tab.active{
  background:#126bc6;
  color:#fff;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  border-bottom:1px solid #203b56;
  text-align:right;
  white-space:nowrap;
}

th{
  color:#ffd21c;
}

.setting{
  background:#071426;
  border:1px solid #20486c;
  border-radius:13px;
  padding:13px;
  margin:9px 0;
}

.setting label{
  display:block;
  margin:7px 0;
}

/* TOAST */

#toast{
  display:none;
  position:fixed;
  z-index:99999;
  bottom:20px;
  left:15px;
  right:15px;
  max-width:600px;
  margin:auto;
  padding:13px;
  text-align:center;
  background:#102943;
  border:1px solid #3473a6;
  border-radius:13px;
  box-shadow:0 10px 35px #0008;
}

/* RESPONSIVE */

@media(max-width:850px){

  .room-side{
    position:absolute;
    top:0;
    right:0;
    bottom:0;
    width:min(360px,92%);
    z-index:30;
  }

  .video-grid{
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  }

  .video-box,
  .video-box video{
    min-height:130px;
  }

  .room-controls{
    min-height:72px;
    overflow-x:auto;
  }

  .control{
    width:46px;
    height:46px;
    font-size:18px;
  }

  .control.leave{
    width:56px;
  }

  .room-title{
    max-width:170px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
}

@media(max-width:500px){

  .top-logo{
    font-size:16px;
  }

  .video-grid{
    grid-template-columns:1fr 1fr;
  }

  .video-box,
  .video-box video{
    min-height:110px;
  }

  .board-tool{
    padding:8px 10px;
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authPage">

  <div class="card auth-card">

    <div class="logo">
      🎓 درسگاه آنلاین
    </div>

    <h2 id="authTitle" style="text-align:center">
      ورود به درسگاه
    </h2>

    <div id="registerBox" class="hidden">

      <input
        id="regName"
        type="text"
        placeholder="نام و نام خانوادگی">

      <input
        id="regUsername"
        type="text"
        placeholder="نام کاربری">

    </div>

    <input
      id="loginUsername"
      type="text"
      placeholder="نام کاربری">

    <input
      id="authPassword"
      type="password"
      placeholder="رمز عبور">

    <button
      id="authButton"
      class="btn yellow full"
      onclick="submitAuth()">
      ورود
    </button>

    <button
      id="switchButton"
      class="btn gray full"
      onclick="toggleAuth()">
      ساخت حساب جدید
    </button>

    <div id="authMessage" class="notice hidden"></div>

  </div>

</section>


<!-- MAIN -->

<section id="mainPage" class="hidden">

<header class="topbar">

  <div class="top-logo">
    🎓 درسگاه آنلاین
  </div>

  <div class="top-actions">

    <div id="topAvatar" class="avatar">
      ?
    </div>

    <button
      class="menu-button"
      onclick="openDrawer()">
      ☰
    </button>

  </div>

</header>


<main class="page">

  <div class="card">

    <h2 id="welcomeText"></h2>

    <div id="roleText" class="muted"></div>

  </div>


  <div class="card">

    <h2>🏫 کلاس‌های آنلاین</h2>

    <div id="classList">
      <div class="empty">
        در حال دریافت کلاس‌ها...
      </div>
    </div>

  </div>


  <section id="teacherCreate" class="hidden">

    <div class="card">

      <h2>👨‍🏫 ساخت کلاس جدید</h2>

      <input
        id="newClassName"
        placeholder="نام کلاس">

      <input
        id="newClassPassword"
        type="password"
        placeholder="رمز کلاس">

      <div class="setting">

        <label>
          <input id="settingMic" type="checkbox" checked>
          🎤 اجازه میکروفون
        </label>

        <label>
          <input id="settingCamera" type="checkbox" checked>
          📷 اجازه دوربین
        </label>

        <label>
          <input id="settingChat" type="checkbox" checked>
          💬 فعال بودن چت
        </label>

      </div>

      <button
        class="btn yellow"
        onclick="createClass()">
        ➕ ساخت کلاس
      </button>

    </div>

  </section>


  <!-- ADMIN -->

  <section id="adminPanel" class="hidden admin-panel">

    <div class="card">

      <h2>👑 پنل مدیریت</h2>

      <div class="grid">

        <div class="stat">
          👥 کاربران
          <span id="adminUsersCount" class="stat-number">0</span>
        </div>

        <div class="stat">
          👨‍🏫 معلم‌ها
          <span id="adminTeachersCount" class="stat-number">0</span>
        </div>

        <div class="stat">
          👨‍🎓 دانش‌آموزها
          <span id="adminStudentsCount" class="stat-number">0</span>
        </div>

        <div class="stat">
          🏫 کلاس‌ها
          <span id="adminClassesCount" class="stat-number">0</span>
        </div>

      </div>

    </div>

    <div class="card">

      <div class="tabs">

        <button class="tab active"
          onclick="adminTab('users',this)">
          👥 کاربران
        </button>

        <button class="tab"
          onclick="adminTab('classes',this)">
          🏫 کلاس‌ها
        </button>

        <button class="tab"
          onclick="adminTab('messages',this)">
          💬 پیام‌ها
        </button>

      </div>

      <div id="adminContent"></div>

    </div>

  </section>

</main>

</section>


<!-- DRAWER -->

<div
  id="drawerBackdrop"
  class="drawer-backdrop"
  onclick="closeDrawer()">
</div>

<aside id="drawer" class="drawer">

  <div class="drawer-head">

    <h2>☰ منو</h2>

    <button onclick="closeDrawer()">
      ✕
    </button>

  </div>

  <button
    class="drawer-item"
    onclick="closeDrawer();scrollToClasses()">
    🏫 کلاس‌ها
  </button>

  <button
    class="drawer-item"
    onclick="closeDrawer();openCreateClass()">
    ➕ ساخت کلاس
  </button>

  <button
    class="drawer-item"
    onclick="closeDrawer();openGlobalChat()">
    💬 چت
  </button>

  <button
    id="adminMenuButton"
    class="drawer-item hidden"
    onclick="closeDrawer();openAdmin()">
    👑 پنل مدیریت
  </button>

  <button
    class="drawer-item"
    onclick="closeDrawer();logout()">
    🚪 خروج
  </button>

</aside>


<!-- ROOM -->

<section id="room" class="room hidden">

  <header class="room-header">

    <div>

      <div id="roomTitle" class="room-title">
        کلاس
      </div>

      <div id="roomStatus" class="room-status">
        در حال اتصال...
      </div>

    </div>

    <button
      class="btn gray"
      onclick="leaveRoom()">
      خروج
    </button>

  </header>


  <div class="room-main">

    <div class="video-area">

      <div id="videos" class="video-grid"></div>

    </div>


    <aside id="roomSide" class="room-side">

      <div class="side-head">

        <strong id="sideTitle">
          چت
        </strong>

        <button
          class="btn gray"
          onclick="closeSidePanel()">
          ✕
        </button>

      </div>

      <div
        id="sideContent"
        class="side-content">
      </div>

    </aside>

  </div>


  <div class="room-controls">

    <div class="control-label">

      <button
        id="micControl"
        class="control"
        onclick="toggleMic()">
        🎤
      </button>

      <small>میکروفون</small>

    </div>


    <div class="control-label">

      <button
        id="cameraControl"
        class="control"
        onclick="toggleCamera()">
        📷
      </button>

      <small>دوربین</small>

    </div>


    <div class="control-label">

      <button
        class="control"
        onclick="flipCamera()">
        🔄
      </button>

      <small>چرخش</small>

    </div>


    <div class="control-label">

      <button
        class="control"
        onclick="shareScreen()">
        🖥️
      </button>

      <small>صفحه</small>

    </div>


    <div class="control-label">

      <button
        class="control"
        onclick="openBoard()">
        📝
      </button>

      <small>تخته</small>

    </div>


    <div class="control-label">

      <button
        class="control"
        onclick="openChatPanel()">
        💬
      </button>

      <small>چت</small>

    </div>


    <div class="control-label">

      <button
        class="control"
        onclick="openMembersPanel()">
        👥
      </button>

      <small>اعضا</small>

    </div>


    <div class="room-more">

      <button
        class="control"
        onclick="toggleMoreMenu()">
        ⋮
      </button>

      <div id="moreMenu" class="more-menu">

        <button onclick="requestMic()">
          🙋 درخواست صحبت
        </button>

        <button onclick="requestCamera()">
          🙋 درخواست دوربین
        </button>

/* =========================================================
   SUPABASE ROOM CHANNEL
========================================================= */

function createRoomChannel(){

  if(roomChannel){

    try{
      roomChannel.unsubscribe();
    }catch(e){}

  }


  const roomId =
    String(currentClass.id);


  roomChannel =
    supabaseClient.channel(
      "lesson-room-" + roomId,
      {
        config:{
          broadcast:{
            self:false
          }
        }
      }
    );


  /*
    مهم:
    تمام listenerها قبل از subscribe ثبت می‌شوند.
  */


  roomChannel.on(
    "broadcast",
    {event:"join"},
    async ({payload})=>{

      if(
        payload.userId === currentUser.id
      )
        return;


      remoteUsers[payload.userId] =
        payload;


      await createPeer(
        payload.userId,
        true,
        payload.name
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {event:"offer"},
    async ({payload})=>{

      if(
        payload.to !== currentUser.id
      )
        return;


      const peer =
        getOrCreatePeer(
          payload.from,
          payload.name
        );


      await peer.setRemoteDescription(
        new RTCSessionDescription(
          payload.description
        )
      );


      const answer =
        await peer.createAnswer();


      await peer.setLocalDescription(
        answer
      );


      sendBroadcast(
        "answer",
        {
          to:payload.from,
          from:currentUser.id,
          name:currentUser.name,
          description:answer
        }
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {event:"answer"},
    async ({payload})=>{

      if(
        payload.to !== currentUser.id
      )
        return;


      const peer =
        peers[payload.from]?.pc;

      if(!peer)
        return;


      await peer.setRemoteDescription(
        new RTCSessionDescription(
          payload.description
        )
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {event:"ice"},
    async ({payload})=>{

      if(
        payload.to !== currentUser.id
      )
        return;


      const peer =
        peers[payload.from]?.pc;

      if(!peer)
        return;


      try{

        await peer.addIceCandidate(
          new RTCIceCandidate(
            payload.candidate
          )
        );

      }catch(e){

        console.log(
          "ICE error",
          e
        );

      }

    }
  );


  roomChannel.on(
    "broadcast",
    {event:"leave"},
    ({payload})=>{

      if(
        payload.userId === currentUser.id
      )
        return;


      closePeer(
        payload.userId
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {event:"board"},
    ({payload})=>{

      receiveBoardAction(
        payload
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {event:"chat"},
    ({payload})=>{

      addChatMessage(
        payload.name,
        payload.text
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {event:"request"},
    ({payload})=>{

      if(
        currentUser.role !== "teacher" &&
        currentUser.role !== "admin"
      )
        return;


      if(payload.type === "mic"){

        toast(
          payload.name +
          " درخواست صحبت کردن داده است."
        );

      }

      if(payload.type === "camera"){

        toast(
          payload.name +
          " درخواست روشن کردن دوربین داده است."
        );

      }

    }
  );


  roomChannel.subscribe(
    status=>{

      if(status === "SUBSCRIBED"){

        $("roomStatus").innerText =
          "متصل به کلاس • " +
          currentUser.name;


        sendBroadcast(
          "join",
          {
            userId:currentUser.id,
            name:
              currentUser.name ||
              currentUser.username
          }
        );

      }

    }
  );

}


/* =========================================================
   BROADCAST
========================================================= */

function sendBroadcast(
  event,
  payload
){

  if(!roomChannel)
    return;


  roomChannel.send({
    type:"broadcast",
    event:event,
    payload:payload
  });

}


/* =========================================================
   WEBRTC
========================================================= */

function getOrCreatePeer(
  userId,
  name
){

  if(peers[userId]?.pc)
    return peers[userId].pc;


  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        },
        {
          urls:"stun:stun1.l.google.com:19302"
        }
      ]

    });


  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{

        pc.addTrack(
          track,
          localStream
        );

      });

  }


  pc.onicecandidate =
    event=>{

      if(!event.candidate)
        return;


      sendBroadcast(
        "ice",
        {
          to:userId,
          from:currentUser.id,
          candidate:event.candidate
        }
      );

    };


  pc.ontrack =
    event=>{

      const stream =
        event.streams[0];

      if(!stream)
        return;


      addVideo(
        userId,
        name || "کاربر",
        stream
      );

    };


  pc.onconnectionstatechange =
    ()=>{

      const state =
        pc.connectionState;


      if(
        state === "failed" ||
        state === "closed" ||
        state === "disconnected"
      ){

        setTimeout(()=>{

          if(
            pc.connectionState !==
            "connected"
          ){

            closePeer(userId);

          }

        },3000);

      }

    };


  peers[userId] = {
    pc:pc,
    name:name
  };


  return pc;

}


async function createPeer(
  userId,
  makeOffer,
  name
){

  const pc =
    getOrCreatePeer(
      userId,
      name
    );


  if(!makeOffer)
    return;


  const offer =
    await pc.createOffer();


  await pc.setLocalDescription(
    offer
  );


  sendBroadcast(
    "offer",
    {
      to:userId,
      from:currentUser.id,
      name:
        currentUser.name ||
        currentUser.username,
      description:offer
    }
  );

}


function closePeer(userId){

  if(peers[userId]?.pc){

    try{
      peers[userId].pc.close();
    }catch(e){}

  }


  delete peers[userId];

  delete remoteUsers[userId];

  removeVideo(userId);

}


/* =========================================================
   CAMERA
========================================================= */

async function flipCamera(){

  if(!localStream){

    toast("ابتدا دوربین را روشن کنید.");

    return;
  }


  if(isScreenSharing){

    toast(
      "ابتدا اشتراک صفحه را متوقف کنید."
    );

    return;

  }


  const oldTrack =
    localStream.getVideoTracks()[0];


  cameraFacing =
    cameraFacing === "user"
      ? "environment"
      : "user";


  let newStream;


  try{

    newStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            exact:cameraFacing
          },
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:false
      });

  }catch(error){

    try{

      newStream =
        await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:cameraFacing
          },
          audio:false
        });

    }catch(e){

      toast(
        "دوربین دوم روی این گوشی در دسترس نیست."
      );

      cameraFacing =
        cameraFacing === "user"
          ? "environment"
          : "user";

      return;

    }

  }


  const newTrack =
    newStream.getVideoTracks()[0];


  if(!newTrack)
    return;


  originalCameraTrack =
    newTrack;


  /*
    مهم‌ترین قسمت:
    ترک ویدئو برای تک‌تک peerها عوض می‌شود.
  */

  Object.values(peers)
    .forEach(item=>{

      const sender =
        item.pc
          .getSenders()
          .find(
            s=>s.track &&
            s.track.kind === "video"
          );


      if(sender){

        sender.replaceTrack(
          newTrack
        );

      }else{

        item.pc.addTrack(
          newTrack,
          new MediaStream([
            newTrack
          ])
        );

      }

    });


  if(oldTrack){

    localStream.removeTrack(
      oldTrack
    );

    oldTrack.stop();

  }


  localStream.addTrack(
    newTrack
  );


  const video =
    document.querySelector(
      "#video_local video"
    );


  if(video){

    video.srcObject =
      localStream;

  }


  toast(
    cameraFacing === "user"
      ? "دوربین جلو فعال شد."
      : "دوربین اصلی فعال شد."
  );

}


async function toggleCamera(){

  if(!localStream){

    try{

      await startLocalMedia();

    }catch(e){

      toast("دسترسی دوربین ممکن نیست.");

    }

    return;
  }


  const tracks =
    localStream.getVideoTracks();


  if(!tracks.length){

    try{

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:cameraFacing
          },
          audio:false
        });


      const track =
        stream.getVideoTracks()[0];


      localStream.addTrack(track);


      Object.values(peers)
        .forEach(item=>{

          const sender =
            item.pc
              .getSenders()
              .find(
                s=>s.track?.kind === "video"
              );


          if(sender)
            sender.replaceTrack(track);

        });


      originalCameraTrack =
        track;


    }catch(e){

      toast("دوربین قابل فعال‌سازی نیست.");

    }


    updateControlStates();

    return;

  }


  cameraEnabled =
    !tracks[0].enabled;


  tracks.forEach(
    t=>t.enabled=cameraEnabled
  );


  updateControlStates();

}

}

/* =========================================================
   SCREEN SHARE
========================================================= */

async function shareScreen(){

  if(!navigator.mediaDevices?.getDisplayMedia){

    toast(
      "مرورگر این گوشی اشتراک صفحه را پشتیبانی نمی‌کند."
    );

    return;

  }


  if(isScreenSharing){

    await stopScreenShare();

    return;

  }


  try{

    const displayStream =
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:false
      });


    screenTrack =
      displayStream.getVideoTracks()[0];


    if(!screenTrack)
      return;


    isScreenSharing = true;


    const senders = [];


    Object.values(peers)
      .forEach(item=>{

        const sender =
          item.pc
            .getSenders()
            .find(
              s=>s.track?.kind === "video"
            );


        if(sender){

          sender.replaceTrack(
            screenTrack
          );

          senders.push(sender);

        }

      });


    const localVideo =
      document.querySelector(
        "#video_local video"
      );


    if(localVideo){

      localVideo.srcObject =
        new MediaStream([
          screenTrack
        ]);

    }


    screenTrack.onended =
      ()=>{

        stopScreenShare();

      };


    toast(
      "اشتراک صفحه فعال شد."
    );

  }catch(error){

    console.log(error);

    toast(
      "اشتراک صفحه لغو شد یا مرورگر اجازه نداد."
    );

  }

}


async function stopScreenShare(){

  if(!isScreenSharing)
    return;


  isScreenSharing = false;


  const cameraTrack =
    originalCameraTrack ||
    localStream?.getVideoTracks()[0];


  if(cameraTrack){

    Object.values(peers)
      .forEach(item=>{

        const sender =
          item.pc
            .getSenders()
            .find(
              s=>s.track?.kind === "video"
            );


        if(sender){

          sender.replaceTrack(
            cameraTrack
          );

        }

      });


    const localVideo =
      document.querySelector(
        "#video_local video"
      );


    if(localVideo){

      localVideo.srcObject =
        localStream;

    }

  }


  if(screenTrack){

    try{
      screenTrack.stop();
    }catch(e){}

    screenTrack = null;

  }


  toast(
    "دوربین دوباره فعال شد."
  );

}

/* =========================================================
   BOARD RESIZE
========================================================= */

function resizeBoard(){

  const rect =
    boardCanvas.getBoundingClientRect();


  if(
    rect.width <= 0 ||
    rect.height <= 0
  )
    return;


  const oldWidth =
    boardCanvas.width / (boardDpr || 1);

  const oldHeight =
    boardCanvas.height / (boardDpr || 1);


  boardDpr =
    Math.max(
      1,
      Math.min(
        3,
        window.devicePixelRatio || 1
      )
    );


  boardCanvas.width =
    Math.floor(
      rect.width * boardDpr
    );

  boardCanvas.height =
    Math.floor(
      rect.height * boardDpr
    );


  boardCtx.setTransform(
    boardDpr,
    0,
    0,
    boardDpr,
    0,
    0
  );


  /*
    چون اشیا در مختصات CSS نگهداری می‌شوند،
    resize باعث پاک‌شدن تخته نمی‌شود.
  */

  redrawBoard();

}


window.addEventListener(
  "resize",
  ()=>{
    if(
      !$("boardScreen")
        .classList.contains("hidden")
    )
      resizeBoard();
  }
);


/* =========================================================
   BOARD COORDINATES
========================================================= */

function boardPoint(e){

  const rect =
    boardCanvas.getBoundingClientRect();


  let clientX;
  let clientY;


  if(
    e.touches &&
    e.touches[0]
  ){

    clientX =
      e.touches[0].clientX;

    clientY =
      e.touches[0].clientY;

  }else{

    clientX =
      e.clientX;

    clientY =
      e.clientY;

  }


  return {
    x:clientX - rect.left,
    y:clientY - rect.top
  };

}


/* =========================================================
   BOARD TOOLS
========================================================= */

function setBoardTool(tool){

    .querySelectorAll(".board-tool[data-tool]")

      btn.classList.toggle(

function getBoardStyle(){

  return {

    color:
      $("boardColor").value,

    size:
      Number(
        $("boardSize").value
      ),

    textSize:
      Number(
        $("boardTextSize").value
      )

/* =========================================================
   BOARD EVENTS
========================================================= */

function boardPointerDown(e){

  e.preventDefault();


  const p =
    boardPoint(e);


  if(boardTool === "select"){

    const found =
      findObjectAt(
        p.x,
        p.y
      );


    if(found){

      selectedObjectId =
        found.id;

      draggingObject = true;

      dragOffset = {
        x:p.x-found.x,
        y:p.y-found.y
      };


      redrawBoard();

    }


    return;
  }


  if(boardTool === "text"){

    const text =
      prompt(
        "متن را وارد کنید:"
      );


    if(!text)
      return;


    const style =
      getBoardStyle();


    const obj = {

      id:randomId(),

      type:"text",

      x:p.x,

      y:p.y,

      text:text,

      color:style.color,

      size:style.textSize

    };


    commitBoardObject(obj);

    return;

  }


  drawing = true;

  startPoint = p;


  if(boardTool === "pen"){

    currentObject = {

      id:randomId(),

      type:"pen",

      points:[p],

      color:getBoardStyle().color,

      size:getBoardStyle().size

    };

  }else{

    currentObject = {

      id:randomId(),

      type:boardTool,

      x:p.x,

      y:p.y,

      x2:p.x,

      y2:p.y,

      color:getBoardStyle().color,

      size:getBoardStyle().size

    };

  }

}


function boardPointerMove(e){

  e.preventDefault();


  const p =
    boardPoint(e);


  if(
    boardTool === "select" &&
    draggingObject &&
    selectedObjectId
  ){

    const obj =
      boardObjects.find(
        o=>o.id === selectedObjectId
      );


    if(!obj)
      return;


    const dx =
      p.x -
      dragOffset.x -
      obj.x;


    const dy =
      p.y -
      dragOffset.y -
      obj.y;


    moveObject(
      obj,
      dx,
      dy
    );


    dragOffset = {
      x:p.x-obj.x,
      y:p.y-obj.y
    };


    redrawBoard();

    return;

  }


  if(!drawing)
    return;


  if(boardTool === "pen"){

    currentObject.points.push(p);

  }else{

    currentObject.x2 =
      p.x;

    currentObject.y2 =
      p.y;

  }


  redrawBoard(true);

}


function boardPointerUp(e){

  e.preventDefault();


  if(
    boardTool === "select" &&
    draggingObject
  ){

    draggingObject = false;

    if(selectedObjectId){

      broadcastBoard({
        action:"update",
        object:
          boardObjects.find(
            o=>o.id === selectedObjectId
          )
      });

    }

    return;

  }


  if(!drawing)
    return;


  drawing = false;


  if(
    !currentObject
  )
    return;


  if(boardTool === "eraser"){

    const p =
      boardPoint(e);


    const found =
      findObjectAt(
        p.x,
        p.y
      );


    if(found){

      removeBoardObject(
        found.id
      );

    }


    currentObject = null;

    redrawBoard();

    return;

  }


  boardObjects.push(
    currentObject
  );


  boardUndoStack.push(
    {
      action:"add",
      object:
        JSON.parse(
          JSON.stringify(
            currentObject
          )
        )
    }
  );


  boardRedoStack = [];


  broadcastBoard({

    action:"add",

    object:
      JSON.parse(
        JSON.stringify(
          currentObject
        )
      )

  });


  currentObject = null;

  redrawBoard();

}

/* =========================================================
   BOARD OBJECTS
========================================================= */

function commitBoardObject(obj){

  boardObjects.push(obj);

  boardUndoStack.push({
    action:"add",
    object:
      JSON.parse(
        JSON.stringify(obj)
      )
  });

  boardRedoStack = [];

  broadcastBoard({
    action:"add",
    object:
      JSON.parse(
        JSON.stringify(obj)
      )
  });

  redrawBoard();

}


function removeBoardObject(id){

  const index =
    boardObjects.findIndex(
      o=>o.id === id
    );


  if(index < 0)
    return;


  const obj =
    boardObjects[index];


  boardObjects.splice(
    index,
    1
  );


  boardUndoStack.push({
    action:"remove",
    object:
      JSON.parse(
        JSON.stringify(obj)
      )
  });


  boardRedoStack = [];


  broadcastBoard({
    action:"remove",
    id:id
  });


  redrawBoard();

}


function moveObject(
  obj,
  dx,
  dy
){

  if(
    obj.type === "pen"
  ){

    obj.points =
      obj.points.map(
        p=>({
          x:p.x+dx,
          y:p.y+dy
        })
      );

    return;

  }


  obj.x += dx;
  obj.y += dy;


  if(
    typeof obj.x2 === "number"
  ){

    obj.x2 += dx;
    obj.y2 += dy;

  }

}


/* =========================================================
   FIND OBJECT
========================================================= */

function findObjectAt(x,y){

  for(
    let i=boardObjects.length-1;
    i>=0;
    i--
  ){

    const o =
      boardObjects[i];


    if(o.type === "text"){

      boardCtx.font =
        `${o.size}px Tahoma`;

      const width =
        boardCtx.measureText(
          o.text
        ).width;


      if(
        x >= o.x &&
        x <= o.x+width &&
        y >= o.y-o.size &&
        y <= o.y+10
      ){

        return o;

      }

    }


    if(
      o.type === "rect" ||
      o.type === "circle"
    ){

      const minX =
        Math.min(o.x,o.x2);

      const maxX =
        Math.max(o.x,o.x2);

      const minY =
        Math.min(o.y,o.y2);

      const maxY =
        Math.max(o.y,o.y2);


      if(
        x >= minX &&
        x <= maxX &&
        y >= minY &&
        y <= maxY
      ){

        return o;

      }

    }


    if(o.type === "line"){

      const d =
        pointLineDistance(
          x,
          y,
          o.x,
          o.y,
          o.x2,
          o.y2
        );


      if(d < 15)
        return o;

    }

  }


  return null;

}


function pointLineDistance(
  px,
  py,
  x1,
  y1,
  x2,
  y2
){

  const A =
    px-x1;

  const B =
    py-y1;

  const C =
    x2-x1;

  const D =
    y2-y1;


  const dot =
    A*C+B*D;

  const len =
    C*C+D*D;


  let param =
    len !== 0
      ? dot/len
      : -1;


  let xx;
  let yy;


  if(param < 0){

    xx=x1;
    yy=y1;

  }else if(param > 1){

    xx=x2;
    yy=y2;

  }else{

    xx=x1+param*C;
    yy=y1+param*D;

  }


  const dx =
    px-xx;

  const dy =
    py-yy;


  return Math.sqrt(
    dx*dx+dy*dy
  );

}


/* =========================================================
   BOARD DRAW
========================================================= */

function redrawBoard(preview=false){

  if(!boardCanvas)
    return;


  const rect =
    boardCanvas.getBoundingClientRect();


  boardCtx.clearRect(
    0,
    0,
    rect.width,
    rect.height
  );


  boardCtx.lineCap =
    "round";

  boardCtx.lineJoin =
    "round";


  boardObjects.forEach(
    drawObject
  );


  if(
    preview &&
    currentObject
  ){

    drawObject(
      currentObject
    );

  }


  if(selectedObjectId){

    const obj =
      boardObjects.find(
        o=>o.id === selectedObjectId
      );


    if(obj)
      drawSelection(obj);

  }

}


function drawObject(o){

  if(!o)
    return;


  boardCtx.save();

  boardCtx.strokeStyle =
    o.color || "#111";

  boardCtx.fillStyle =
    o.color || "#111";

  boardCtx.lineWidth =
    o.size || 4;


  if(o.type === "pen"){

    if(!o.points.length){

      boardCtx.restore();

      return;

    }


    boardCtx.beginPath();

    boardCtx.moveTo(
      o.points[0].x,
      o.points[0].y
    );


    for(
      let i=1;
      i<o.points.length;
      i++
    ){

      boardCtx.lineTo(
        o.points[i].x,
        o.points[i].y
      );

    }


    boardCtx.stroke();

  }


  else if(o.type === "line"){

    boardCtx.beginPath();

    boardCtx.moveTo(
      o.x,
      o.y
    );

    boardCtx.lineTo(
      o.x2,
      o.y2
    );

    boardCtx.stroke();

  }


  else if(o.type === "rect"){

    boardCtx.strokeRect(
      o.x,
      o.y,
      o.x2-o.x,
      o.y2-o.y
    );

  }


  else if(o.type === "circle"){

    const rx =
      Math.abs(o.x2-o.x)/2;

    const ry =
      Math.abs(o.y2-o.y)/2;

    const cx =
      (o.x+o.x2)/2;

    const cy =
      (o.y+o.y2)/2;


    boardCtx.beginPath();

    boardCtx.ellipse(
      cx,
      cy,
      Math.max(rx,1),
      Math.max(ry,1),
      0,
      0,
      Math.PI*2
    );

    boardCtx.stroke();

  }


  else if(o.type === "text"){

    boardCtx.font =
      `${o.size}px Tahoma`;

    boardCtx.fillText(
      o.text,
      o.x,
      o.y
    );

  }


  boardCtx.restore();

}


function drawSelection(o){

  boardCtx.save();

  boardCtx.strokeStyle =
    "#1976d2";

  boardCtx.lineWidth =
    2;

  boardCtx.setLineDash(
    [6,4]
  );


  if(o.type === "text"){

    boardCtx.font =
      `${o.size}px Tahoma`;

    const width =
      boardCtx.measureText(
        o.text
      ).width;


    boardCtx.strokeRect(
      o.x-5,
      o.y-o.size-5,
      width+10,
      o.size+10
    );

  }else{

    const minX =
      Math.min(
        o.x,
        o.x2 ?? o.x
      );

    const maxX =
      Math.max(
        o.x,
        o.x2 ?? o.x
      );

    const minY =
      Math.min(
        o.y,
        o.y2 ?? o.y
      );

    const maxY =
      Math.max(
        o.y,
        o.y2 ?? o.y
      );


    boardCtx.strokeRect(
      minX-7,
      minY-7,
      maxX-minX+14,
      maxY-minY+14
    );

  }


  boardCtx.restore();

}


/* =========================================================
   BOARD BROADCAST
========================================================= */

function broadcastBoard(data){

  sendBroadcast(
    "board",
    {
      ...data,
      sender:currentUser.id
    }
  );

}


function receiveBoardAction(data){

  if(
    data.sender === currentUser.id
  )
    return;


  if(data.action === "add"){

    if(
      !boardObjects.some(
        o=>o.id === data.object.id
      )
    ){

      boardObjects.push(
        data.object
      );

    }

  }


  else if(data.action === "remove"){

    boardObjects =
      boardObjects.filter(
        o=>o.id !== data.id
      );

  }


  else if(data.action === "update"){

    const index =
      boardObjects.findIndex(
        o=>o.id === data.object.id
      );


    if(index >= 0){

      boardObjects[index] =
        data.object;

    }else{

      boardObjects.push(
        data.object
      );

    }

  }


  else if(data.action === "clear"){

    boardObjects = [];

  }


  redrawBoard();

}


/* =========================================================
   BOARD UNDO / REDO
========================================================= */

function boardUndo(){

  if(!boardUndoStack.length){

    toast("چیزی برای Undo وجود ندارد.");

    return;

  }


  const item =
    boardUndoStack.pop();


  if(item.action === "add"){

    boardObjects =
      boardObjects.filter(
        o=>o.id !== item.object.id
      );


    boardRedoStack.push(
      item
    );


    broadcastBoard({
      action:"remove",
      id:item.object.id
    });

  }


  else if(item.action === "remove"){

    boardObjects.push(
      item.object
    );


    boardRedoStack.push(
      item
    );


    broadcastBoard({
      action:"add",
      object:item.object
    });

  }


  redrawBoard();

}


function boardRedo(){

  if(!boardRedoStack.length){

    toast("چیزی برای Redo وجود ندارد.");

    return;

  }


  const item =
    boardRedoStack.pop();


  if(item.action === "add"){

    boardObjects.push(
      item.object
    );


    boardUndoStack.push(
      item
    );


    broadcastBoard({
      action:"add",
      object:item.object
    });

  }


  else if(item.action === "remove"){

    boardObjects =
      boardObjects.filter(
        o=>o.id !== item.object.id
      );


    boardUndoStack.push(
      item
    );


    broadcastBoard({
      action:"remove",
      id:item.object.id
    });

  }


  redrawBoard();

}


function clearBoard(){

  if(
    !confirm(
      "کل تخته برای همه اعضای کلاس پاک شود؟"
    )
  )
    return;


  boardObjects = [];

  boardUndoStack = [];

  boardRedoStack = [];


  broadcastBoard({
    action:"clear"
  });


  redrawBoard();

}


/* =========================================================
   ADMIN
========================================================= */

/*
  توجه:
  رمز admin001 فقط در رابط کاربری این فایل قرار گرفته.
  برای امنیت واقعی، تعیین role=admin باید در Supabase
  با RLS/RPC انجام شود و نباید به رمز سمت مرورگر اعتماد کرد.
*/

const ADMIN_PANEL_PASSWORD =
  "admin001";


function openAdmin(){

  if(
    currentUser.role !== "admin"
  ){

    const password =
      prompt(
        "رمز ورود پنل مدیریت:"
      );


    if(
      password !==
      ADMIN_PANEL_PASSWORD
    ){

      toast(
        "رمز پنل مدیریت اشتباه است."
      );

      return;

    }


    /*
      این قسمت نقش را در پروفایل تنظیم می‌کند.
      اگر RLS اجازه UPDATE ندهد، مدیر باید از
      داخل Supabase role را admin کند.
    */

    if(currentUser.id){

      supabaseClient
        .from("profiles")
        .update({
          role:"admin"
        })
        .eq(
          "id",
          currentUser.id
        )
        .then(({error})=>{

          if(error){

            console.log(
              "admin role update",
              error
            );

            toast(
              "رمز درست است ولی تغییر نقش توسط RLS اجازه داده نشد."
            );

            return;

          }


          currentUser.role =
            "admin";

          if(currentProfile)
            currentProfile.role =
              "admin";


          $("adminMenuButton")
            .classList.remove("hidden");

          $("teacherCreate")
            .classList.remove("hidden");

          showAdminPanel();

        });

      return;

    }

  }


  showAdminPanel();

}


function showAdminPanel(){

  $("adminPanel")
    .classList.remove("hidden");

  $("adminPanel")
    .scrollIntoView({
      behavior:"smooth"
    });

  loadAdminStats();

  adminTab(
    "users",
    document.querySelector(
      ".tab"
    )
  );

}


async function loadAdminStats(){

  const users =
    await supabaseClient
      .from("profiles")
      .select("id,role");


  const classes =
    await supabaseClient
      .from("meetings")
      .select("id");


  if(!users.error){

    const list =
      users.data || [];


    $("adminUsersCount").innerText =
      list.length;


    $("adminTeachersCount").innerText =
      list.filter(
        u=>u.role === "teacher"
      ).length;


    $("adminStudentsCount").innerText =
      list.filter(
        u=>u.role !== "teacher" &&
        u.role !== "admin"
      ).length;

  }


  if(!classes.error){

    $("adminClassesCount").innerText =
      (classes.data || []).length;

  }

}


async function adminTab(
  tab,
  button
){

  document
    .querySelectorAll(".tab")
    .forEach(
      b=>b.classList.remove("active")
    );


  if(button)
    button.classList.add("active");


  const content =
    $("adminContent");


  content.innerHTML =
    '<div class="empty">در حال دریافت...</div>';


  if(tab === "users"){

    const {data,error} =
      await supabaseClient
        .from("profiles")
        .select("*")
        .order("id");


    if(error){

      content.innerHTML =
        `<div class="notice error">
          ${escapeHtml(error.message)}
        </div>`;

      return;

    }


    content.innerHTML = `

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>نام</th>
              <th>نام کاربری</th>
              <th>نقش</th>
              <th>تغییر نقش</th>
            </tr>

          </thead>

          <tbody>

            ${(data || []).map(
              user=>`

                <tr>

                  <td>
                    ${escapeHtml(user.name || "-")}
                  </td>

                  <td>
                    ${escapeHtml(user.username || "-")}
                  </td>

                  <td>
                    ${roleFa(user.role)}
                  </td>

                  <td>

                    <select
                      onchange="changeUserRole('${user.id}',this.value)">

                      <option
                        value="student"
                        ${user.role==="student"?"selected":""}>
                        دانش‌آموز
                      </option>

                      <option
                        value="teacher"
                        ${user.role==="teacher"?"selected":""}>
                        معلم
                      </option>

                      <option
                        value="admin"
                        ${user.role==="admin"?"selected":""}>
                        مدیر
                      </option>

                    </select>

                  </td>

                </tr>

              `
            ).join("")}

          </tbody>

        </table>

      </div>

    `;

  }


  else if(tab === "classes"){

    const {data,error} =
      await supabaseClient
        .from("meetings")
        .select("*")
        .order("id",{ascending:false});


    if(error){

      content.innerHTML =
        `<div class="notice error">
          ${escapeHtml(error.message)}
        </div>`;

      return;

    }


    content.innerHTML = `

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>کلاس</th>
              <th>معلم</th>
              <th>عملیات</th>
            </tr>

          </thead>

          <tbody>

            ${(data || []).map(
              room=>`

                <tr>

                  <td>
                    ${escapeHtml(room.name)}
                  </td>

                  <td>
                    ${escapeHtml(room.owner_name || "-")}
                  </td>

                  <td>

                    <button
                      class="btn red"
                      onclick="deleteClass('${room.id}')">
                      حذف
                    </button>

                  </td>

                </tr>

              `
            ).join("")}

          </tbody>

        </table>

      </div>

    `;

  }


  else if(tab === "messages"){

    const {data,error} =
      await supabaseClient
        .from("messages")
        .select("*")
        .order("id",{ascending:false})
        .limit(100);


    if(error){

      content.innerHTML =
        `<div class="notice error">
          ${escapeHtml(error.message)}
        </div>`;

      return;

    }


    content.innerHTML = `

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>کاربر</th>
              <th>پیام</th>
            </tr>

          </thead>

          <tbody>

            ${(data || []).map(
              m=>`

                <tr>

                  <td>
                    ${escapeHtml(m.user_name || "-")}
                  </td>

                  <td>
                    ${escapeHtml(m.text || "")}
                  </td>

                </tr>

              `
            ).join("")}

          </tbody>

        </table>

      </div>

    `;

  }

}


async function changeUserRole(
  userId,
  role
){

  if(
    currentUser.role !== "admin"
  ){

    toast(
      "دسترسی مدیر لازم است."
    );

    return;

  }


  const {error} =
    await supabaseClient
      .from("profiles")
      .update({
        role:role
      })
      .eq(
        "id",
        userId
      );


  if(error){

    toast(
      error.message
    );

    return;

  }


  toast(
    "نقش کاربر تغییر کرد."
  );


  loadAdminStats();

}


async function deleteClass(id){

  if(
    !confirm(
      "این کلاس حذف شود؟"
    )
  )
    return;


  const {error} =
    await supabaseClient
      .from("meetings")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    toast(
      error.message
    );

    return;

  }


  toast(
    "کلاس حذف شد."
  );


  loadClasses();

  loadAdminStats();

  adminTab(
    "classes",
    document.querySelector(
      ".tab"
    )
  );

}


/* =========================================================
   AUTO LOGIN
========================================================= */

(async function(){

  const saved =
    localStorage.getItem(
      "lesson_user"
    );


  if(!saved)
    return;


  try{

    currentUser =
      JSON.parse(saved);


    await loadProfile();


    if(currentUser?.id){

      openApp();

    }

  }catch(e){

    localStorage.removeItem(
      "lesson_user"
    );

  }

})();
