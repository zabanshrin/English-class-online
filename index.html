<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>زبان شیرین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --honey:#c98a2c;
  --honey-dark:#a06e1f;
  --tea:#2f5d50;
  --tea-dark:#1f4038;
  --cream:#fff8ee;
  --paper:#fffdf9;
  --ink:#2b2118;
  --ink-soft:#6b5c4a;
  --line:#e7dcc8;
  --danger:#b3452f;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 6px 20px rgba(43,33,24,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:inherit;font-size:1rem;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--honey);color:#fff;}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:.75rem;
  padding:.85rem 1rem;
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.topbar .brand{
  font-weight:800;font-size:1.15rem;color:var(--tea-dark);
  display:flex;align-items:center;gap:.4rem;
}
.topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--honey);display:inline-block;}
.topbar .spacer{flex:1;}
.icon-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--paper);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink);
}
.icon-btn:active{background:var(--line);}

/* Hamburger */
.hamburger{width:22px;height:16px;position:relative;}
.hamburger span{position:absolute;right:0;left:0;height:2px;background:var(--ink);border-radius:2px;transition:.2s;}
.hamburger span:nth-child(1){top:0;}
.hamburger span:nth-child(2){top:7px;}
.hamburger span:nth-child(3){top:14px;}

.drawer-overlay{
  position:fixed;inset:0;background:rgba(43,33,24,.35);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;
}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;bottom:0;right:0;width:min(78vw,320px);
  background:var(--paper);z-index:51;
  transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;
  box-shadow:-8px 0 24px rgba(0,0,0,.15);
}
.drawer.open{transform:translateX(0);}
.drawer-head{padding:1.25rem 1.1rem;border-bottom:1px solid var(--line);}
.drawer-head .name{font-weight:700;font-size:1.05rem;}
.drawer-head .role{font-size:.8rem;color:var(--ink-soft);margin-top:.15rem;}
.drawer nav{flex:1;overflow-y:auto;padding:.5rem;}
.drawer nav a{
  display:flex;align-items:center;gap:.7rem;
  padding:.85rem .9rem;border-radius:var(--radius-sm);
  color:var(--ink);font-weight:500;
}
.drawer nav a.active{background:#f3ead6;color:var(--tea-dark);}
.drawer nav a:active{background:var(--line);}
.drawer .foot{padding:.9rem;border-top:1px solid var(--line);}
.btn-logout{width:100%;padding:.8rem;border-radius:var(--radius-sm);border:1px solid var(--line);background:transparent;color:var(--danger);font-weight:600;cursor:pointer;}

main{flex:1;padding:1.1rem 1rem 3rem;max-width:640px;margin:0 auto;width:100%;}

/* ---------- Generic UI ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem;box-shadow:var(--shadow);}
.card + .card{margin-top:.9rem;}
h1.page-title{font-size:1.4rem;font-weight:800;margin:.2rem 0 1rem;color:var(--tea-dark);}
.muted{color:var(--ink-soft);font-size:.9rem;}
.field{margin-bottom:.85rem;}
.field label{display:block;font-size:.85rem;color:var(--ink-soft);margin-bottom:.35rem;}
.field input,.field select,.field textarea{
  width:100%;padding:.75rem .85rem;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--honey);outline-offset:1px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.8rem 1.1rem;border-radius:var(--radius-sm);border:none;
  font-weight:700;cursor:pointer;width:100%;
}
.btn-primary{background:var(--honey);color:#fff;}
.btn-primary:active{background:var(--honey-dark);}
.btn-secondary{background:var(--tea);color:#fff;}
.btn-secondary:active{background:var(--tea-dark);}
.btn-outline{background:transparent;color:var(--tea-dark);border:1px solid var(--tea);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{width:auto;padding:.5rem .8rem;font-size:.85rem;}
.row{display:flex;gap:.6rem;}
.row > *{flex:1;}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem;border-bottom:1px solid var(--line);}
.tabs button{
  flex:1;background:none;border:none;padding:.7rem 0;font-weight:600;color:var(--ink-soft);
  border-bottom:2px solid transparent;cursor:pointer;
}
.tabs button.active{color:var(--tea-dark);border-color:var(--honey);}
.badge{display:inline-block;padding:.2rem .55rem;border-radius:99px;font-size:.72rem;font-weight:700;}
.badge-admin{background:#f0dcb8;color:var(--honey-dark);}
.badge-teacher{background:#dbe9e2;color:var(--tea-dark);}
.badge-student{background:#eee6f4;color:#6a4a94;}
.badge-active{background:#e1f0dc;color:#3a6b2e;}
.badge-closed{background:#f0dcd6;color:var(--danger);}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--ink-soft);}
.empty .big{font-size:2rem;margin-bottom:.4rem;}

.toast-wrap{position:fixed;bottom:1rem;right:1rem;left:1rem;z-index:100;display:flex;flex-direction:column;gap:.5rem;align-items:center;}
.toast{
  max-width:420px;width:100%;padding:.85rem 1rem;border-radius:var(--radius-sm);
  background:#2b2118;color:#fff;font-size:.9rem;box-shadow:var(--shadow);
  animation:toast-in .18s ease;
}
.toast.error{background:var(--danger);}
.toast.success{background:var(--tea-dark);}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--honey);animation:spin .7s linear infinite;margin:1.5rem auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.list-item{display:flex;align-items:center;gap:.8rem;padding:.9rem 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.list-item .title{font-weight:700;}
.list-item .sub{font-size:.82rem;color:var(--ink-soft);margin-top:.15rem;}
.list-item .side{margin-inline-start:auto;text-align:left;}

.auth-hero{text-align:center;padding:1.5rem 0 .5rem;}
.auth-hero .mark{font-size:2.4rem;margin-bottom:.3rem;}
.auth-hero h1{font-size:1.6rem;font-weight:800;color:var(--tea-dark);margin:.2rem 0 .15rem;}
.auth-hero p{color:var(--ink-soft);margin:0;font-size:.92rem;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;text-align:center;}
.stat .num{font-size:1.5rem;font-weight:800;color:var(--tea-dark);}
.stat .lbl{font-size:.78rem;color:var(--ink-soft);margin-top:.2rem;}

.modal-overlay{position:fixed;inset:0;background:rgba(43,33,24,.4);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
.modal{background:var(--paper);border-radius:18px 18px 0 0;padding:1.2rem;width:100%;max-width:480px;box-shadow:var(--shadow);}
@media(min-width:560px){.modal-overlay{align-items:center;}.modal{border-radius:var(--radius);}}

.switch-row{display:flex;align-items:center;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid var(--line);}
.switch-row:last-child{border-bottom:none;}
.switch{position:relative;width:44px;height:26px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer;}
.switch .track:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .track{background:var(--honey);}
.switch input:checked + .track:before{transform:translateX(-18px);}

body.dark{--cream:#20180f;--paper:#2a2117;--ink:#f3ead9;--ink-soft:#c2af92;--line:#40342390;background:var(--cream);}
</style>
</head>
<body>
<div id="app"></div>
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   زبان شیرین — Stage 1 (auth, roles, profile, classes, settings,
   notifications, admin panel). Classroom / WebRTC / whiteboard /
   chat / recording arrive in Stage 2 on top of this file.
   ============================================================ */

const SUPABASE_URL = "https://uqqumhmzndgyoigcqnti.supabase.co";
const SUPABASE_KEY = "sb_publishable_R3LAX7EYbdYUwjQRgkmesA_QJ2ZmPtD";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------------- Session ---------------- */
const SESSION_KEY = "zs_session";
function getSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }
  catch(e){ return null; }
}
function setSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
function clearSession(){ localStorage.removeItem(SESSION_KEY); }
function isLoggedIn(){ return !!getSession(); }
function isAdmin(){ return getSession()?.role === "admin"; }
function isTeacher(){ return getSession()?.role === "teacher"; }

/* ---------------- Toast ---------------- */
function toast(msg, type){
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3800);
}
function friendlyError(err){
  const msg = (err && (err.message || err.details || err.hint)) || "";
  const map = {
    username_taken: "این نام کاربری قبلاً ثبت شده است.",
    invalid_credentials: "نام کاربری یا رمز عبور اشتباه است.",
    not_found: "موردی یافت نشد.",
    wrong_password: "رمز کلاس اشتباه است.",
    meeting_closed: "این کلاس در حال حاضر بسته است.",
    meeting_full: "ظرفیت این کلاس تکمیل شده است.",
    not_authorized: "شما اجازه انجام این کار را ندارید.",
  };
  for(const key in map){ if(msg.includes(key)) return map[key]; }
  return msg || "خطایی رخ داد. دوباره تلاش کنید.";
}

/* ---------------- Router ---------------- */
const routes = {
  "": renderHome,
  "home": renderHome,
  "login": renderAuth,
  "profile": renderProfile,
  "classes": renderClasses,
  "create-class": renderCreateClass,
  "join-class": renderJoinClass,
  "settings": renderSettings,
  "notifications": renderNotifications,
  "journey": renderJourney,
  "admin": renderAdmin,
};

function currentRoute(){
  return (location.hash || "#home").slice(1).split("?")[0];
}
function navigate(route){ location.hash = "#" + route; }

window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", () => {
  applyTheme();
  route();
});

function route(){
  closeDrawer();
  const name = currentRoute();
  const protectedRoutes = ["profile","classes","create-class","join-class","settings","notifications","journey","admin"];
  if(protectedRoutes.includes(name) && !isLoggedIn()){
    navigate("login");
    return;
  }
  if(name === "admin" && !isAdmin()){
    toast("دسترسی به پنل مدیریت ندارید.", "error");
    navigate("home");
    return;
  }
  renderTopbar();
  renderDrawer();
  const fn = routes[name] || renderHome;
  fn();
}

/* ---------------- Shell: topbar + drawer ---------------- */
function renderTopbar(){
  const app = document.getElementById("app");
  const existing = document.getElementById("mainArea");
  document.querySelectorAll(".topbar").forEach(el => el.remove());
  const bar = document.createElement("div");
  bar.className = "topbar";
  bar.innerHTML = `
    <button class="icon-btn" id="menuBtn" aria-label="منو">
      <div class="hamburger"><span></span><span></span><span></span></div>
    </button>
    <div class="brand"><span class="dot"></span>زبان شیرین</div>
    <div class="spacer"></div>
    ${isLoggedIn() ? `<button class="icon-btn" id="bellBtn" aria-label="اعلان‌ها">🔔</button>` : ""}
  `;
  app.prepend(bar);
  document.getElementById("menuBtn").onclick = openDrawer;
  const bell = document.getElementById("bellBtn");
  if(bell) bell.onclick = () => navigate("notifications");

  if(!document.getElementById("mainArea")){
    const main = document.createElement("main");
    main.id = "mainArea";
    app.appendChild(main);
  }
}

function renderDrawer(){
  const drawer = document.getElementById("drawer");
  const s = getSession();
  const items = [
    {r:"home", label:"خانه", icon:"🏠", show:true},
    {r:"classes", label:"کلاس‌ها", icon:"📚", show:isLoggedIn()},
    {r:"create-class", label:"ساخت کلاس", icon:"➕", show:isLoggedIn() && (isAdmin()||isTeacher())},
    {r:"join-class", label:"ورود به کلاس", icon:"🔑", show:isLoggedIn()},
    {r:"journey", label:"سفر یادگیری", icon:"🌱", show:isLoggedIn()},
    {r:"profile", label:"پروفایل", icon:"👤", show:isLoggedIn()},
    {r:"settings", label:"تنظیمات", icon:"⚙️", show:isLoggedIn()},
    {r:"notifications", label:"اعلان‌ها", icon:"🔔", show:isLoggedIn()},
    {r:"admin", label:"پنل مدیریت", icon:"🛠️", show:isAdmin()},
  ];
  const active = currentRoute();
  drawer.innerHTML = `
    <div class="drawer-head">
      ${ isLoggedIn()
        ? `<div class="name">${escapeHtml(s.name)}</div><div class="role">${roleLabel(s.role)}</div>`
        : `<div class="name">مهمان</div><div class="role muted">وارد نشده‌اید</div>` }
    </div>
    <nav>
      ${items.filter(i=>i.show).map(i => `<a href="#${i.r}" class="${active===i.r?'active':''}"><span>${i.icon}</span><span>${i.label}</span></a>`).join("")}
      ${!isLoggedIn() ? `<a href="#login"><span>🔓</span><span>ورود / ثبت‌نام</span></a>` : ""}
    </nav>
    <div class="foot">
      ${isLoggedIn() ? `<button class="btn-logout" id="logoutBtn">خروج از حساب</button>` : ""}
    </div>
  `;
  const logoutBtn = document.getElementById("logoutBtn");
  if(logoutBtn) logoutBtn.onclick = () => {
    clearSession();
    toast("از حساب خارج شدید.", "success");
    navigate("home");
  };
  document.querySelectorAll(".drawer nav a").forEach(a => a.addEventListener("click", closeDrawer));
}

function openDrawer(){
  document.getElementById("drawer").classList.add("open");
  document.getElementById("drawerOverlay").classList.add("open");
}
function closeDrawer(){
  document.getElementById("drawer")?.classList.remove("open");
  document.getElementById("drawerOverlay")?.classList.remove("open");
}
document.getElementById("drawerOverlay").addEventListener("click", closeDrawer);

function roleLabel(r){
  return {admin:"مدیر", teacher:"مدرس", student:"دانش‌آموز"}[r] || r;
}
function roleBadge(r){
  return `<span class="badge badge-${r}">${roleLabel(r)}</span>`;
}
function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function mainEl(){ return document.getElementById("mainArea"); }

/* ---------------- Theme ---------------- */
function applyTheme(){
  const dark = localStorage.getItem("zs_theme") === "dark";
  document.body.classList.toggle("dark", dark);
}
function setTheme(dark){
  localStorage.setItem("zs_theme", dark ? "dark" : "light");
  applyTheme();
}

/* ---------------- Home ---------------- */
function renderHome(){
  const s = getSession();
  mainEl().innerHTML = `
    <div class="auth-hero">
      <div class="mark">🍯</div>
      <h1>زبان شیرین</h1>
      <p>یادگیری زبان، شیرین‌تر از همیشه — با کلاس‌های زنده و تمرین واقعی.</p>
    </div>
    ${ isLoggedIn() ? `
      <div class="stat-grid">
        <div class="stat"><div class="num" id="statClasses">–</div><div class="lbl">کلاس‌های فعال</div></div>
        <div class="stat"><div class="num">${roleLabel(s.role)}</div><div class="lbl">نقش شما</div></div>
      </div>
      <div class="card">
        <div class="row">
          <button class="btn btn-primary" onclick="navigate('classes')">مشاهده کلاس‌ها</button>
          <button class="btn btn-outline" onclick="navigate('join-class')">ورود با رمز</button>
        </div>
      </div>
    ` : `
      <div class="card">
        <p class="muted" style="margin-top:0">برای دیدن کلاس‌ها و شرکت در جلسات آنلاین، وارد حساب خود شوید.</p>
        <button class="btn btn-primary" onclick="navigate('login')">ورود / ثبت‌نام</button>
      </div>
    `}
  `;
  if(isLoggedIn()){
    db.rpc("get_meetings").then(({data, error}) => {
      if(!error && data) document.getElementById("statClasses").textContent = data.filter(m=>m.status==="active").length;
    });
  }
}

/* ---------------- Auth ---------------- */
function renderAuth(){
  mainEl().innerHTML = `
    <div class="auth-hero">
      <div class="mark">🍯</div>
      <h1>خوش آمدید</h1>
      <p>برای شروع، وارد شوید یا حساب جدید بسازید.</p>
    </div>
    <div class="tabs">
      <button id="tabLogin" class="active">ورود</button>
      <button id="tabRegister">ثبت‌نام</button>
    </div>
    <div class="card" id="authCard"></div>
  `;
  document.getElementById("tabLogin").onclick = () => switchAuthTab("login");
  document.getElementById("tabRegister").onclick = () => switchAuthTab("register");
  switchAuthTab("login");
}
function switchAuthTab(which){
  document.getElementById("tabLogin").classList.toggle("active", which==="login");
  document.getElementById("tabRegister").classList.toggle("active", which==="register");
  const card = document.getElementById("authCard");
  if(which === "login"){
    card.innerHTML = `
      <div class="field"><label>نام کاربری</label><input id="loginUsername" autocomplete="username"></div>
      <div class="field"><label>رمز عبور</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="loginBtn">ورود</button>
    `;
    document.getElementById("loginBtn").onclick = doLogin;
  } else {
    card.innerHTML = `
      <div class="field"><label>نام کامل</label><input id="regName" autocomplete="name"></div>
      <div class="field"><label>نام کاربری</label><input id="regUsername" autocomplete="username"></div>
      <div class="field"><label>رمز عبور</label><input id="regPassword" type="password" autocomplete="new-password"></div>
      <button class="btn btn-primary" id="regBtn">ساخت حساب</button>
    `;
    document.getElementById("regBtn").onclick = doRegister;
  }
}
async function doLogin(){
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  if(!username || !password){ toast("نام کاربری و رمز عبور را وارد کنید.", "error"); return; }
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "در حال ورود...";
  const {data, error} = await db.rpc("login_username", {p_username: username, p_password: password});
  btn.disabled = false; btn.textContent = "ورود";
  if(error){ toast(friendlyError(error), "error"); return; }
  const row = Array.isArray(data) ? data[0] : data;
  if(!row){ toast("نام کاربری یا رمز عبور اشتباه است.", "error"); return; }
  setSession({id: row.id, username: row.username, name: row.name, role: row.role});
  toast("خوش آمدید، " + row.name, "success");
  navigate("home");
}
async function doRegister(){
  const name = document.getElementById("regName").value.trim();
  const username = document.getElementById("regUsername").value.trim();
  const password = document.getElementById("regPassword").value;
  if(!name || !username || !password){ toast("همه فیلدها را پر کنید.", "error"); return; }
  if(password.length < 6){ toast("رمز عبور باید حداقل ۶ کاراکتر باشد.", "error"); return; }
  const btn = document.getElementById("regBtn");
  btn.disabled = true; btn.textContent = "در حال ثبت‌نام...";
  const {data, error} = await db.rpc("register_username", {p_name: name, p_username: username, p_password: password});
  btn.disabled = false; btn.textContent = "ساخت حساب";
  if(error){ toast(friendlyError(error), "error"); return; }
  const row = Array.isArray(data) ? data[0] : data;
  setSession({id: row.id, username: row.username, name: row.name, role: row.role});
  toast("حساب شما ساخته شد!", "success");
  navigate("home");
}

/* ---------------- Profile ---------------- */
function renderProfile(){
  const s = getSession();
  mainEl().innerHTML = `
    <h1 class="page-title">پروفایل</h1>
    <div class="card">
      <div class="field"><label>نام کاربری</label><input value="${escapeHtml(s.username)}" disabled></div>
      <div class="field"><label>نام کامل</label><input id="profName" value="${escapeHtml(s.name)}"></div>
      <div class="field"><label>نقش</label><div>${roleBadge(s.role)}</div></div>
      <button class="btn btn-primary" id="saveProfileBtn">ذخیره تغییرات</button>
    </div>
  `;
  document.getElementById("saveProfileBtn").onclick = async () => {
    const name = document.getElementById("profName").value.trim();
    if(!name){ toast("نام نمی‌تواند خالی باشد.", "error"); return; }
    const {error} = await db.rpc("update_profile", {p_user_id: s.id, p_name: name});
    if(error){ toast(friendlyError(error), "error"); return; }
    setSession({...s, name});
    toast("پروفایل به‌روزرسانی شد.", "success");
    renderDrawer();
  };
}

/* ---------------- Classes ---------------- */
async function renderClasses(){
  mainEl().innerHTML = `<h1 class="page-title">کلاس‌ها</h1><div class="spinner"></div>`;
  const {data, error} = await db.rpc("get_meetings");
  if(error){ mainEl().innerHTML += `<div class="card">${friendlyError(error)}</div>`; return; }
  const list = data || [];
  mainEl().innerHTML = `
    <h1 class="page-title">کلاس‌ها</h1>
    ${(isAdmin()||isTeacher()) ? `<button class="btn btn-primary" style="margin-bottom:1rem" onclick="navigate('create-class')">➕ ساخت کلاس جدید</button>` : ""}
    <div class="card">
      ${ list.length === 0 ? `<div class="empty"><div class="big">📭</div>هنوز کلاسی ساخته نشده است.</div>` :
        list.map(m => `
          <div class="list-item">
            <div>
              <div class="title">${escapeHtml(m.name)}</div>
              <div class="sub">${escapeHtml(m.description || "بدون توضیحات")} · ${m.member_count}/${m.capacity} نفر</div>
            </div>
            <div class="side">
              <span class="badge badge-${m.status}">${m.status === "active" ? "فعال" : "بسته"}</span><br>
              <button class="btn btn-outline btn-sm" style="margin-top:.4rem" onclick="navigate('join-class')">ورود</button>
            </div>
          </div>
        `).join("")
      }
    </div>
  `;
}

/* ---------------- Create class ---------------- */
function renderCreateClass(){
  if(!(isAdmin()||isTeacher())){
    mainEl().innerHTML = `<div class="card">فقط مدرس‌ها و مدیر می‌توانند کلاس بسازند.</div>`;
    return;
  }
  mainEl().innerHTML = `
    <h1 class="page-title">ساخت کلاس</h1>
    <div class="card">
      <div class="field"><label>نام کلاس</label><input id="ccName" placeholder="مثلاً Family 4"></div>
      <div class="field"><label>توضیحات</label><textarea id="ccDesc" rows="3"></textarea></div>
      <div class="field"><label>رمز کلاس</label><input id="ccPass" type="text"></div>
      <div class="row">
        <div class="field"><label>ظرفیت</label><input id="ccCap" type="number" value="10" min="1"></div>
        <div class="field"><label>وضعیت</label>
          <select id="ccStatus"><option value="active">فعال</option><option value="closed">بسته</option></select>
        </div>
      </div>
      <button class="btn btn-primary" id="ccBtn">ساخت کلاس</button>
    </div>
  `;
  document.getElementById("ccBtn").onclick = async () => {
    const s = getSession();
    const name = document.getElementById("ccName").value.trim();
    const description = document.getElementById("ccDesc").value.trim();
    const password = document.getElementById("ccPass").value;
    const capacity = parseInt(document.getElementById("ccCap").value, 10) || 10;
    const status = document.getElementById("ccStatus").value;
    if(!name || !password){ toast("نام کلاس و رمز کلاس الزامی است.", "error"); return; }
    const btn = document.getElementById("ccBtn");
    btn.disabled = true; btn.textContent = "در حال ساخت...";
    const {error} = await db.rpc("create_meeting", {
      p_capacity: capacity, p_description: description, p_name: name,
      p_password: password, p_status: status, p_owner_id: s.id
    });
    btn.disabled = false; btn.textContent = "ساخت کلاس";
    if(error){ toast(friendlyError(error), "error"); return; }
    toast("کلاس ساخته شد.", "success");
    navigate("classes");
  };
}

/* ---------------- Join class ---------------- */
async function renderJoinClass(){
  mainEl().innerHTML = `<h1 class="page-title">ورود به کلاس</h1><div class="spinner"></div>`;
  const {data, error} = await db.rpc("get_meetings");
  const list = (data || []).filter(m => m.status === "active");
  mainEl().innerHTML = `
    <h1 class="page-title">ورود به کلاس</h1>
    <div class="card">
      <div class="field">
        <label>انتخاب کلاس</label>
        <select id="jcMeeting">
          ${ error || list.length===0 ? `<option value="">کلاسی برای ورود موجود نیست</option>` :
            list.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join("") }
        </select>
      </div>
      <div class="field"><label>رمز کلاس</label><input id="jcPass" type="password"></div>
      <button class="btn btn-primary" id="jcBtn">ورود به کلاس</button>
    </div>
  `;
  document.getElementById("jcBtn").onclick = async () => {
    const s = getSession();
    const meetingId = document.getElementById("jcMeeting").value;
    const password = document.getElementById("jcPass").value;
    if(!meetingId){ toast("یک کلاس انتخاب کنید.", "error"); return; }
    if(!password){ toast("رمز کلاس را وارد کنید.", "error"); return; }
    const btn = document.getElementById("jcBtn");
    btn.disabled = true; btn.textContent = "در حال بررسی...";
    const {data, error} = await db.rpc("join_meeting_with_password", {
      p_meeting_id: meetingId, p_password: password, p_user_id: s.id
    });
    btn.disabled = false; btn.textContent = "ورود به کلاس";
    if(error){ toast(friendlyError(error), "error"); return; }
    const row = Array.isArray(data) ? data[0] : data;
    toast("رمز درست بود! فضای کلاس آنلاین (WebRTC/چت/تخته) در مرحله بعد اضافه می‌شود.", "success");
    // Stage 2 will route here to a full #classroom/<id> immersive view.
    console.log("Joined meeting, ready for classroom stage:", row);
  };
}

/* ---------------- Settings ---------------- */
function renderSettings(){
  const dark = localStorage.getItem("zs_theme") === "dark";
  mainEl().innerHTML = `
    <h1 class="page-title">تنظیمات</h1>
    <div class="card">
      <div class="switch-row">
        <div><div class="title" style="font-weight:600">حالت شب</div><div class="muted">نمایش تیره برای چشمان راحت‌تر</div></div>
        <label class="switch"><input type="checkbox" id="darkToggle" ${dark?"checked":""}><span class="track"></span></label>
      </div>
      <div class="switch-row">
        <div><div class="title" style="font-weight:600">اعلان‌های کلاس</div><div class="muted">اطلاع‌رسانی شروع کلاس‌ها</div></div>
        <label class="switch"><input type="checkbox" id="notifToggle" checked><span class="track"></span></label>
      </div>
    </div>
  `;
  document.getElementById("darkToggle").onchange = (e) => setTheme(e.target.checked);
  document.getElementById("notifToggle").onchange = (e) => {
    localStorage.setItem("zs_notif_pref", e.target.checked ? "on" : "off");
    toast("تنظیمات ذخیره شد.", "success");
  };
}

/* ---------------- Notifications ---------------- */
async function renderNotifications(){
  const s = getSession();
  mainEl().innerHTML = `<h1 class="page-title">اعلان‌ها</h1><div class="spinner"></div>`;
  const {data, error} = await db.rpc("get_notifications", {p_user_id: s.id});
  if(error){ mainEl().innerHTML = `<h1 class="page-title">اعلان‌ها</h1><div class="card">${friendlyError(error)}</div>`; return; }
  const list = data || [];
  mainEl().innerHTML = `
    <h1 class="page-title">اعلان‌ها</h1>
    <div class="card">
      ${ list.length === 0 ? `<div class="empty"><div class="big">🔔</div>اعلانی ندارید.</div>` :
        list.map(n => `
          <div class="list-item">
            <div>
              <div class="title">${escapeHtml(n.title)}</div>
              <div class="sub">${escapeHtml(n.body || "")}</div>
            </div>
            <div class="side muted">${new Date(n.created_at).toLocaleDateString("fa-IR")}</div>
          </div>
        `).join("")
      }
    </div>
  `;
}

/* ---------------- Journey ---------------- */
function renderJourney(){
  mainEl().innerHTML = `
    <h1 class="page-title">سفر یادگیری</h1>
    <div class="card">
      <p class="muted" style="margin-top:0">پیشرفت یادگیری شما بر اساس شرکت در کلاس‌ها محاسبه می‌شود.</p>
      <div class="stat-grid">
        <div class="stat"><div class="num" id="jClasses">–</div><div class="lbl">کلاس‌های شرکت‌شده</div></div>
        <div class="stat"><div class="num" id="jRole">–</div><div class="lbl">نقش فعلی</div></div>
      </div>
    </div>
  `;
  const s = getSession();
  document.getElementById("jRole").textContent = roleLabel(s.role);
  db.rpc("get_meetings").then(({data}) => {
    document.getElementById("jClasses").textContent = (data||[]).length ? "—" : "۰";
  });
}

/* ---------------- Admin panel ---------------- */
function renderAdmin(){
  mainEl().innerHTML = `
    <h1 class="page-title">پنل مدیریت</h1>
    <div class="tabs">
      <button id="atUsers" class="active">کاربران</button>
      <button id="atClasses">کلاس‌ها</button>
    </div>
    <div id="adminBody"><div class="spinner"></div></div>
  `;
  document.getElementById("atUsers").onclick = () => { setAdminTab("users"); loadAdminUsers(); };
  document.getElementById("atClasses").onclick = () => { setAdminTab("classes"); loadAdminClasses(); };
  loadAdminUsers();
}
function setAdminTab(which){
  document.getElementById("atUsers").classList.toggle("active", which==="users");
  document.getElementById("atClasses").classList.toggle("active", which==="classes");
}
async function loadAdminUsers(){
  const s = getSession();
  const body = document.getElementById("adminBody");
  body.innerHTML = `<div class="spinner"></div>`;
  const {data, error} = await db.rpc("admin_list_users", {p_admin_id: s.id});
  if(error){ body.innerHTML = `<div class="card">${friendlyError(error)}</div>`; return; }
  body.innerHTML = `<div class="card">${(data||[]).map(u => `
    <div class="list-item">
      <div>
        <div class="title">${escapeHtml(u.name)}</div>
        <div class="sub">@${escapeHtml(u.username)}</div>
      </div>
      <div class="side">
        <select data-uid="${u.id}" class="roleSelect">
          <option value="student" ${u.role==="student"?"selected":""}>دانش‌آموز</option>
          <option value="teacher" ${u.role==="teacher"?"selected":""}>مدرس</option>
          <option value="admin" ${u.role==="admin"?"selected":""}>مدیر</option>
        </select>
      </div>
    </div>
  `).join("") || `<div class="empty">کاربری یافت نشد.</div>`}</div>`;
  document.querySelectorAll(".roleSelect").forEach(sel => {
    sel.onchange = async () => {
      const {error} = await db.rpc("admin_set_role", {p_admin_id: s.id, p_user_id: sel.dataset.uid, p_role: sel.value});
      if(error){ toast(friendlyError(error), "error"); return; }
      toast("نقش کاربر به‌روزرسانی شد.", "success");
    };
  });
}
async function loadAdminClasses(){
  const s = getSession();
  const body = document.getElementById("adminBody");
  body.innerHTML = `<div class="spinner"></div>`;
  const {data, error} = await db.rpc("admin_list_meetings", {p_admin_id: s.id});
  if(error){ body.innerHTML = `<div class="card">${friendlyError(error)}</div>`; return; }
  body.innerHTML = `<div class="card">${(data||[]).map(m => `
    <div class="list-item">
      <div>
        <div class="title">${escapeHtml(m.name)}</div>
        <div class="sub">${m.member_count}/${m.capacity} نفر</div>
      </div>
      <div class="side">
        <span class="badge badge-${m.status}">${m.status==="active"?"فعال":"بسته"}</span><br>
        <button class="btn btn-danger btn-sm" style="margin-top:.4rem" data-mid="${m.id}">حذف</button>
      </div>
    </div>
  `).join("") || `<div class="empty">کلاسی یافت نشد.</div>`}</div>`;
  body.querySelectorAll("button[data-mid]").forEach(btn => {
    btn.onclick = async () => {
      if(!confirm("این کلاس حذف شود؟")) return;
      const {error} = await db.rpc("admin_delete_meeting", {p_admin_id: s.id, p_meeting_id: btn.dataset.mid});
      if(error){ toast(friendlyError(error), "error"); return; }
      toast("کلاس حذف شد.", "success");
      loadAdminClasses();
    };
  });
}
</script>
</body>
</html>
